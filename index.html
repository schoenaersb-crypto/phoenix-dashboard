<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; frame-src https://drive.google.com https://docs.google.com; form-action 'none'; base-uri 'none'; object-src 'none'">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1E2C">
<title>Phoenix — Pilotage</title>

<!-- PWA : permet d'ajouter le dashboard à l'écran d'accueil du téléphone -->
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone.png">
<meta name="apple-mobile-web-app-title" content="Phoenix">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ════════════════════════════════════════════════
   PHOENIX PILOTAGE v25 — refonte « élégance de maison »
   Palette imposée : navy · cuivre · doré · crème
   Direction : sobriété bistronomique, hiérarchie nette,
   moins d'effets, plus de lisibilité (plein soleil, en service)
   ════════════════════════════════════════════════ */
:root{
  --navy:#16364A;
  --navy-deep:#0A1B28;
  --navy-card:#122B3D;
  --navy-card-solid:#122B3D;
  --panel-2:#0E2333;
  --copper:#B98D55;
  --gold:#D4A843;
  --gold-soft:rgba(212,168,67,.3);
  --cream:#F6F0E4;

  --ink:var(--cream);
  --ink-2:rgba(246,240,228,.7);
  --ink-3:rgba(246,240,228,.48);

  /* statuts fonctionnels — toujours accompagnés d'un texte */
  --ok:#7FA37A;
  --warn:#D4A843;
  --alert:#C4633F;

  --hair:rgba(185,141,85,.3);
  --hair-soft:rgba(185,141,85,.14);

  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Courier New',monospace;

  --pad:16px;
  --r:16px;
  --dock-h:74px;

  --shadow-1:0 6px 20px rgba(4,12,18,.35);
  --shadow-2:0 10px 30px rgba(4,12,18,.45);
  --ease:cubic-bezier(.22,.9,.3,1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}

body{
  font-family:var(--sans);
  font-weight:300;
  background:var(--navy-deep);
  color:var(--ink);
  min-height:100vh;
  padding-bottom:calc(var(--dock-h) + 26px + env(safe-area-inset-bottom));
  line-height:1.5;
  overflow-x:hidden;
}

/* ── fond : navy profond, un seul halo cuivré immobile, grain discret ──
   (l'aurora animée des versions précédentes pompait la batterie) */
.ambient{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(90% 46% at 50% -10%, rgba(185,141,85,.14), transparent 60%),
    radial-gradient(70% 50% at 50% 115%, rgba(22,54,74,.75), transparent 70%),
    linear-gradient(178deg,#081722 0%, #0A1B28 48%, #0C2231 100%);
  overflow:hidden;
}
.ambient::before{content:"";display:none}
.ambient::after{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(246,240,228,.028) 1px, transparent 1px);
  background-size:28px 28px;
  mask-image:linear-gradient(180deg,transparent,#000 15%,#000 80%,transparent);
}

/* ════════════════════════════════════════════════
   EN-TÊTE
   ════════════════════════════════════════════════ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(9,23,34,.9);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--hair-soft);
  padding:calc(13px + env(safe-area-inset-top)) var(--pad) 12px;
}
.topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

.wordmark{
  font-family:var(--serif);
  font-size:23px;letter-spacing:.04em;line-height:1.1;
  font-weight:600;white-space:nowrap;
}
.wordmark em{
  font-style:normal;
  background:linear-gradient(100deg,#E9CD87 0%, var(--gold) 55%, var(--copper) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:var(--gold);
}

.service-state{display:inline-flex;align-items:center;gap:7px;margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;position:relative}
.dot::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1px solid var(--ok);opacity:.45;
  animation:pulse 2.6s ease-out infinite;
}
.dot.closed{background:var(--copper);opacity:.55}
.dot.closed::after{display:none}
@keyframes pulse{0%{transform:scale(.5);opacity:.5}80%,100%{transform:scale(1.5);opacity:0}}

.stamp{
  font-family:var(--mono);
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--copper);line-height:1.55;
}
.stamp.right{text-align:right;white-space:nowrap}
.sync{color:var(--ink-3);letter-spacing:.11em;cursor:pointer}

/* ════════════════════════════════════════════════
   CONTENU
   ════════════════════════════════════════════════ */
main{padding:16px var(--pad) 0}

.panel{display:none}
.panel.on{display:block;animation:rise .28s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── accès de l'équipe ── */
.acc-li{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--hair-soft);
 border-radius:12px;margin-bottom:7px;background:var(--panel-2)}
.acc-li.off{opacity:.5}
.acc-li .c{flex:1;min-width:0}
.acc-li .n{font-size:15px}
.acc-li .m{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.acc-li .b{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--hair);
 font-size:11.5px;color:var(--ink-2);background:none;cursor:pointer;min-height:34px}
.acc-li .b.on{border-color:var(--alert);color:var(--alert)}
.acc-dot{width:8px;height:8px;border-radius:50%;flex:none}
.acc-dot.ok{background:var(--ok)}.acc-dot.no{background:var(--alert)}
.acc-form{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acc-form input{flex:1;min-width:130px;padding:12px;border-radius:11px;border:1px solid var(--hair-soft);
 background:rgba(6,16,24,.5);color:var(--cream);font-family:inherit;font-size:14.5px}
.acc-form input:focus{outline:2px solid var(--gold);outline-offset:-1px}
.acc-form button{flex:none;padding:12px 18px;border-radius:11px;background:var(--gold);
 color:var(--navy-deep);font-weight:600;font-size:14.5px;border:0;cursor:pointer}
.acc-msg{font-size:12.5px;margin-top:9px;min-height:16px}
.acc-note{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:10px}

/* ── cartes : panneaux pleins, liseré cuivre, une ombre calme ── */
.card{
  position:relative;
  background:var(--navy-card);
  border:1px solid var(--hair-soft);
  border-radius:var(--r);
  padding:16px 15px;
  margin-bottom:12px;
  box-shadow:var(--shadow-1);
}
.card.hero{
  background:linear-gradient(172deg,#153043 0%, #102638 100%);
  border-color:var(--hair);
  box-shadow:var(--shadow-2);
}
.card.hero::before{
  content:"";position:absolute;top:0;left:15px;right:auto;bottom:auto;width:34px;height:2px;
  background:linear-gradient(90deg,var(--gold),var(--copper));
  border-radius:0 0 2px 2px;pointer-events:none;
}

.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-t,
.card-label{
  font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--copper);
  margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.card-h .card-t{margin-bottom:0}
.card-label::after{content:"";flex:1;height:1px;background:var(--hair-soft)}

/* chiffres — nets, sans dégradé : la donnée n'a pas besoin de maquillage */
.figure{
  font-family:var(--sans);font-weight:600;
  font-size:40px;line-height:1.05;letter-spacing:-.01em;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.hero .figure > span[data-count]{color:var(--ink);background:none;-webkit-text-fill-color:currentColor;filter:none}
.figure .unit{font-size:14px;font-weight:400;color:var(--copper);margin-left:4px}
.figure-sub{font-size:13.5px;color:var(--ink-2);margin-top:7px}

.delta{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12.5px;font-weight:500;
  font-family:var(--sans);
  border:1px solid currentColor;border-radius:999px;
  padding:3px 10px;margin-left:10px;vertical-align:6px;
}
.delta.up{color:var(--ok)}
.delta.down{color:var(--alert)}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .card{margin-bottom:0}
.duo .figure{font-size:26px}

/* ── graphique (SVG) ── */
.chart-wrap{margin-top:15px;position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.bar{cursor:pointer}
.bar rect.hit{fill:transparent}
.bar path.mark{fill:var(--copper);opacity:.42;transition:opacity .18s}
.bar.now path.mark{fill:var(--gold);opacity:1;filter:none}
.bar.hov path.mark{opacity:.78}
.bar.now.hov path.mark{opacity:1}
.axis-lab{font-family:var(--mono);font-size:9px;letter-spacing:.06em;fill:var(--ink-3)}
.bar-lab{font-family:var(--sans);font-weight:500;font-size:11px;fill:var(--ink)}
.gridline{stroke:rgba(246,240,228,.09);stroke-width:1}

.tip{
  position:absolute;z-index:5;pointer-events:none;
  background:var(--navy-deep);
  border:1px solid var(--hair);border-radius:9px;
  padding:7px 10px;
  font-size:12px;color:var(--ink);
  white-space:nowrap;
  transform:translate(-50%,-108%);
  box-shadow:var(--shadow-1);
  opacity:0;transition:opacity .14s;
}
.tip .t-meta{color:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.08em}
.tip.on{opacity:1}

/* ── jauges (heures équipe) ── */
.meter-row{padding:11px 0;border-top:1px solid var(--hair-soft)}
.meter-row:first-of-type{border-top:0}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.meter-name{font-size:14.5px}
.meter-val{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.meter{height:5px;border-radius:99px;background:rgba(246,240,228,.08);overflow:hidden}
.meter i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--copper),var(--gold));
  width:0;transition:width .8s var(--ease);
}

/* ── lignes de liste ── */
.row{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 0;
  border-top:1px solid var(--hair-soft);
}
.row:first-of-type{border-top:0}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:400}
.row-meta{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.row-value{
  font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:3.5px 8px;border-radius:6px;
  border:1px solid currentColor;
  margin-top:6px;
  background:rgba(9,23,34,.4);
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.ok{color:var(--ok)}
.tag.warn{color:var(--warn)}
.tag.alert{color:var(--alert)}
.tag.ech{background:rgba(90,140,180,.14);color:#8fb8d8;border-color:rgba(140,180,215,.35)}

/* ressenti : 5 points */
.feel{display:inline-flex;gap:3px;margin-top:6px;vertical-align:middle}
.feel i{width:7px;height:7px;border-radius:50%;background:rgba(246,240,228,.13)}
.feel.ok i.f{background:var(--ok)}
.feel.warn i.f{background:var(--warn)}
.feel.alert i.f{background:var(--alert)}

.stars{font-family:var(--mono);font-size:13px;color:var(--gold);letter-spacing:.1em}

/* ── factures ── */
.frow{margin-top:12px}
.frow:first-child{margin-top:6px}
.frow-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.frow-name{font-size:13.5px;color:var(--ink)}
.frow-val{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fbar-track{height:6px;border-radius:4px;background:rgba(246,240,228,.07);overflow:hidden}
.fbar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--copper),var(--gold));transition:width .6s var(--ease)}
.fbar-fill.alert{background:linear-gradient(90deg,#b0603f,#C4633F)}
.caret{display:inline-block;color:var(--copper);font-size:11px;transition:transform .18s;transform-origin:center}
.facture-head:hover .row-title{color:var(--gold)}
.facture-detail{max-height:0;overflow:hidden;transition:max-height .28s ease;border-left:2px solid var(--gold-soft);margin:0 0 0 6px}
.facture-detail.on{max-height:600px}
.pline{display:grid;grid-template-columns:64px 1fr auto auto;gap:8px;align-items:baseline;
  padding:6px 10px;font-size:12.5px;color:var(--ink-2)}
.pline .pref{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.pline .pdes{color:var(--ink)}
.pline .pqte{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.pline .ppu{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-3)}
.pline-empty{display:block;color:var(--ink-3);font-style:italic;padding:8px 10px}
.fpreuve{font-size:10.5px;color:var(--ink-3);margin-top:4px;line-height:1.4;font-style:italic}
.fnb{font-size:10px;color:var(--ink-3);letter-spacing:.04em}
.fvar{font-size:10px;color:var(--ink-3);opacity:.75;margin-top:3px;line-height:1.35}
.fpdf{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  color:var(--gold);text-decoration:none;border:1px solid rgba(212,168,67,.35);border-radius:999px;padding:4px 10px;margin-top:6px;min-height:26px}
.fpdf:active{background:rgba(212,168,67,.15)}
.fpdf.off{color:var(--ink-3);opacity:.55;text-decoration:none;cursor:default}

/* ── états vides / erreurs / chargement ── */
.state{
  text-align:center;
  padding:44px 22px;
  color:var(--ink-2);
  font-size:14px;
}
.state .glyph{
  width:52px;height:52px;margin:0 auto 16px;
  border:1px solid var(--hair);border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  color:var(--copper);
  background:rgba(185,141,85,.06);
}
.state strong{
  display:block;
  font-family:var(--serif);font-size:23px;font-weight:600;
  color:var(--ink);margin-bottom:8px;
}
.state code{font-family:var(--mono);font-size:12px;color:var(--gold);word-break:break-all}

.skel{border-radius:var(--r);height:116px;margin-bottom:12px;position:relative;overflow:hidden;
  background:var(--panel-2);border:1px solid var(--hair-soft)}
.skel::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(246,240,228,.05) 50%,transparent 70%);
  animation:shimmer 1.6s infinite;
}
.skel.sm{height:76px}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ════════════════════════════════════════════════
   DOCK BAS — navigation + action IA
   ════════════════════════════════════════════════ */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:0 12px calc(10px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.dock-inner{
  pointer-events:auto;
  position:relative;
  height:var(--dock-h);
  max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:repeat(3,1fr) 64px repeat(3,1fr);
  align-items:stretch;
  background:rgba(9,23,34,.94);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--hair-soft);
  border-radius:22px;
  box-shadow:0 14px 40px rgba(4,12,18,.55);
}
.dock-btn{
  background:none;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ink-3);
  font-family:var(--sans);font-size:9.5px;letter-spacing:.02em;font-weight:400;
  transition:color .2s;
  border-radius:18px;
  min-width:0;
  position:relative;
}
.dock-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dock-btn[aria-selected="true"]{color:var(--gold);font-weight:500;text-shadow:none}
.dock-btn[aria-selected="true"]::before{
  content:"";position:absolute;bottom:8px;top:auto;left:50%;transform:translateX(-50%);
  width:14px;height:2px;border-radius:2px;
  background:var(--gold);
}
.dock-btn:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}

/* ─── module Résa ─── */
.resa-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.rstat{background:var(--navy-card);backdrop-filter:none;-webkit-backdrop-filter:none;
  border:1px solid var(--hair-soft);border-radius:14px;padding:12px 10px;text-align:center}
.rstat .rs-num{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1;color:var(--gold);filter:none}
.rstat .rs-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.rseg{display:flex;background:var(--panel-2);backdrop-filter:none;-webkit-backdrop-filter:none;
  border:1px solid var(--hair-soft);border-radius:999px;padding:3px;margin-bottom:13px;box-shadow:none}
.rseg button{flex:1;background:none;border:0;border-radius:999px;padding:10px 8px;cursor:pointer;
  font-family:var(--sans);font-size:13px;color:var(--ink-2);transition:color .2s;min-height:38px}
.rseg button.on{
  background:var(--gold);
  color:var(--navy-deep);font-weight:600;
  box-shadow:none;
}
.rday{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 9px}
.rday:first-child{margin-top:2px}
.rday .rd-t{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);text-transform:capitalize}
.rday .rd-c{font-family:var(--mono);font-size:11px;color:var(--copper)}
.rcard{display:flex;align-items:center;gap:12px;
  background:var(--navy-card);backdrop-filter:none;-webkit-backdrop-filter:none;
  border:1px solid var(--hair-soft);
  border-radius:14px;padding:12px 13px;margin-bottom:8px}
.rcard.warn{border-color:var(--gold-soft);background:linear-gradient(172deg,#183350 0%, #122B3D 100%);box-shadow:none}
.rcard.incomplet{border-left:2px solid var(--copper)}
.rcard .rc-h{font-family:var(--mono);font-size:15px;color:var(--gold);min-width:50px;filter:none}
.rcard .rc-mid{flex:1;min-width:0}
.rcard .rc-nom{font-size:15.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .rc-sub{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
.rcard .rc-note{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-2);margin-top:3px}
.rcard .rc-cvt{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink);min-width:34px;text-align:center;line-height:1}
.rcard .rc-cvt small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--ink-3);margin-top:2px;font-weight:400}
.rchip{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid transparent}
.rchip.thefork{background:rgba(127,163,122,.14);color:#9DC498;border-color:rgba(127,163,122,.3)}
.rchip.whatsapp{background:rgba(101,163,163,.14);color:#8FC7C7;border-color:rgba(101,163,163,.3)}
.rchip.web{background:rgba(212,168,67,.12);color:var(--gold);border-color:rgba(212,168,67,.3)}
.rchip.email{background:rgba(185,141,85,.14);color:var(--copper);border-color:rgba(185,141,85,.32)}
.rchip.autre{background:rgba(246,240,228,.07);color:var(--ink-2);border-color:var(--hair-soft)}
.rchip.valider{background:rgba(212,168,67,.18);color:var(--warn);border-color:rgba(212,168,67,.5);font-weight:600}
.rchip.manq{background:rgba(185,141,85,.14);color:var(--copper);border:1px solid rgba(185,141,85,.35)}
.resa-vide{text-align:center;padding:26px 10px;color:var(--ink-3);font-size:13.5px}

/* ── Ventes multi-périodes ── */
.vnav{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.vnav-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--hair);
  background:var(--panel-2);backdrop-filter:none;-webkit-backdrop-filter:none;
  color:var(--gold);font-size:18px;cursor:pointer;line-height:1;
  box-shadow:none;transition:background .2s}
.vnav-btn:not(:disabled):active{background:rgba(212,168,67,.14);box-shadow:none}
.vnav-btn:disabled{opacity:.22;cursor:default}
.vnav-lab{font-family:var(--serif);font-size:22px;font-weight:600;text-transform:capitalize;text-align:center;flex:1;
  background:none;-webkit-background-clip:initial;background-clip:initial;-webkit-text-fill-color:currentColor;color:var(--ink)}
.vdeltas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vdelta{font-family:var(--mono);font-size:10.5px;padding:4px 10px;border-radius:999px;border:1px solid transparent}
.vdelta.up{background:rgba(127,163,122,.13);color:#9DC498;border-color:rgba(127,163,122,.3)}
.vdelta.down{background:rgba(196,106,91,.13);color:#D99C8F;border-color:rgba(196,106,91,.3)}
.vdelta.na{background:rgba(246,240,228,.06);color:var(--ink-3);border-color:var(--hair-soft)}
.vbest{margin-top:10px;font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ink-2)}

/* ── Accueil : recap + objectifs ── */
.acc-hello{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;
  background:none;-webkit-background-clip:initial;background-clip:initial;-webkit-text-fill-color:currentColor;color:var(--ink)}
.acc-date{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--copper);margin:4px 0 15px}
.acc-hero-in{display:flex;align-items:center;gap:16px;margin:4px 0 13px}
.ring-wrap{flex:none;width:128px;text-align:center}
.ring{width:128px;height:128px;display:block}
.ring-bg{fill:none;stroke:rgba(246,240,228,.09);stroke-width:8}
.ring-val{fill:none;stroke-width:8;stroke-linecap:round;filter:none;
  transition:stroke-dasharray .8s var(--ease)}
.ring-pct{font-family:var(--sans);font-weight:600;font-size:27px;fill:var(--cream);text-anchor:middle}
.ring-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;fill:rgba(246,240,228,.45);text-anchor:middle}
.ring-cap{font-family:var(--sans);font-weight:600;font-size:15px;color:var(--gold);margin-top:2px}
.acc-hero-txt{flex:1;min-width:0}
.ah-obj{font-family:var(--sans);font-weight:600;font-size:22px;color:var(--ink)}
.ah-obj small{font-size:12px;font-weight:300;color:var(--ink-2)}
.ah-reste{font-size:13px;color:var(--ink-2);margin-top:4px}
.ah-reste.ok{color:var(--ok);font-weight:500}
.ah-last{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3);margin-top:8px}
.abar{margin-top:13px}
.abar-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:5px}
.abar-val{font-family:var(--mono);font-size:11px;color:var(--ink)}
.abar-val em{font-style:normal;color:var(--ink-3)}
.abar-track{height:8px;border-radius:999px;background:rgba(246,240,228,.07);overflow:hidden;box-shadow:none}
.abar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--copper),var(--gold));
  box-shadow:none;transition:width .8s var(--ease)}
.abar-fill.full{background:linear-gradient(90deg,#6E9A69,var(--ok))}
.abar-pct{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);margin-top:4px;text-align:right}
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.atile{text-align:left;cursor:pointer;border-radius:14px;padding:14px;
  background:var(--navy-card);backdrop-filter:none;-webkit-backdrop-filter:none;
  border:1px solid var(--hair-soft);
  color:var(--ink);font-family:var(--sans);
  transition:border-color .2s;min-height:44px}
.atile:active{transform:scale(.97)}
.atile .at-num{font-weight:600;font-size:21px;color:var(--gold);filter:none;font-variant-numeric:tabular-nums}
.atile .at-num small{font-size:12px;font-weight:300;color:var(--ink-2)}
.atile .at-lbl{font-size:12px;color:var(--ink-2);margin-top:3px}
.atile .rchip{display:inline-block;margin-top:7px}

/* ── modales ── */
.resa-ov{position:fixed;inset:0;background:rgba(6,15,22,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:99;display:flex;align-items:center;justify-content:center;padding:18px}
.resa-modal{width:100%;max-width:380px;max-height:88vh;overflow:auto;background:#132C3F;border:1px solid var(--hair);border-radius:16px;padding:18px;box-shadow:var(--shadow-2)}
.rlab{display:block;margin:10px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.rlab input,.rlab select,.rlab textarea{width:100%;margin-top:5px;padding:11px;border-radius:11px;border:1px solid var(--hair-soft);background:rgba(6,16,24,.5);color:var(--cream);font:inherit;font-size:15px}
.rlab input:focus,.rlab select:focus,.rlab textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
.resa-act{display:flex;gap:9px;margin-top:16px}
.rbtn{flex:1;padding:12px;border-radius:12px;border:0;background:var(--gold);color:var(--navy-deep);font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.rbtn.ghost{background:transparent;border:1px solid rgba(246,240,228,.22);color:var(--ink-2)}
.rbtn.danger{background:transparent;border:1px solid rgba(196,99,63,.5);color:#d98a74}
.rmsg{margin-top:9px;font-size:12px;color:var(--ink-2);min-height:15px;text-align:center}
.fseg{margin-bottom:9px}
.fsearch{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--hair-soft);background:rgba(6,16,24,.5);color:var(--cream);font:inherit;font-size:14px}
.fsearch:focus{outline:2px solid var(--gold);outline-offset:-1px}
.resa-plus{width:100%;background:none;border:1px dashed var(--hair);border-radius:12px;color:var(--copper);
  font-family:var(--sans);font-size:13px;padding:12px;cursor:pointer;margin-top:4px;min-height:44px}
.caprow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--hair-soft);font-size:13px;cursor:pointer}
.caprow:last-of-type{border-bottom:0}
.caprow input{width:17px;height:17px;accent-color:var(--gold);flex:0 0 auto}
.cap-h{font-family:var(--mono);font-size:12px;color:var(--gold);flex:0 0 42px}
.cap-n{flex:1 1 auto;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-c{flex:0 0 auto;color:var(--ink-2);font-size:12px}
.cap-s{flex:0 0 auto;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.caprow.neuf .cap-s{color:var(--copper)}

/* l'orbe central — le résumé IA */
.orb{
  position:relative;align-self:center;justify-self:center;
  width:56px;height:56px;margin-top:-30px;
  border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(140deg,#E7C264 0%, var(--gold) 45%, var(--copper) 100%);
  color:var(--navy-deep);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(212,168,67,.35), 0 3px 8px rgba(4,12,18,.4);
  transition:transform .15s var(--ease);
}
.orb::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1px solid var(--gold-soft);
  animation:none;border-top-color:var(--gold-soft);
}
.orb:active{transform:scale(.93)}
.orb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.orb:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.orb-label{
  position:absolute;left:50%;transform:translateX(-50%);bottom:6px;
  font-family:var(--sans);font-size:10px;letter-spacing:.05em;color:var(--ink-3);
  pointer-events:none;
}

/* ════════════════════════════════════════════════
   TICKET IA — papier thermique (élément signature)
   ════════════════════════════════════════════════ */
.scrim{
  position:fixed;inset:0;z-index:60;
  background:rgba(5,13,19,.74);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.scrim.on{opacity:1;pointer-events:auto}

.ticket-wrap{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  transform:translateY(103%);
  transition:transform .34s var(--ease);
  max-height:88vh;display:flex;flex-direction:column;
  padding:0 10px;
}
.ticket-wrap.on{transform:none}

.ticket{
  background:var(--cream);
  color:#2A2118;
  border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;
  overflow:hidden;
  max-height:88vh;
  box-shadow:0 -14px 44px rgba(4,12,18,.55);
}
.ticket-head{
  flex:none;
  padding:15px 18px 12px;
  border-bottom:1px dashed rgba(42,33,24,.3);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.ticket-title{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.19em;text-transform:uppercase}
.ticket-close{background:none;border:0;cursor:pointer;font-family:var(--mono);font-size:16px;color:#2A2118;padding:6px 10px;min-height:34px}
.ticket-close:focus-visible{outline:2px solid var(--copper)}

.ticket-body{
  flex:1;overflow-y:auto;
  padding:16px 18px;
  font-family:var(--mono);font-size:12.5px;line-height:1.72;
  -webkit-overflow-scrolling:touch;
}
.msg{margin-bottom:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{padding-left:12px;border-left:2px solid var(--copper);color:#5A4A34}
.ticket-rule{border:0;border-top:1px dashed rgba(42,33,24,.28);margin:14px 0}

.ticket-foot{
  flex:none;
  border-top:1px dashed rgba(42,33,24,.3);
  padding:11px 12px calc(11px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:flex-end;
  background:var(--cream);
}
.ticket-foot textarea{
  flex:1;resize:none;
  font-family:var(--mono);font-size:13px;line-height:1.5;
  color:#2A2118;background:rgba(42,33,24,.05);
  border:1px solid rgba(42,33,24,.18);border-radius:9px;
  padding:10px 11px;max-height:110px;
}
.ticket-foot textarea:focus{outline:2px solid var(--copper);outline-offset:-1px}
.send{
  flex:none;background:var(--navy);color:var(--cream);
  border:0;border-radius:9px;
  font-family:var(--sans);font-size:14px;font-weight:500;
  padding:12px 15px;cursor:pointer;min-height:44px;
}
.send:disabled{opacity:.4;cursor:default}

.chips{display:flex;gap:7px;overflow-x:auto;padding:0 18px 13px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-family:var(--sans);font-size:12px;
  color:#5A4A34;background:rgba(42,33,24,.06);
  border:1px solid rgba(42,33,24,.16);border-radius:999px;
  padding:8px 13px;cursor:pointer;min-height:34px;
}
.typing{color:#8A7A62;font-style:italic}

/* ── porte d'accès (code admin) ── */
.gate{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:var(--navy-deep);padding:26px}
.gate.on{display:flex}
.gate-card{width:100%;max-width:330px;text-align:center}
.gate-card .wordmark{font-size:30px;margin-bottom:6px}
.gate-sub{font-size:13.5px;color:var(--ink-2);margin-bottom:22px}
.gate-input{width:100%;text-align:center;
  font-family:var(--mono);font-size:19px;letter-spacing:.35em;
  color:var(--ink);background:var(--navy-card);
  border:1px solid var(--hair);border-radius:13px;
  padding:14px 12px;margin-bottom:12px}
.gate-input:focus{outline:2px solid var(--gold);outline-offset:-1px}
.gate-btn{width:100%;font-family:var(--sans);font-size:15px;font-weight:500;
  color:var(--navy-deep);background:var(--gold);border:0;border-radius:13px;
  padding:14px;cursor:pointer;min-height:48px}
.gate-err{font-size:12.5px;color:var(--alert);margin-top:10px;min-height:18px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (min-width:720px){
  body{max-width:680px;margin:0 auto}
  .ticket-wrap{max-width:680px;margin:0 auto}
}

/* ─── ÉQUIPE : la grille des heures ─────────────────────────────── */
.eq-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.eq-nav button{
  background:transparent;border:1px solid var(--hair);color:var(--gold);
  width:32px;height:32px;border-radius:9px;font-size:17px;line-height:1;cursor:pointer;flex:none;
  font-family:var(--sans)
}
.eq-nav button:disabled{opacity:.28;cursor:default}
.eq-titre{flex:1;text-align:center;line-height:1.25}
.eq-titre b{display:block;font-size:14.5px;font-weight:400}
.eq-titre span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.04em}

.eq-kpi{display:flex;gap:8px;margin-bottom:14px}
.eq-kpi div{
  flex:1;text-align:center;padding:9px 4px;border-radius:12px;
  background:rgba(212,168,67,.07);border:1px solid var(--hair-soft)
}
.eq-kpi b{display:block;font-family:var(--mono);font-size:15px;color:var(--gold);font-weight:500}
.eq-kpi span{display:block;font-size:10px;color:var(--ink-3);margin-top:2px;letter-spacing:.03em}

.eq-grid{display:grid;grid-template-columns:58px repeat(7,1fr);gap:3px;align-items:stretch}
.eq-gh{
  font-size:10.5px;color:var(--ink-3);text-align:center;padding:2px 0 5px;
  letter-spacing:.06em;line-height:1.2
}
.eq-gh span{display:block;font-family:var(--mono);font-size:9.5px;opacity:.6}
.eq-gh.we{color:var(--copper)}
.eq-nom{
  font-size:12px;display:flex;align-items:center;padding-right:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.eq-nom.tot{color:var(--copper);font-size:11px;letter-spacing:.05em}
.eq-c{
  position:relative;border-radius:8px;background:rgba(212,168,67,.1);
  min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:background .15s;padding:4px 1px 6px
}
.eq-c.we{background:rgba(185,141,85,.13)}
.eq-c:hover,.eq-c:focus{background:rgba(212,168,67,.22);outline:none}
.eq-c b{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--cream)}
.eq-c.vide{background:transparent;color:var(--ink-3);font-size:12px;cursor:default;border:1px dashed var(--hair-soft)}
.eq-c.vide:hover{background:transparent}
.eq-c.tot{background:transparent;border-top:1px solid var(--hair-soft);border-radius:0;
  min-height:28px;cursor:default}
.eq-c.tot,.eq-c.tot b{font-family:var(--mono);font-size:11.5px;color:var(--copper)}
.eq-c.pb{box-shadow:inset 0 0 0 1px var(--warn)}
/* le trait midi / soir sous le chiffre */
.eq-c i{display:block;width:76%;height:4px;border-radius:2px;background:var(--gold);margin-top:4px;overflow:hidden}
.eq-c i u{display:block;height:100%;background:#8E6B3F;text-decoration:none}
/* le point qui dit « en poste en ce moment » */
.eq-c s{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;
  background:var(--ok);text-decoration:none}

.eq-leg{display:flex;flex-wrap:wrap;gap:11px;margin-top:11px;font-size:10.5px;color:var(--ink-3);align-items:center}
.eq-leg span{display:flex;align-items:center;gap:4px}
.eq-leg i.lg{width:11px;height:3px;border-radius:2px;display:inline-block}
.eq-leg i.midi{background:#8E6B3F}
.eq-leg i.soir{background:var(--gold)}
.eq-leg i.pb{background:transparent;box-shadow:inset 0 0 0 1px var(--warn);height:9px;width:9px;border-radius:3px}
.eq-astuce{font-style:italic;opacity:.7;flex-basis:100%;margin-top:1px}

.eq-actions{display:flex;align-items:center;gap:10px;margin-top:13px;
  padding-top:11px;border-top:1px solid var(--hair-soft)}
.eq-actions button{
  background:transparent;border:1px solid var(--hair);color:var(--gold);
  border-radius:8px;padding:5px 11px;font-family:var(--sans);font-size:11.5px;cursor:pointer
}
.eq-actions span{font-size:10.5px;color:var(--ink-3)}

.eq-seance{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-top:5px;font-size:12.5px}
.eq-seance .h{font-family:var(--mono);color:var(--ink)}
.eq-seance .h em{font-style:normal;color:var(--ok)}
.eq-seance .d{font-family:var(--mono);color:var(--ink-2);font-size:11.5px}
.eq-seance .s{
  font-size:10px;letter-spacing:.05em;padding:1px 6px;border-radius:20px;
  background:rgba(185,141,85,.2);color:var(--copper)
}
.eq-seance .s.soir{background:rgba(212,168,67,.18);color:var(--gold)}
.eq-seance .s.journee{background:rgba(127,163,122,.18);color:var(--ok)}
.eq-seance .s.pb{background:rgba(212,168,67,.18);color:var(--warn)}

.eq-sous{font-size:11px;color:var(--ink-3);margin-top:4px}
.eq-ct{
  background:transparent;border:1px solid var(--hair-soft);color:var(--ink-3);
  border-radius:20px;padding:0 7px;font-family:var(--sans);font-size:10px;cursor:pointer;
  margin-left:5px;vertical-align:1px
}
.eq-ct:hover{border-color:var(--hair);color:var(--gold)}

@media (max-width:360px){
  .eq-grid{grid-template-columns:46px repeat(7,1fr);gap:2px}
  .eq-c b{font-size:11.5px}
  .eq-nom{font-size:11px}
}

/* la ligne du rendement : ce qu'une heure de travail a rapporté ce jour-là */
.eq-nom.sub{color:var(--ink-3);font-size:10.5px;letter-spacing:.04em}
/* v23 — choisir qui apparait dans le tableau */
.eq-qui{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.eq-chip{background:transparent;border:1px solid var(--hair-soft);color:var(--ink-2);
  font-family:inherit;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.eq-chip:hover{border-color:var(--hair);color:var(--cream)}
.eq-chip.on{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,.10)}
.eq-c b.inc{color:var(--warn)}
/* une case nourrie par la fiche de fin de service, pas par la pointeuse */
.eq-c.dec{background:transparent;box-shadow:inset 0 0 0 1px var(--hair-soft)}
.eq-c.dec i{opacity:.55}
.eq-leg i.dec{background:transparent;box-shadow:inset 0 0 0 1px var(--hair);height:9px;width:9px;border-radius:3px}
.eq-note{font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.eq-c.sub{background:transparent;min-height:22px;cursor:default;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding:0}
.eq-c.sub.we{background:transparent}
</style>
</head>

<body>
<div class="ambient" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-row">
    <div>
      <div class="wordmark">Brasserie <em>Phoenix</em></div>
      <div class="service-state">
        <span class="dot" id="dot"></span>
        <span class="stamp" id="serviceState">—</span>
      </div>
    </div>
    <div class="stamp right">
      <div id="stampDate">—</div>
      <div class="sync" id="stampSync"></div>
    </div>
  </div>
</header>

<main>

<script>
/* ═══════════════════════════════════════════════════════
   CONFIGURATION — colle ici l'URL de ton Apps Script
   (ou ouvre la page avec ?api=TON_URL pour tester)
   ═══════════════════════════════════════════════════════ */
var CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbw4M6kbboHLRlj84PoO3CdrxcuxKKxlpq-CWph5V3meq4pwISTZ8PZJIK5cCerTxD0PLQ/exec"
};

/* SECURITE : la surcharge par ?api= a été retirée le 30/07/2026. Elle permettait
   à un lien piégé portant le vrai domaine de détourner les envois — et donc les
   codes — vers un serveur étranger. L'adresse de production est la seule valable. */
var API = CONFIG.API_URL;

var DATA = null;
var HISTORY = [];
/* v22 — reactivite : on ne redessine que si les donnees ont bouge,
   et on ne redemande pas le classeur a chaque retour dans l'app. */
var DERNIER_CHARGE = 0;
var EMPREINTE = '';
function empreinteDe(j){
  /* l'heure de generation change a chaque reponse : on la retire avant de
     comparer, sinon rien ne serait jamais 'identique'. */
  try {
    var t = JSON.stringify(j), i = t.indexOf('"genere"');
    if(i >= 0){ var f = t.indexOf(',', i); if(f > i) t = t.slice(0, i) + t.slice(f + 1); }
    return t;
  } catch(_) { return String(Math.random()); }
}
var ADMIN = '';
try { ADMIN = localStorage.getItem('phx_admin') || ''; } catch(_){}
function askGate(msg){
  el('gateErr').textContent = msg || '';
  el('gate').classList.add('on');
  setTimeout(function(){ el('gateInput').focus(); }, 120);
}
function gateSubmit(){
  var v = el('gateInput').value.trim();
  if(!v) return;
  ADMIN = v;
  try { localStorage.setItem('phx_admin', v); } catch(_){}
  el('gate').classList.remove('on');
  el('gateInput').value = '';
  load();
}
var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var EUR  = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
var EUR2 = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2});

/* ─── utilitaires ─────────────────────────────────── */
function esc(s){
  /* l'apostrophe compte autant que le guillemet : sans elle, une donnée
     venue d'un fournisseur peut sortir d'un attribut et devenir du code */
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function el(id){return document.getElementById(id)}

function stars(n){
  var v = Math.round(Number(n)||0), s='';
  for(var i=0;i<5;i++) s += (i<v?'★':'·');
  return s;
}
function feel(n){
  var v = Math.round(Number(n)||0);
  var cls = v>=4?'ok':(v>=3?'warn':'alert');
  var h = '<span class="feel '+cls+'" aria-hidden="true">';
  for(var i=1;i<=5;i++) h += '<i class="'+(i<=v?'f':'')+'"></i>';
  return h+'</span>';
}
function glyph(path){
  return '<div class="glyph"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg></div>';
}
function stateBlock(icon, titre, texte){
  return '<div class="state">'+glyph(icon)+'<strong>'+esc(titre)+'</strong>'+texte+'</div>';
}

/* compteur animé — chiffres, jamais colorés données */
function countUp(node, target, fmt){
  if(REDUCED || target === 0){ node.textContent = fmt(target); return; }
  var t0 = null, dur = 750;
  function step(ts){
    if(!t0) t0 = ts;
    var p = Math.min((ts - t0)/dur, 1);
    var e = 1 - Math.pow(1-p, 3);
    node.textContent = fmt(target * e);
    if(p < 1) requestAnimationFrame(step);
    else node.textContent = fmt(target);
  }
  requestAnimationFrame(step);
}
function animateFigures(root){
  root.querySelectorAll('[data-count]').forEach(function(n){
    var v = parseFloat(n.getAttribute('data-count')) || 0;
    var kind = n.getAttribute('data-fmt');
    var fmt = kind==='eur' ? function(x){return EUR.format(x)}
            : kind==='dec' ? function(x){return x.toFixed(2)}
            : function(x){return String(Math.round(x))};
    countUp(n, v, fmt);
  });
  root.querySelectorAll('.meter i').forEach(function(m){
    var w = m.getAttribute('data-w');
    requestAnimationFrame(function(){ m.style.width = w + '%'; });
  });
}

/* ─── en-tête : date + statut + synchro ───────────── */
function paintHeader(){
  var d = new Date();
  var jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  el('stampDate').textContent = jours[d.getDay()] + ' ' +
    d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long'});

  /* horaires été 2026 : jeudi→mardi dès 18h, fermé mercredi, + dimanche midi */
  var jour = d.getDay(), h = d.getHours();
  var ferme = (jour === 3);
  var enService = !ferme && (h >= 18 || (jour === 0 && h >= 12 && h < 16));

  el('dot').className = 'dot' + (enService ? '' : ' closed');
  el('serviceState').textContent =
    ferme ? 'Fermé — mercredi' : (enService ? 'En service' : 'Hors service');
}

/* ─── chargement des données ──────────────────────── */
/* rendu blindé : une section qui casse n'entraîne plus les autres */
function renderTout(){
  var j = DATA;
  el('stampSync').textContent = (j.genere ? ('synchro ' + String(j.genere).slice(11,16)) : '') + ' · v25';
  [['renderAccueil',renderAccueil],['renderVentes',renderVentes],['renderResa',renderResa],['renderEquipe',renderEquipe],
   ['renderFactures',renderFactures],['renderAvis',renderAvis]].forEach(function(p){
    try { p[1](); }
    catch(err){
      var ids = {renderAccueil:'p-accueil',renderVentes:'p-ventes',renderResa:'p-resa',renderEquipe:'p-equipe',renderFactures:'p-factures',renderAvis:'p-avis'};
      var box = el(ids[p[0]]);
      if(box) box.innerHTML = '<div class="card"><div class="card-label">Section indisponible</div>'
        + '<div class="row-meta">' + esc(p[0]) + ' : ' + esc(err.message||String(err)) + '</div></div>';
    }
  });
}
function skeletons(){
  ['ventes','equipe','factures','avis'].forEach(function(k){
    el('p-'+k).innerHTML = '<div class="skel"></div><div class="skel sm"></div><div class="skel sm"></div>';
  });
}
function load(){
  if(!API){
    var aide = '<div class="state">'+glyph('<path d="M9 12h6M12 9v6"/><circle cx="12" cy="12" r="8.5"/>')
      + '<strong>Dashboard pas encore relié</strong>'
      + 'Ouvre ce fichier et colle l\'URL de ton Apps Script dans <code>CONFIG.API_URL</code>, '
      + 'tout en haut du script.<br><br>Pour tester sans modifier le fichier, ajoute '
      + '<code>?api=TON_URL</code> à la fin de l\'adresse.</div>';
    ['ventes','equipe','factures','avis'].forEach(function(k){ el('p-'+k).innerHTML = aide; });
    return;
  }

  if(!DATA){
    /* La dernière photo des données s'affiche tout de suite ; la
       fraîche la remplace dès que le classeur a répondu. */
    try{
      var vieux = JSON.parse(localStorage.getItem('phx_pilotage_data') || 'null');
      if(vieux && vieux.ok !== false){ DATA = vieux; EMPREINTE = empreinteDe(vieux); renderTout(); }
    }catch(_){ }
    if(!DATA) skeletons();
  }

  if(!ADMIN){ askGate(); return; }
  /* POST (text/plain) plutôt que GET : évite l'échec cross-origin d'Apps Script sur iPhone/Safari */
  fetch(API, { method:'POST', cache:'no-store', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'data', code: ADMIN, t: Date.now() }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j && j.ok === false && /code/i.test(j.error||'')){
        ADMIN=''; try{ localStorage.removeItem('phx_admin'); }catch(_){}
        skeletons(); askGate('Code refusé — réessaie.');
        return;
      }
      if(!j || j.ok === false) throw new Error(j && j.error ? j.error : 'réponse invalide');
      DERNIER_CHARGE = Date.now();
      var neuve = empreinteDe(j);
      DATA = j;
      if(neuve === EMPREINTE){
        /* rien n'a bouge dans le classeur : on ne reconstruit pas les six
           panneaux pour rien — c'est ce qui faisait clignoter l'app et
           perdre la position de lecture a chaque retour. */
        try{ el('stampSync').textContent = (j.genere ? ('synchro ' + String(j.genere).slice(11,16)) : '') + ' · v25'; }catch(_){ }
        return;
      }
      EMPREINTE = neuve;
      /* recopiée dans l'appareil : la prochaine ouverture affiche cette
         photo instantanément au lieu des squelettes */
      try{ localStorage.setItem('phx_pilotage_data', JSON.stringify(j)); }catch(_){ }
      renderTout();
    })
    .catch(function(e){
      DERNIER_CHARGE = Date.now();
      /* une photo est déjà affichée : on la garde plutôt qu'un écran d'erreur */
      if(DATA) return;
      var msg = '<div class="state">'+glyph('<path d="M12 8v5M12 16.5v.5"/><path d="M10.3 4.2L2.8 17.5A2 2 0 004.5 20.5h15a2 2 0 001.7-3L13.7 4.2a2 2 0 00-3.4 0z"/>')
        + '<strong>Données inaccessibles</strong>'
        + esc(e.message) + '<br><br>Vérifie que le déploiement Apps Script est réglé sur '
        + '« Tout le monde » et que l\'URL se termine par <code>/exec</code>.</div>';
      ['accueil','ventes','equipe','factures','avis'].forEach(function(k){ el('p-'+k).innerHTML = msg; });
    });
}

/* ─── graphique : 7 derniers services ─────────────── */
function barChart(derniers){
  /* derniers arrive du plus récent au plus ancien → on remet en ordre chrono */
  var pts = derniers.slice().reverse();
  var W = 640, H = 150, padL = 6, padR = 6, padT = 26, padB = 22;
  var iw = W - padL - padR, ih = H - padT - padB;
  var max = Math.max.apply(null, pts.map(function(p){return p.ca||0})) || 1;
  var n = pts.length;
  var slot = iw / n;
  var bw = Math.min(34, slot * .52);          /* barre fine, l'air fait le reste */
  var r = 4;                                   /* bout arrondi côté donnée */

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Chiffre d\'affaires des 7 derniers services">';
  svg += '<line class="gridline" x1="'+padL+'" y1="'+(padT+ih)+'" x2="'+(W-padR)+'" y2="'+(padT+ih)+'"/>';

  pts.forEach(function(p,i){
    var x = padL + slot*i + (slot-bw)/2;
    var hh = Math.max(3, (p.ca||0)/max * ih);
    var y = padT + ih - hh;
    var now = (i === n-1);
    var d = 'M'+x+' '+(padT+ih)
          + ' V'+(y+r)
          + ' Q'+x+' '+y+' '+(x+r)+' '+y
          + ' H'+(x+bw-r)
          + ' Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+r)
          + ' V'+(padT+ih)+' Z';
    svg += '<g class="bar'+(now?' now':'')+'" data-i="'+i+'" tabindex="0" aria-label="'+esc(p.date)+' : '+esc(EUR.format(p.ca||0))+', '+(p.couverts||0)+' couverts">';
    svg += '<path class="mark" d="'+d+'"/>';
    if(now){ /* étiquette directe sur le service le plus récent uniquement */
      svg += '<text class="bar-lab" x="'+(x+bw/2)+'" y="'+(y-8)+'" text-anchor="middle">'+esc(EUR.format(p.ca||0))+'</text>';
    }
    svg += '<text class="axis-lab" x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(String(p.date||'').slice(0,5))+'</text>';
    svg += '<rect class="hit" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+ih+'"/>';
    svg += '</g>';
  });
  svg += '</svg>';
  return {svg:svg, pts:pts, geo:{W:W,padL:padL,slot:slot,padT:padT}};
}

function bindChart(container, chart){
  var wrap = container.querySelector('.chart-wrap');
  if(!wrap) return;
  var tip = document.createElement('div');
  tip.className = 'tip';
  wrap.appendChild(tip);
  var svgEl = wrap.querySelector('svg');

  function show(g){
    var i = +g.getAttribute('data-i');
    var p = chart.pts[i];
    tip.innerHTML = '<span class="t-meta">'+esc(p.date)+'</span><br>'
      + esc(EUR.format(p.ca||0)) + ' · ' + (p.couverts||0) + ' couverts';
    var rect = svgEl.getBoundingClientRect();
    var scale = rect.width / chart.geo.W;
    var cx = (chart.geo.padL + chart.geo.slot*(i+.5)) * scale;
    tip.style.left = cx + 'px';
    tip.style.top  = (chart.geo.padT * scale + 14) + 'px';
    tip.classList.add('on');
    g.classList.add('hov');
  }
  function hide(g){
    tip.classList.remove('on');
    if(g) g.classList.remove('hov');
  }
  wrap.querySelectorAll('.bar').forEach(function(g){
    g.addEventListener('pointerenter', function(){ show(g); });
    g.addEventListener('pointerleave', function(){ hide(g); });
    g.addEventListener('focus', function(){ show(g); });
    g.addEventListener('blur',  function(){ hide(g); });
    g.addEventListener('click', function(e){ e.stopPropagation(); show(g);
      setTimeout(function(){ hide(g); }, 2200);
    });
  });
}

/* ─── module ACCUEIL — recap essentiel + objectifs ── */
function accAnneau(pct, montant, sous){
  var p = Math.max(0, Math.min(1, pct));
  var R = 56, C = 2 * Math.PI * R;
  return '<div class="ring-wrap"><svg viewBox="0 0 140 140" class="ring">'
    + '<defs><linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="#EDD08A"/><stop offset=".6" stop-color="#D4A843"/><stop offset="1" stop-color="#B98D55"/></linearGradient></defs>'
    + '<circle cx="70" cy="70" r="' + R + '" class="ring-bg"/>'
    + '<circle cx="70" cy="70" r="' + R + '" class="ring-val" stroke="url(#ringG)"'
    + ' stroke-dasharray="' + (C * p).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 70 70)"/>'
    + '<text x="70" y="64" class="ring-pct">' + Math.round(pct * 100) + '%</text>'
    + '<text x="70" y="84" class="ring-sub">' + esc(sous) + '</text>'
    + '</svg><div class="ring-cap">' + montant + '</div></div>';
}
function accBarre(label, fait, objectif){
  var p = objectif > 0 ? fait / objectif : 0;
  var w = Math.max(2, Math.min(100, Math.round(p * 100)));
  return '<div class="abar"><div class="abar-top"><span>' + esc(label) + '</span>'
    + '<span class="abar-val">' + EUR.format(fait) + ' <em>/ ' + EUR.format(objectif) + '</em></span></div>'
    + '<div class="abar-track"><div class="abar-fill' + (p >= 1 ? ' full' : '') + '" style="width:' + w + '%"></div></div>'
    + '<div class="abar-pct">' + Math.round(p * 100) + ' %' + (p >= 1 ? ' — objectif atteint 🎉' : '') + '</div></div>';
}
function renderAccueil(){
  var root = el('p-accueil');
  var v = DATA.ventes || {};
  var tout = v.tout || [];
  var obj = v.objectifs || null;
  var d = new Date();
  function iso(dt){ return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }
  var isoAjd = iso(d);
  var caAjd = 0, cvAjd = 0;
  tout.forEach(function(x){ if(x.d === isoAjd){ caAjd = x.ca; cvAjd = x.cv; } });
  var lundi = new Date(d); lundi.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  var isoLundi = iso(lundi);
  var caSem = 0; tout.forEach(function(x){ if(x.d >= isoLundi && x.d <= isoAjd) caSem += x.ca; });
  var cleMois = isoAjd.slice(0, 7);
  var caMois = 0; tout.forEach(function(x){ if(x.d.slice(0,7) === cleMois) caMois += x.ca; });
  var dernier = tout.length ? tout[tout.length - 1] : null;

  var jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  var h = '<div class="acc-hello">' + (d.getHours() < 17 ? 'Bonjour' : 'Bonsoir') + ' Bastien</div>'
    + '<div class="acc-date">' + jours[d.getDay()] + ' ' + d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'}) + '</div>';

  if(obj){
    h += '<div class="card hero acc-hero"><div class="card-label">Objectif du jour'
      + (obj.source === 'perso' ? '' : ' · estimé compta 2025') + '</div>'
      + '<div class="acc-hero-in">'
      + accAnneau(obj.jour > 0 ? caAjd / obj.jour : 0, EUR.format(caAjd), 'du jour')
      + '<div class="acc-hero-txt">'
      +   '<div class="ah-obj">' + EUR.format(obj.jour) + '<small> à faire</small></div>'
      +   (caAjd >= obj.jour
            ? '<div class="ah-reste ok">Objectif du jour atteint ✓</div>'
            : '<div class="ah-reste">reste ' + EUR.format(Math.max(0, obj.jour - caAjd)) + '</div>')
      +   (dernier && dernier.d !== isoAjd
            ? '<div class="ah-last">dernier service : ' + esc(dernier.d.slice(8,10) + '/' + dernier.d.slice(5,7)) + ' — ' + EUR.format(dernier.ca) + '</div>'
            : (cvAjd ? '<div class="ah-last">' + cvAjd + ' couverts aujourd\'hui</div>' : ''))
      + '</div></div>';
    h += accBarre('Semaine en cours', caSem, obj.semaine);
    h += accBarre('Mois en cours', caMois, obj.mois);
    h += '</div>';
  }

  var resas = DATA.reservations || [];
  var soir = resas.filter(function(r){ return r.date === isoAjd; });
  var cvtSoir = soir.reduce(function(s,r){ return s + (Number(r.couverts)||0); }, 0);
  var aValider = resas.filter(function(r){ return r.date >= isoAjd && /valid/i.test(r.statut||''); }).length;
  var f = DATA.factures || {};
  var a = DATA.avis || {};
  var cmds = (DATA.commandes || []).length;

  h += '<div class="acc-grid">'
    + '<button class="atile" data-va="resa"><div class="at-num">' + soir.length + '<small> · ' + cvtSoir + ' cvt</small></div><div class="at-lbl">Résas aujourd\'hui</div>'
    + (aValider ? '<span class="rchip valider">' + aValider + ' à valider</span>' : '') + '</button>'

    + (a.sansReponse ? ' · ' + a.sansReponse + ' sans réponse' : '') + '</div></button>'

/* ─── module VENTES — multi-périodes (v12) ────────── */
var V_PER = 'jour';   // 'jour' | 'mois' | 'tri' | 'an'
var V_OFF = 0;        // 0 = période courante, 1 = précédente, …
var MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var MOIS_C  = ['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];

function vPct(cur, prev){
  if(prev == null || prev <= 0) return null;
  return ((cur - prev) / prev) * 100;
}
function vDelta(pct, libelle){
  if(pct == null) return '<span class="vdelta na">— vs ' + esc(libelle) + '</span>';
  var up = pct >= 0;
  return '<span class="vdelta ' + (up?'up':'down') + '">' + (up?'▲':'▼') + ' '
    + Math.abs(Math.round(pct)) + ' % vs ' + esc(libelle) + '</span>';
}
function vSomme(tout, prefix){
  var ca = 0, cv = 0, n = 0;
  tout.forEach(function(x){ if(x.d.slice(0, prefix.length) === prefix){ ca += x.ca; cv += x.cv; n++; } });
  return { ca: ca, cv: cv, n: n };
}
function vSommeTri(tout, an, tri){
  var ca = 0, cv = 0, n = 0;
  tout.forEach(function(x){
    if(x.d.slice(0,4) !== String(an)) return;
    if(Math.floor((Number(x.d.slice(5,7)) - 1) / 3) !== tri) return;
    ca += x.ca; cv += x.cv; n++;
  });
  return { ca: ca, cv: cv, n: n };
}
function vMoisCle(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }

/* ══ CLÔTURE DU SOIR PAR PHOTO ══════════════════════
   Bastien photographie le ticket Z, le backend le lit (Gemini),
   l'écran montre ce qui a été lu, chaque champ se corrige au doigt,
   et RIEN ne s'écrit avant sa confirmation. La photo est conservée
   sur Drive pour pouvoir remonter à la source. Toute date ici est
   une date de SERVICE (coupure à 5 h du matin), jamais la date civile. */
var CLO_CAP = null;
function cloJourService(){
  var d = new Date(Date.now() - 5 * 3600 * 1000);   /* avant 5 h : encore le service de la veille */
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function clotureBloc(){
  return '<div class="card" id="cloCard" style="margin-bottom:12px">'
    + '<div class="card-label">Clôture du soir</div>'
    + '<div class="row-meta" style="margin-bottom:10px">'
    +   'Photographie le ticket Z de fin de service. Tu vérifies chaque chiffre avant enregistrement.'
    + '</div>'
    + '<input type="file" id="cloFile" accept="image/*" capture="environment" style="display:none">'
    + '<div class="resa-act">'
    +   '<button class="rbtn" id="cloBtn">Photographier le Z</button>'
    + '</div>'
    + '<div class="rmsg" id="cloMsg" style="text-align:left"></div>'
    + '<div id="cloList"></div>'
    + '</div>';
}
function clotureLire(file){
  var msg = el('cloMsg');
  el('cloList').innerHTML = '';
  var t0 = Date.now(), etape = 'Préparation de la photo…', horloge = null, fini = false;
  function peins(){
    if(fini) return;
    var s = Math.round((Date.now() - t0) / 1000);
    msg.textContent = etape + (s >= 2 ? '  ' + s + ' s' : '')
      + (s >= 12 ? ' — la lecture d’un ticket chargé prend parfois vingt secondes.' : '');
  }
  function arrete(texte){ fini = true; if(horloge) clearInterval(horloge); msg.textContent = texte; }
  peins();
  horloge = setInterval(peins, 1000);
  var fr = new FileReader();
  fr.onerror = function(){ arrete('Fichier illisible.'); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ arrete('Ce fichier n’est pas une image.'); };
    img.onload = function(){
      var max = 1200, w = img.width, ht = img.height;
      if(Math.max(w, ht) > max){ var k = max / Math.max(w, ht); w = Math.round(w*k); ht = Math.round(ht*k); }
      var c = document.createElement('canvas');
      c.width = w; c.height = ht;
      c.getContext('2d').drawImage(img, 0, 0, w, ht);
      var data;
      try { data = c.toDataURL('image/jpeg', 0.78).split(',')[1]; }
      catch(e){ arrete('Conversion impossible : ' + e.message); return; }
      etape = 'Envoi et lecture du ticket…'; peins();
      fetch(API, { method:'POST', cache:'no-store',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'cloture_photo', code: ADMIN, image: data, mime:'image/jpeg' }) })
        .then(function(x){ return x.json(); })
        .then(function(j){
          if(!j || j.ok === false){
            var er = (j && j.error) || 'inconnu';
            if(/action|inconnu/i.test(er)) arrete('Le backend ne connaît pas encore la clôture — le module Code.gs est à coller (je l’ai préparé).');
            else arrete('Échec : ' + er);
            return;
          }
          fini = true; if(horloge) clearInterval(horloge);
          CLO_CAP = j;
          clotureAffiche();
        })
        .catch(function(e){ arrete('Réseau : ' + e.message); });
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function cloNum(v){ var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function cloDateOk(s){
  s = String(s || '');
  if(s.length !== 10 || s.charAt(4) !== '-' || s.charAt(7) !== '-') return false;
  for(var i = 0; i < 10; i++){
    if(i === 4 || i === 7) continue;
    if(s.charAt(i) < '0' || s.charAt(i) > '9') return false;
  }
  return true;
}
function clotureEcart(){
  var t = cloNum(el('cloTtc').value), e = cloNum(el('cloEsp').value), cb = cloNum(el('cloCb').value);
  var ec = Math.round((t - e - cb) * 100) / 100;
  var box = el('cloEc');
  if(!box) return;
  if(!t && !e && !cb){ box.textContent = ''; return; }
  box.textContent = ec === 0 ? '✓ espèces + carte = TTC'
    : 'écart de ' + ec.toFixed(2).replace('.', ',') + ' € entre le TTC et espèces + carte';
  box.style.color = ec === 0 ? 'var(--ok, #2c7)' : '';
}
function clotureAffiche(){
  var j = CLO_CAP;
  if(!j) return;
  /* réponse partielle du backend : sans ce garde-fou, chaque frappe
     plantait et les corrections étaient écrasées au rafraîchissement */
  CLO_CAP.lecture = CLO_CAP.lecture || {};
  var l = j.lecture;
  var msg = el('cloMsg'), list = el('cloList');
  msg.textContent = 'Voilà ce que j’ai lu — corrige ce qui cloche, rien n’est encore enregistré.';
  function champ(id, lab, val, mode){
    return '<label class="caprow" style="display:flex;align-items:center;gap:8px">'
      + '<span class="cap-n" style="min-width:110px">' + lab + '</span>'
      + '<input class="f-input" id="' + id + '" inputmode="' + (mode||'decimal') + '" value="' + esc(val == null ? '' : String(val)) + '" style="flex:1">'
      + '</label>';
  }
  var h = champ('cloDate', 'Jour de service', l.date || cloJourService(), 'numeric')
    + champ('cloTtc', 'Total TTC (€)', l.ttc)
    + champ('cloEsp', 'Espèces (€)', l.especes)
    + champ('cloCb', 'Carte (€)', l.carte)
    + champ('cloCvt', 'Couverts', l.couverts, 'numeric')
    + '<div class="row-meta" id="cloEc" style="margin-top:6px"></div>'
    + (l.produits && l.produits.length ? '<div class="row-meta" style="margin-top:4px">' + l.produits.length + ' lignes de produits lues — elles partent avec la clôture.</div>' : '')
    + '<div class="resa-act" style="margin-top:10px">'
    + '<button class="rbtn ghost" id="cloVide">Laisser tomber</button>'
    + '<button class="rbtn" id="cloGo">Enregistrer la clôture</button></div>';
  list.innerHTML = h;
  /* chaque frappe est recopiée dans CLO_CAP : le rafraîchissement
     automatique du dashboard redessine ce formulaire, et sans cela il
     écraserait les corrections en cours par la lecture d'origine */
  [['cloDate','date'],['cloTtc','ttc'],['cloEsp','especes'],['cloCb','carte'],['cloCvt','couverts']].forEach(function(p2){
    el(p2[0]).addEventListener('input', function(){
      CLO_CAP.lecture[p2[1]] = el(p2[0]).value;
      clotureEcart();
    });
  });
  clotureEcart();
  el('cloGo').addEventListener('click', clotureValide);
  el('cloVide').addEventListener('click', clotureRaz);
}
function clotureRaz(){
  CLO_CAP = null;
  var l = el('cloList'), m = el('cloMsg'), f = el('cloFile');
  if(l) l.innerHTML = '';
  if(m) m.textContent = '';
  if(f) f.value = '';
}
function clotureValide(){
  var j = CLO_CAP;
  if(!j) return;
  var msg = el('cloMsg');
  var corps = {
    action: 'cloture_valide', code: ADMIN,
    cloture: {
      date: el('cloDate').value.trim(),
      ttc: cloNum(el('cloTtc').value),
      especes: cloNum(el('cloEsp').value),
      carte: cloNum(el('cloCb').value),
      couverts: Math.round(cloNum(el('cloCvt').value)) || null,
      produits: (j.lecture && j.lecture.produits) || [],
      photoId: j.photoId || ''
    }
  };
  if(!cloDateOk(corps.cloture.date)){ msg.textContent = 'La date doit être AAAA-MM-JJ.'; return; }
  if(!corps.cloture.ttc){ msg.textContent = 'Le total TTC manque.'; return; }
  var go = el('cloGo'); if(go) go.disabled = true;
  msg.textContent = 'Enregistrement…';
  fetch(API, { method:'POST', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(corps) })
    .then(function(x){ return x.json(); })
    .then(function(r){
      if(!r || r.ok === false){ if(go) go.disabled = false; msg.textContent = 'Échec : ' + ((r&&r.error)||'inconnu'); return; }
      var rp = r.rapprochement || {};
      var tx = 'Clôture du ' + corps.cloture.date + ' enregistrée.';
      if(rp.carteBanque != null){
        tx += ' Carte selon banque : ' + Number(rp.carteBanque).toFixed(2).replace('.', ',') + ' €'
           + ' · écart du jour ' + Number(rp.ecart || 0).toFixed(2).replace('.', ',') + ' €'
           + (rp.apresMinuit ? ' (dont ' + Number(rp.apresMinuit).toFixed(2).replace('.', ',') + ' € après minuit)' : '') + '.';
      }
      msg.textContent = tx;
      el('cloList').innerHTML = '';
      CLO_CAP = null;
      setTimeout(load, 1200);
    })
    .catch(function(e){ if(go) go.disabled = false; msg.textContent = 'Réseau : ' + e.message; });
}
function clotureBind(){
  var b = el('cloBtn'), f = el('cloFile');
  if(!b || !f) return;
  b.addEventListener('click', function(){ f.click(); });
  f.addEventListener('change', function(){
    if(f.files && f.files[0]) clotureLire(f.files[0]);
  });
  if(CLO_CAP) clotureAffiche();
}

function renderVentes(){
  var v = DATA.ventes;
  var root = el('p-ventes');
  if(!v || !v.jour){
    root.innerHTML = clotureBloc() + stateBlock('<path d="M3 17l5-6 4 3 6-8"/><path d="M14 6h4v4"/>',
      'Aucune vente enregistrée',
      'Dès que le service est saisi (formulaire ou export Agora) dans la feuille <code>Ventes</code>, le chiffre s\'affiche ici.');
    clotureBind();
    return;
  }
  var tout = v.tout || [];
  if(!tout.length){ renderVentesSimple(v, root); return; }

  var now = new Date();
  var cur = { ca: 0, cv: 0, n: 0 }, prev = null, yoy = null;
  var labPrev = '', labYoy = '', titre = '', chartPts = [], ariaChart = '';

  if(V_PER === 'jour'){
    var idx = tout.length - 1 - V_OFF;
    if(idx < 0){ V_OFF = tout.length - 1; idx = 0; }
    var selJ = tout[idx];
    cur = { ca: selJ.ca, cv: selJ.cv, n: 1 };
    var dd = new Date(selJ.d + 'T12:00:00');
    titre = dd.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    if(idx > 0){ prev = { ca: tout[idx-1].ca }; labPrev = 'service préc.'; }
    var y1 = (Number(selJ.d.slice(0,4)) - 1) + selJ.d.slice(4);
    var e1 = null; tout.forEach(function(x){ if(x.d === y1) e1 = x; });
    if(e1){ yoy = { ca: e1.ca }; labYoy = 'même jour ' + y1.slice(0,4); }
    chartPts = tout.slice(Math.max(0, idx - 13), idx + 1).map(function(x){
      return { date: x.d.slice(8,10) + '/' + x.d.slice(5,7), ca: x.ca, couverts: x.cv };
    }).reverse();
    ariaChart = '14 derniers services';
  }
  else if(V_PER === 'mois'){
    var mAnc = new Date(now.getFullYear(), now.getMonth() - V_OFF, 1);
    var cle = vMoisCle(mAnc);
    cur = vSomme(tout, cle);
    titre = MOIS_FR[mAnc.getMonth()] + ' ' + mAnc.getFullYear();
    var mPrev = new Date(mAnc.getFullYear(), mAnc.getMonth() - 1, 1);
    var sPrev = vSomme(tout, vMoisCle(mPrev));
    if(sPrev.n){ prev = sPrev; labPrev = MOIS_C[mPrev.getMonth()] + ' ' + mPrev.getFullYear(); }
    var sYoy = vSomme(tout, (mAnc.getFullYear()-1) + '-' + String(mAnc.getMonth()+1).padStart(2,'0'));
    if(sYoy.n){ yoy = sYoy; labYoy = MOIS_C[mAnc.getMonth()] + ' ' + (mAnc.getFullYear()-1); }
    chartPts = tout.filter(function(x){ return x.d.slice(0,7) === cle; }).map(function(x){
      return { date: x.d.slice(8,10), ca: x.ca, couverts: x.cv };
    }).reverse();
    ariaChart = 'jours du mois';
  }
  else if(V_PER === 'tri'){
    var triNow = Math.floor(now.getMonth() / 3);
    var anT = now.getFullYear(), t = triNow - V_OFF;
    while(t < 0){ t += 4; anT--; }
    cur = vSommeTri(tout, anT, t);
    titre = 'T' + (t+1) + ' ' + anT;
    var tp = t - 1, anP = anT; if(tp < 0){ tp = 3; anP--; }
    var sTP = vSommeTri(tout, anP, tp);
    if(sTP.n){ prev = sTP; labPrev = 'T' + (tp+1) + ' ' + anP; }
    var sTY = vSommeTri(tout, anT - 1, t);
    if(sTY.n){ yoy = sTY; labYoy = 'T' + (t+1) + ' ' + (anT-1); }
    chartPts = [];
    for(var mi = t*3; mi < t*3+3; mi++){
      var s = vSomme(tout, anT + '-' + String(mi+1).padStart(2,'0'));
      chartPts.push({ date: MOIS_C[mi], ca: s.ca, couverts: s.cv });
    }
    chartPts.reverse();
    ariaChart = 'mois du trimestre';
  }
  else {
    var anA = now.getFullYear() - V_OFF;
    cur = vSomme(tout, String(anA));
    titre = String(anA);
    var sAP = vSomme(tout, String(anA - 1));
    if(sAP.n){ prev = sAP; labPrev = String(anA - 1); }
    chartPts = [];
    for(var mj = 0; mj < 12; mj++){
      var sm = vSomme(tout, anA + '-' + String(mj+1).padStart(2,'0'));
      chartPts.push({ date: MOIS_C[mj], ca: sm.ca, couverts: sm.cv });
    }
    chartPts.reverse();
    ariaChart = 'mois de l\'année';
  }

  var peutAvancer = V_OFF > 0;
  var peutReculer = (V_PER === 'jour') ? (V_OFF < tout.length - 1) : true;

  var h = '<div class="rseg" id="vseg">'
    + ['jour','mois','tri','an'].map(function(p){
        var lab = { jour:'Jour', mois:'Mois', tri:'Trimestre', an:'Année' }[p];
        return '<button data-per="' + p + '" class="' + (V_PER===p?'on':'') + '">' + lab + '</button>';
      }).join('')
    + '</div>';

  h += '<div class="vnav">'
    + '<button class="vnav-btn" id="vPrev"' + (peutReculer?'':' disabled') + '>‹</button>'
    + '<div class="vnav-lab">' + esc(titre) + '</div>'
    + '<button class="vnav-btn" id="vNext"' + (peutAvancer?'':' disabled') + '>›</button>'
    + '</div>';

  var ticket = cur.cv > 0 ? EUR2.format(cur.ca / cur.cv) : null;
  h += '<div class="card hero">'
    + '<div class="card-label">Chiffre d\'affaires' + (V_PER !== 'jour' && cur.n ? ' · ' + cur.n + ' jour' + (cur.n>1?'s':'') + ' de service' : '') + '</div>'
    + '<div class="figure"><span data-count="' + (cur.ca||0) + '" data-fmt="eur">' + EUR.format(0) + '</span></div>'
    + '<div class="figure-sub">' + (cur.cv > 0 ? (cur.cv + ' couverts · ticket moyen ' + ticket) : 'couverts non renseignés sur cette période') + '</div>'
    + '<div class="vdeltas">' + vDelta(vPct(cur.ca, prev && prev.ca), labPrev || 'période préc.')
    + (V_PER !== 'an' ? vDelta(vPct(cur.ca, yoy && yoy.ca), labYoy || 'année préc.') : '') + '</div>';

  var chart = null;
  if(chartPts.length > 1){
    chart = barChart(chartPts);
    h += '<div class="chart-wrap">' + chart.svg + '</div>';
  }

  if(V_PER !== 'jour' && cur.n > 0){
    var best = null;
    tout.forEach(function(x){
      var dans = (V_PER === 'mois') ? x.d.slice(0,7) === vMoisCle(new Date(now.getFullYear(), now.getMonth() - V_OFF, 1))
               : (V_PER === 'an') ? x.d.slice(0,4) === titre
               : (x.d.slice(0,4) === titre.slice(3) && Math.floor((Number(x.d.slice(5,7))-1)/3) === (Number(titre.slice(1,2))-1));
      if(dans && (!best || x.ca > best.ca)) best = x;
    });
    if(best){
      var bd = new Date(best.d + 'T12:00:00');
      h += '<div class="vbest">Meilleur service : ' + bd.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}) + ' — ' + EUR.format(best.ca) + '</div>';
    }
  }
  h += '</div>';

  root.innerHTML = clotureBloc() + h;
  clotureBind();
  if(chart) bindChart(root, chart);
  animateFigures(root);

  root.querySelectorAll('#vseg button').forEach(function(b){
    b.addEventListener('click', function(){ V_PER = b.getAttribute('data-per'); V_OFF = 0; renderVentes(); });
  });
  var bp = el('vPrev'), bn = el('vNext');
  if(bp) bp.addEventListener('click', function(){ V_OFF++; renderVentes(); });
  if(bn) bn.addEventListener('click', function(){ if(V_OFF > 0){ V_OFF--; renderVentes(); } });
}

/* repli si le backend ne fournit pas encore l'historique complet */

}

/* ─── module RÉSERVATIONS ─────────────────────────── */
var RESA_VUE = 'avenir';       // 'avenir' | 'passees'
var RESA_LIMITE = 15;          // pagination des passées

function resaChip(source, statut){
  var s = String(source||'').toLowerCase();
  var cls = 'autre', lbl = source || '?';
  if(s.indexOf('fork') > -1 || s.indexOf('fourchette') > -1){ cls = 'thefork'; lbl = 'TheFork'; }
  else if(s.indexOf('whatsapp') > -1 || s.indexOf('wa') === 0){ cls = 'whatsapp'; lbl = 'WhatsApp'; }
  else if(s.indexOf('web') > -1 || s.indexOf('site') > -1 || s.indexOf('page') > -1){ cls = 'web'; lbl = 'Site web'; }
  else if(s.indexOf('mail') > -1 || s.indexOf('email') > -1 || s.indexOf('gmail') > -1){ cls = 'email'; lbl = 'Email'; }
  else if(s.indexOf('carnet') > -1){ cls = 'autre'; lbl = 'Carnet'; }
  else if(s.indexOf('app') > -1 || s.indexOf('equipe') > -1 || s.indexOf('équipe') > -1){ cls = 'web'; lbl = 'App équipe'; }
  var h = '<span class="rchip ' + cls + '">' + esc(lbl) + '</span>';
  if(/valid/i.test(statut||'')) h += '<span class="rchip valider">À valider</span>';
  return h;
}

function resaJourLabel(iso, isoAjd, isoDemain){
  if(iso === isoAjd) return 'Aujourd’hui';
  if(iso === isoDemain) return 'Demain';
  var d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
}

function resaCarte(r, montrerDate){
  var warn = /valid/i.test(r.statut||'');
  var cvt = Number(r.couverts) || 0;
  var manque = r.manque || [];
  var incomplet = manque.length > 0;
  return '<div class="rcard' + (warn ? ' warn' : '') + (incomplet ? ' incomplet' : '') + '"'
    + (r.ligne ? ' onclick="resaEdit(' + r.ligne + ')" style="cursor:pointer"' : '') + '>'
    + '<div class="rc-h">' + esc(r.heure || (montrerDate ? String(r.date).slice(5) : '—')) + '</div>'
    + '<div class="rc-mid">'
    +   '<div class="rc-nom">' + esc(r.nom || 'Sans nom') + '</div>'
    +   '<div class="rc-sub">' + resaChip(r.source, r.statut)
    +   (incomplet ? '<span class="rchip manq">à compléter : ' + esc(manque.join(', ')) + '</span>' : '') + '</div>'
    +   (r.note ? '<div class="rc-note">' + esc(r.note) + '</div>' : '')
    + '</div>'
    + '<div class="rc-cvt">' + (cvt || '?') + '<small>cvt</small></div>'

}

      setTimeout(function(){ if(armee){ armee = false; sup.textContent = 'Supprimer'; } }, 6000);

    msg.textContent = 'Suppression…';

  el('reSave').addEventListener('click', function(){
    var msg = el('reMsg');
    msg.textContent = 'Enregistrement…';
    fetch(API, { method:'POST', cache:'no-store', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'resa_maj', code: ADMIN, ligne: ligne,
        date: el('reDate').value, heure: el('reHeure').value, couverts: el('reCvt').value,

      .then(function(x){ return x.json(); })
      .then(function(j){
        if(!j || j.ok === false){ msg.textContent = 'Échec : ' + ((j&&j.error)||'inconnu'); return; }
        msg.textContent = 'Enregistré.';
        setTimeout(function(){ close(); load(); }, 500);
      })
      .catch(function(e){ msg.textContent = 'Réseau : ' + e.message; });
  });

/* ═══ AJOUT DE RESERVATIONS PAR CAPTURE D'ECRAN ═══════════════════
   Bastien photographie l'ecran de TheFork (ou d'Agora, ou son carnet).
   Le backend lit l'image, compare avec ce qui est deja note, et ne
   propose que ce qui manque. Aucun doublon possible : la verification
   est refaite au moment d'ecrire.                                    */
var RESA_CAP = null;

function resaCaptureBloc(){
  return '<div class="card" id="capCard" style="margin-bottom:12px">'
    + '<div class="card-label">Ajouter depuis une capture</div>'
    + '<div class="row-meta" style="margin-bottom:10px">'
    +   'Photographie l\'écran de TheFork, d\'Agora ou le carnet. '
    +   'Les réservations déjà notées sont ignorées.'
    + '</div>'
    + '<input type="file" id="capFile" accept="image/*" style="display:none">'
    + '<div class="resa-act">'
    +   '<button class="rbtn" id="capBtn">Choisir une capture</button>'
    + '</div>'
    + '<div class="rmsg" id="capMsg" style="text-align:left"></div>'
    + '<div id="capList"></div>'
    + '</div>';
}

/* envoi d'une action reservation, avec message et fermeture */
function resaAction(payload, msg, apres){
  payload.code = ADMIN;
  fetch(API, { method:'POST', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) })
    .then(function(x){ return x.json(); })
    .then(function(j){
      if(!j || j.ok === false){ msg.textContent = 'Échec : ' + ((j&&j.error)||'inconnu'); return; }
      msg.textContent = 'C\'est fait.';
      setTimeout(function(){ if(apres) apres(); load(); }, 500);
    })
    .catch(function(e){ msg.textContent = 'Réseau : ' + e.message; });
}

/* la capture est reduite dans le telephone avant l'envoi :
   1400 px de cote suffisent a lire un ecran, et le trajet reste leger */
function resaCaptureLire(file){
  var msg = el('capMsg');
  el('capList').innerHTML = '';

  /* L'attente est reelle — l'IA lit vraiment l'image — mais un texte fige
     donne l'impression que l'app a plante. On montre donc l'etape en cours
     et les secondes qui passent. Rien n'accelere autant que de comprendre
     ce qu'on attend. */
  var t0 = Date.now(), etape = 'Préparation de l\'image…', horloge = null, fini = false;
  function peins(){
    if(fini) return;
    var s = Math.round((Date.now() - t0) / 1000);
    msg.textContent = etape + (s >= 2 ? '  ' + s + ' s' : '')
      + (s >= 12 ? ' — la lecture d\'un écran chargé prend parfois vingt secondes.' : '');
  }
  function arrete(texte){ fini = true; if(horloge) clearInterval(horloge); msg.textContent = texte; }
  peins();
  horloge = setInterval(peins, 1000);

  var fr = new FileReader();
  fr.onerror = function(){ arrete('Fichier illisible.'); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ arrete('Ce fichier n\'est pas une image.'); };
    img.onload = function(){
      /* 1200 px suffisent pour lire un ecran de telephone, et l'envoi pese
         environ moitie moins qu'a 1400 px : autant de gagne sur la 4G. */
      var max = 1200, w = img.width, ht = img.height;
      if(Math.max(w, ht) > max){ var k = max / Math.max(w, ht); w = Math.round(w*k); ht = Math.round(ht*k); }
      var c = document.createElement('canvas');
      c.width = w; c.height = ht;
      c.getContext('2d').drawImage(img, 0, 0, w, ht);
      var data;
      try { data = c.toDataURL('image/jpeg', 0.78).split(',')[1]; }
      catch(e){ arrete('Conversion impossible : ' + e.message); return; }
      etape = 'Envoi et lecture de la capture…'; peins();
      fetch(API, { method:'POST', cache:'no-store',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'resa_capture', code: ADMIN, image: data, mime:'image/jpeg' }) })
        .then(function(x){ return x.json(); })
        .then(function(j){
          if(!j || j.ok === false){ arrete('Échec : ' + ((j&&j.error)||'inconnu')); return; }
          fini = true; if(horloge) clearInterval(horloge);
          RESA_CAP = j;
          resaCaptureAffiche();
        })
        .catch(function(e){ arrete('Réseau : ' + e.message); });
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function resaCaptureAffiche(){

  if(!j) return;
  var msg = el('capMsg'), list = el('capList');
  if(!msg || !list) return;

    list.innerHTML = '';

  }
  msg.textContent = liste.length + ' lue(s) sur la capture du ' + esc(j.date)
    + (j.plateforme ? ' · ' + esc(j.plateforme) : '')

    h += '<label class="caprow' + (r.nouveau ? ' neuf' : '') + '">'

  });

    h += '<div class="resa-act" style="margin-top:10px">'
      + '<button class="rbtn ghost" id="capVide">Fermer</button></div>';
  }
  list.innerHTML = h;
  var go = el('capGo');
