<!DOCTYPE html>
<html lang="fr">
<head>

<title>Phoenix — Pilotage</title>

<!-- PWA : permet d'ajouter le dashboard à l'écran d'accueil du téléphone -->
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ════════════════════════════════════════════════
   TOKENS — identité Brasserie Phoenix
   (palette imposée : navy · cuivre · doré · crème)
   ════════════════════════════════════════════════ */
:root{
  --navy:#16364A;
  --navy-deep:#0B1E2C;
  --navy-card:rgba(27,63,85,.5);
  --navy-card-solid:#17394E;
  --copper:#B98D55;
  --gold:#D4A843;
  --gold-soft:rgba(212,168,67,.32);
  --cream:#F6F0E4;

  --ink:var(--cream);
  --ink-2:rgba(246,240,228,.62);
  --ink-3:rgba(246,240,228,.4);

  /* statuts fonctionnels — toujours accompagnés d'un texte */
  --ok:#7FA37A;
  --warn:#D4A843;
  --alert:#C4633F;

  --hair:rgba(185,141,85,.3);
  --hair-soft:rgba(185,141,85,.15);

  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Courier New',monospace;

  --pad:18px;
  --r:18px;
  --dock-h:76px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}

body{
  font-family:var(--sans);
  font-weight:300;
  background:var(--navy-deep);
  color:var(--ink);
  min-height:100vh;
  padding-bottom:calc(var(--dock-h) + 26px + env(safe-area-inset-bottom));
  line-height:1.5;
  overflow-x:hidden;
}

/* ── fond ambiant : aurora futuriste (navy profond + halos or/cuivre/bleu-acier) ── */
.ambient{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(70% 60% at 50% 118%, rgba(22,54,74,.9), transparent 72%),
    linear-gradient(175deg,#081420 0%, #0B1E2C 45%, #0D2334 100%);
  overflow:hidden;
}
.ambient::before{
  content:"";position:absolute;inset:-20%;
  background:
    radial-gradient(34% 26% at 78% 6%, rgba(212,168,67,.2), transparent 68%),
    radial-gradient(30% 24% at 8% 30%, rgba(62,124,166,.18), transparent 70%),
    radial-gradient(36% 30% at 88% 66%, rgba(185,141,85,.13), transparent 70%),
    radial-gradient(26% 22% at 30% 88%, rgba(62,124,166,.1), transparent 70%);
  filter:blur(46px);
  animation:aurora 26s ease-in-out infinite alternate;
}
@keyframes aurora{
  0%{transform:translate3d(-2%,-1%,0) scale(1)}
  50%{transform:translate3d(2%,2%,0) scale(1.06)}
  100%{transform:translate3d(-1%,3%,0) scale(1.02)}
}
@media (prefers-reduced-motion:reduce){.ambient::before{animation:none}}
.ambient::after{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(246,240,228,.03) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,transparent,#000 18%,#000 78%,transparent);
}

/* ════════════════════════════════════════════════
   EN-TÊTE
   ════════════════════════════════════════════════ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(11,30,44,.92),rgba(11,30,44,.72));
  backdrop-filter:blur(18px) saturate(1.2);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);
  border-bottom:1px solid var(--hair-soft);
  padding:calc(14px + env(safe-area-inset-top)) var(--pad) 13px;
}
.topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

.wordmark{
  font-family:var(--serif);
  font-size:28px;letter-spacing:.05em;line-height:1.1;
}
.wordmark em{
  font-style:normal;
  background:linear-gradient(100deg,#EDD08A 0%, var(--gold) 45%, var(--copper) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:var(--gold);
  filter:drop-shadow(0 0 14px rgba(212,168,67,.35));
}

.service-state{display:inline-flex;align-items:center;gap:7px;margin-top:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;position:relative}
.dot::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1px solid var(--ok);opacity:.5;
  animation:pulse 2.4s ease-out infinite;
}
.dot.closed{background:var(--copper);opacity:.55}
.dot.closed::after{display:none}
@keyframes pulse{0%{transform:scale(.5);opacity:.6}80%,100%{transform:scale(1.5);opacity:0}}

.stamp{
  font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--copper);line-height:1.5;
}
.stamp.right{text-align:right;white-space:nowrap}
.sync{color:var(--ink-3);letter-spacing:.12em}

/* ════════════════════════════════════════════════
   CONTENU
   ════════════════════════════════════════════════ */
main{padding:18px var(--pad) 0}

.panel{display:none}
.panel.on{display:block;animation:rise .32s cubic-bezier(.22,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── accès de l'équipe ── */
.acc-li{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--hair-soft);
 border-radius:12px;margin-bottom:7px;background:rgba(255,255,255,.02)}
.acc-li.off{opacity:.5}
.acc-li .c{flex:1;min-width:0}
.acc-li .n{font-size:15px}
.acc-li .m{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.acc-li .b{flex:none;padding:7px 11px;border-radius:999px;border:1px solid var(--hair);
 font-size:11.5px;color:var(--ink-2);background:none;cursor:pointer}
.acc-li .b.on{border-color:var(--alert);color:var(--alert)}
.acc-dot{width:8px;height:8px;border-radius:50%;flex:none}
.acc-dot.ok{background:var(--ok)}.acc-dot.no{background:var(--alert)}
.acc-form{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acc-form input{flex:1;min-width:130px;padding:11px;border-radius:11px;border:1px solid var(--hair);
 background:rgba(0,0,0,.18);color:var(--cream);font-family:inherit;font-size:14.5px}
.acc-form button{flex:none;padding:11px 18px;border-radius:11px;background:var(--gold);
 color:var(--navy-deep);font-weight:600;font-size:14.5px;border:0;cursor:pointer}
.acc-msg{font-size:12.5px;margin-top:9px;min-height:16px}
.acc-note{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:10px}
.card{
  position:relative;
  background:linear-gradient(165deg,rgba(35,72,96,.42),rgba(16,40,58,.5)) padding-box,
    linear-gradient(155deg,rgba(246,240,228,.16),rgba(185,141,85,.1) 40%,rgba(62,124,166,.12)) border-box;
  backdrop-filter:blur(22px) saturate(1.25);
  -webkit-backdrop-filter:blur(22px) saturate(1.25);
  border:1px solid transparent;
  border-radius:22px;
  padding:17px 16px;
  margin-bottom:12px;
  box-shadow:0 14px 38px rgba(0,0,0,.3), inset 0 1px 0 rgba(246,240,228,.07);
}
.card.hero{
  background:
    linear-gradient(165deg,rgba(35,72,96,.55),rgba(14,36,52,.72)) padding-box,
    linear-gradient(150deg,rgba(212,168,67,.65),rgba(185,141,85,.14) 42%,rgba(62,124,166,.3)) border-box;
  border:1px solid transparent;
  box-shadow:0 18px 48px rgba(0,0,0,.34), 0 0 46px rgba(212,168,67,.1), inset 0 1px 0 rgba(246,240,228,.08);
}
.card.hero::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(58% 90% at 88% 0%, rgba(212,168,67,.14), transparent 62%);
}

.card-label{
  font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--copper);
  margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.card-label::after{content:"";flex:1;height:1px;background:var(--hair-soft)}

/* chiffres — Jost, jamais la couleur des données */
.figure{
  font-family:var(--sans);font-weight:600;
  font-size:46px;line-height:1.02;letter-spacing:-.015em;
  color:var(--ink);
}
.hero .figure > span[data-count]{
  background:linear-gradient(115deg,#FBF5E8 0%, #EDD08A 55%, var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 18px rgba(212,168,67,.28));
}
.figure .unit{font-size:22px;font-weight:400;color:var(--copper);margin-left:4px}
.figure-sub{font-size:13.5px;color:var(--ink-2);margin-top:8px}

.delta{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12.5px;font-weight:500;
  font-family:var(--sans);
  border:1px solid currentColor;border-radius:999px;
  padding:3px 10px;margin-left:10px;vertical-align:6px;
}
.delta.up{color:var(--ok)}
.delta.down{color:var(--alert)}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.duo .card{margin-bottom:0}
.duo .figure{font-size:29px}

/* ── graphique 7 services (SVG) ── */
.chart-wrap{margin-top:16px;position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.bar{cursor:pointer}
.bar rect.hit{fill:transparent}
.bar path.mark{fill:var(--gold);opacity:.34;transition:opacity .18s}
.bar.now path.mark{opacity:1;filter:drop-shadow(0 0 12px rgba(212,168,67,.65))}
.bar.hov path.mark{opacity:.75}
.bar.now.hov path.mark{opacity:1}
.axis-lab{font-family:var(--mono);font-size:9px;letter-spacing:.06em;fill:var(--ink-3)}
.bar-lab{font-family:var(--sans);font-weight:500;font-size:11px;fill:var(--ink)}
.gridline{stroke:rgba(246,240,228,.09);stroke-width:1}

.tip{
  position:absolute;z-index:5;pointer-events:none;
  background:var(--navy-deep);
  border:1px solid var(--hair);border-radius:9px;
  padding:7px 10px;
  font-size:12px;color:var(--ink);
  white-space:nowrap;
  transform:translate(-50%,-108%);
  box-shadow:0 8px 22px rgba(0,0,0,.4);
  opacity:0;transition:opacity .14s;
}
.tip .t-meta{color:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.08em}
.tip.on{opacity:1}

/* ── jauges / meters (heures équipe) ── */
.meter-row{padding:11px 0;border-top:1px solid var(--hair-soft)}
.meter-row:first-of-type{border-top:0}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.meter-name{font-size:14.5px}
.meter-val{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.meter{height:6px;border-radius:99px;background:rgba(212,168,67,.14);overflow:hidden}
.meter i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--copper),var(--gold));
  width:0;transition:width .8s cubic-bezier(.22,.9,.3,1);
}

/* ── lignes de liste ── */
.row{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 0;
  border-top:1px solid var(--hair-soft);
}
.row:first-of-type{border-top:0}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:400}
.row-meta{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.row-value{
  font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:3.5px 8px;border-radius:6px;
  border:1px solid currentColor;
  margin-top:6px;
  background:rgba(11,30,44,.35);
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.ok{color:var(--ok)}
.tag.warn{color:var(--warn)}
.tag.alert{color:var(--alert)}

/* ressenti : 5 points */
.feel{display:inline-flex;gap:3px;margin-top:6px;vertical-align:middle}
.feel i{width:7px;height:7px;border-radius:50%;background:rgba(246,240,228,.14)}
.feel.ok i.f{background:var(--ok)}
.feel.warn i.f{background:var(--warn)}
.feel.alert i.f{background:var(--alert)}

.stars{font-family:var(--mono);font-size:13px;color:var(--gold);letter-spacing:.1em}

/* ── factures : répartition fournisseur + détail dépliable ── */
.frow{margin-top:12px}
.frow:first-child{margin-top:6px}
.frow-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.frow-name{font-size:13.5px;color:var(--ink)}
.frow-val{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fbar-track{height:7px;border-radius:4px;background:rgba(246,240,228,.08);overflow:hidden}
.fbar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--copper),var(--gold));transition:width .6s cubic-bezier(.2,.7,.2,1)}
.caret{display:inline-block;color:var(--copper);font-size:11px;transition:transform .18s;transform-origin:center}
.facture-head:hover .row-title{color:var(--gold)}
.facture-detail{max-height:0;overflow:hidden;transition:max-height .28s ease;border-left:2px solid var(--gold-soft);margin:0 0 0 6px}
.facture-detail.on{max-height:600px}
.pline{display:grid;grid-template-columns:64px 1fr auto auto;gap:8px;align-items:baseline;
  padding:6px 10px;font-size:12.5px;color:var(--ink-2)}
.pline .pref{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.pline .pdes{color:var(--ink)}
.pline .pqte{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.pline .ppu{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-3)}
.pline-empty{display:block;color:var(--ink-3);font-style:italic;padding:8px 10px}

/* ── états vides / erreurs / chargement ── */
.state{
  text-align:center;
  padding:46px 22px;
  color:var(--ink-2);
  font-size:14px;
}
.state .glyph{
  width:52px;height:52px;margin:0 auto 16px;
  border:1px solid var(--hair);border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--copper);
  background:rgba(212,168,67,.06);
}
.state strong{
  display:block;
  font-family:var(--serif);font-size:22px;font-weight:400;
  color:var(--ink);margin-bottom:8px;
}
.state code{font-family:var(--mono);font-size:12px;color:var(--gold);word-break:break-all}

.skel{border-radius:var(--r);height:118px;margin-bottom:12px;position:relative;overflow:hidden;
  background:rgba(27,63,85,.4);border:1px solid var(--hair-soft)}
.skel::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(246,240,228,.06) 50%,transparent 70%);
  animation:shimmer 1.6s infinite;
}
.skel.sm{height:78px}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ════════════════════════════════════════════════
   DOCK BAS — navigation + action IA
   ════════════════════════════════════════════════ */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:0 14px calc(10px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.dock-inner{
  pointer-events:auto;
  position:relative;
  height:var(--dock-h);
  max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:repeat(3,1fr) 66px repeat(3,1fr);
  align-items:stretch;
  background:linear-gradient(180deg,rgba(23,57,78,.72),rgba(11,28,42,.88)) padding-box,
    linear-gradient(155deg,rgba(246,240,228,.18),rgba(212,168,67,.14) 50%,rgba(62,124,166,.16)) border-box;
  backdrop-filter:blur(26px) saturate(1.35);
  -webkit-backdrop-filter:blur(26px) saturate(1.35);
  border:1px solid transparent;
  border-radius:26px;
  box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(246,240,228,.08);
}
.dock-btn{
  background:none;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ink-3);
  font-family:var(--sans);font-size:9.5px;letter-spacing:.02em;font-weight:400;
  transition:color .2s;
  border-radius:18px;
  min-width:0;
}
.dock-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dock-btn{position:relative}
.dock-btn[aria-selected="true"]{color:var(--gold);text-shadow:0 0 16px rgba(212,168,67,.5)}
.dock-btn[aria-selected="true"]::before{
  content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:40px;height:40px;border-radius:14px;z-index:-1;
  background:radial-gradient(circle at 50% 30%, rgba(212,168,67,.22), rgba(212,168,67,.05) 70%, transparent);
}
.dock-btn:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}

/* ─── module Résa : design "reservation manager" ─── */
.resa-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.rstat{background:linear-gradient(165deg,rgba(35,72,96,.4),rgba(16,40,58,.5)) padding-box,
  linear-gradient(155deg,rgba(212,168,67,.28),rgba(62,124,166,.14)) border-box;
  border:1px solid transparent;border-radius:18px;padding:13px 12px;text-align:center;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.rstat .rs-num{font-family:var(--serif);font-size:26px;line-height:1;color:var(--gold);
  filter:drop-shadow(0 0 12px rgba(212,168,67,.4))}
.rstat .rs-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.rseg{display:flex;background:rgba(14,36,52,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(246,240,228,.1);border-radius:999px;padding:4px;margin-bottom:14px;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.3)}
.rseg button{flex:1;background:none;border:0;border-radius:999px;padding:9px;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ink-2);transition:color .2s}
.rseg button.on{
  background:linear-gradient(120deg,#E7C264,var(--gold) 60%,var(--copper));
  color:var(--navy-deep);font-weight:600;
  box-shadow:0 4px 16px rgba(212,168,67,.4), inset 0 1px 0 rgba(255,255,255,.35);
}
.rday{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 10px}
.rday:first-child{margin-top:2px}
.rday .rd-t{font-family:var(--serif);font-size:18px;color:var(--ink);text-transform:capitalize}
.rday .rd-c{font-family:var(--mono);font-size:11px;color:var(--copper)}
.rcard{display:flex;align-items:center;gap:12px;
  background:linear-gradient(165deg,rgba(35,72,96,.38),rgba(16,40,58,.46)) padding-box,
    linear-gradient(155deg,rgba(246,240,228,.12),rgba(62,124,166,.1)) border-box;
  border:1px solid transparent;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:16px;padding:12px 14px;margin-bottom:8px}
.rcard.warn{background:linear-gradient(165deg,rgba(212,168,67,.12),rgba(16,40,58,.5)) padding-box,
    linear-gradient(155deg,rgba(212,168,67,.5),rgba(212,168,67,.14)) border-box;
  box-shadow:0 0 22px rgba(212,168,67,.1)}
.rcard .rc-h{font-family:var(--mono);font-size:16px;color:var(--gold);min-width:52px;
  filter:drop-shadow(0 0 10px rgba(212,168,67,.35))}
.rcard .rc-mid{flex:1;min-width:0}

/* l'orbe central — le résumé IA */
.orb{
  position:relative;align-self:center;justify-self:center;
  width:58px;height:58px;margin-top:-34px;
  border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 32% 28%, #E7C264, var(--gold) 46%, var(--copper) 120%);
  color:var(--navy-deep);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(212,168,67,.5), 0 0 44px rgba(212,168,67,.28), 0 3px 8px rgba(0,0,0,.4);
}
.orb::before{
  content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1px solid var(--gold-soft);
  animation:orbit 3.4s linear infinite;
  border-top-color:var(--gold);
}
@keyframes orbit{to{transform:rotate(360deg)}}
.orb:active{transform:scale(.94)}
.orb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.orb:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.orb-label{
  position:absolute;left:50%;transform:translateX(-50%);bottom:6px;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;color:var(--ink-3);
  pointer-events:none;
}

/* ════════════════════════════════════════════════
   TICKET IA — papier thermique (élément signature)
   ════════════════════════════════════════════════ */
.scrim{
  position:fixed;inset:0;z-index:60;
  background:rgba(6,16,24,.74);
  backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.scrim.on{opacity:1;pointer-events:auto}

.ticket-wrap{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  transform:translateY(103%);
  transition:transform .36s cubic-bezier(.22,.9,.3,1);
  max-height:88vh;display:flex;flex-direction:column;
  padding:0 10px;
}
.ticket-wrap.on{transform:none}

.ticket{
  background:var(--cream);
  color:#2A2118;
  border-radius:14px 14px 0 0;
  display:flex;flex-direction:column;
  overflow:hidden;
  max-height:88vh;
  box-shadow:0 -16px 50px rgba(0,0,0,.55);
}
.ticket-head{
  flex:none;
  padding:15px 18px 12px;
  border-bottom:1px dashed rgba(42,33,24,.3);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.ticket-title{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.19em;text-transform:uppercase}
.ticket-close{background:none;border:0;cursor:pointer;font-family:var(--mono);font-size:16px;color:#2A2118;padding:4px 8px}
.ticket-close:focus-visible{outline:2px solid var(--copper)}

.ticket-body{
  flex:1;overflow-y:auto;
  padding:16px 18px;
  font-family:var(--mono);font-size:12.5px;line-height:1.72;
  -webkit-overflow-scrolling:touch;
}
.msg{margin-bottom:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{padding-left:12px;border-left:2px solid var(--copper);color:#5A4A34}
.ticket-rule{border:0;border-top:1px dashed rgba(42,33,24,.28);margin:14px 0}

.ticket-foot{
  flex:none;
  border-top:1px dashed rgba(42,33,24,.3);
  padding:11px 12px calc(11px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:flex-end;
  background:var(--cream);
}
.ticket-foot textarea{
  flex:1;resize:none;
  font-family:var(--mono);font-size:13px;line-height:1.5;
  color:#2A2118;background:rgba(42,33,24,.05);
  border:1px solid rgba(42,33,24,.18);border-radius:9px;
  padding:10px 11px;max-height:110px;
}
.ticket-foot textarea:focus{outline:2px solid var(--copper);outline-offset:-1px}
.send{
  flex:none;background:var(--navy);color:var(--cream);
  border:0;border-radius:9px;
  font-family:var(--sans);font-size:14px;font-weight:500;
  padding:12px 15px;cursor:pointer;
}
.send:disabled{opacity:.4;cursor:default}

.chips{display:flex;gap:7px;overflow-x:auto;padding:0 18px 13px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-family:var(--sans);font-size:12px;
  color:#5A4A34;background:rgba(42,33,24,.06);
  border:1px solid rgba(42,33,24,.16);border-radius:999px;
  padding:7px 12px;cursor:pointer;
}
.typing{color:#8A7A62;font-style:italic}


/* ── porte d'accès (code admin) ── */
.gate{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:var(--navy-deep);padding:26px}

.gate-input:focus{outline:2px solid var(--gold);outline-offset:-1px}
.gate-btn{width:100%;font-family:var(--sans);font-size:15px;font-weight:500;

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

}

function gateSubmit(){

var EUR2 = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2});

/* ─── utilitaires ─────────────────────────────────── */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function el(id){return document.getElementById(id)}

function stars(n){
  var v = Math.round(Number(n)||0), s='';
  for(var i=0;i<5;i++) s += (i<v?'★':'·');
  return s;
}
function feel(n){
  var v = Math.round(Number(n)||0);
  var cls = v>=4?'ok':(v>=3?'warn':'alert');
  var h = '<span class="feel '+cls+'" aria-hidden="true">';
  for(var i=1;i<=5;i++) h += '<i class="'+(i<=v?'f':'')+'"></i>';
  return h+'</span>';
}
function glyph(path){
  return '<div class="glyph"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg></div>';

/* compteur animé — chiffres, jamais colorés données */
function countUp(node, target, fmt){
  if(REDUCED || target === 0){ node.textContent = fmt(target); return; }
  var t0 = null, dur = 750;
  function step(ts){
    if(!t0) t0 = ts;
    var p = Math.min((ts - t0)/dur, 1);
    var e = 1 - Math.pow(1-p, 3);
    node.textContent = fmt(target * e);
    if(p < 1) requestAnimationFrame(step);
    else node.textContent = fmt(target);
  }
  requestAnimationFrame(step);
}
function animateFigures(root){
  root.querySelectorAll('[data-count]').forEach(function(n){
    var v = parseFloat(n.getAttribute('data-count')) || 0;
    var kind = n.getAttribute('data-fmt');
    var fmt = kind==='eur' ? function(x){return EUR.format(x)}
            : kind==='dec' ? function(x){return x.toFixed(2)}
            : function(x){return String(Math.round(x))};
    countUp(n, v, fmt);
  });
  root.querySelectorAll('.meter i').forEach(function(m){
    var w = m.getAttribute('data-w');
    requestAnimationFrame(function(){ m.style.width = w + '%'; });
  });
}

function load(){
  if(!API){
    var aide = '<div class="state">'+glyph('<path d="M9 12h6M12 9v6"/><circle cx="12" cy="12" r="8.5"/>')
      + '<strong>Dashboard pas encore relié</strong>'
      + 'Ouvre ce fichier et colle l\'URL de ton Apps Script dans <code>CONFIG.API_URL</code>, '
      + 'tout en haut du script.<br><br>Pour tester sans modifier le fichier, ajoute '
      + '<code>?api=TON_URL</code> à la fin de l\'adresse.</div>';
    ['ventes','equipe','factures','avis'].forEach(function(k){ el('p-'+k).innerHTML = aide; });
    return;
  }

  if(!DATA){
    /* La dernière photo des données s'affiche tout de suite ; la
       fraîche la remplace dès que le classeur a répondu. */
    try{
      var vieux = JSON.parse(localStorage.getItem('phx_pilotage_data') || 'null');
      if(vieux && vieux.ok !== false){ DATA = vieux; renderTout(); }
    }catch(_){ }
    if(!DATA) skeletons();
  }

  if(!ADMIN){ askGate(); return; }
  /* POST (text/plain) plutôt que GET : évite l'échec cross-origin d'Apps Script sur iPhone/Safari */
  fetch(API, { method:'POST', cache:'no-store', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'data', code: ADMIN, t: Date.now() }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j && j.ok === false && /code/i.test(j.error||'')){
        ADMIN=''; try{ localStorage.removeItem('phx_admin'); }catch(_){}
        skeletons(); askGate('Code refusé — réessaie.');
        return;
      }
      if(!j || j.ok === false) throw new Error(j && j.error ? j.error : 'réponse invalide');
      DATA = j;
      /* recopiée dans l'appareil : la prochaine ouverture affiche cette
         photo instantanément au lieu des squelettes */
      try{ localStorage.setItem('phx_pilotage_data', JSON.stringify(j)); }catch(_){ }
      renderTout();
    })
    .catch(function(e){
      var msg = '<div class="state">'+glyph('<path d="M12 8v5M12 16.5v.5"/><path d="M10.3 4.2L2.8 17.5A2 2 0 004.5 20.5h15a2 2 0 001.7-3L13.7 4.2a2 2 0 00-3.4 0z"/>')
        + '<strong>Données inaccessibles</strong>'
        + esc(e.message) + '<br><br>Vérifie que le déploiement Apps Script est réglé sur '
        + '« Tout le monde » et que l\'URL se termine par <code>/exec</code>.</div>';
      ['accueil','ventes','equipe','factures','avis'].forEach(function(k){ el('p-'+k).innerHTML = msg; });
    });
}

/* ─── graphique : 7 derniers services ─────────────── */
function barChart(derniers){
  /* derniers arrive du plus récent au plus ancien → on remet en ordre chrono */
  var pts = derniers.slice().reverse();
  var W = 640, H = 150, padL = 6, padR = 6, padT = 26, padB = 22;
  var iw = W - padL - padR, ih = H - padT - padB;
  var max = Math.max.apply(null, pts.map(function(p){return p.ca||0})) || 1;
  var n = pts.length;
  var slot = iw / n;
  var bw = Math.min(34, slot * .52);          /* barre fine, l'air fait le reste */
  var r = 4;                                   /* bout arrondi côté donnée */

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Chiffre d\'affaires des 7 derniers services">';
  svg += '<line class="gridline" x1="'+padL+'" y1="'+(padT+ih)+'" x2="'+(W-padR)+'" y2="'+(padT+ih)+'"/>';

  pts.forEach(function(p,i){
    var x = padL + slot*i + (slot-bw)/2;
    var hh = Math.max(3, (p.ca||0)/max * ih);
    var y = padT + ih - hh;
    var now = (i === n-1);
    var d = 'M'+x+' '+(padT+ih)
          + ' V'+(y+r)
          + ' Q'+x+' '+y+' '+(x+r)+' '+y
          + ' H'+(x+bw-r)
          + ' Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+r)
          + ' V'+(padT+ih)+' Z';
    svg += '<g class="bar'+(now?' now':'')+'" data-i="'+i+'" tabindex="0" aria-label="'+esc(p.date)+' : '+esc(EUR.format(p.ca||0))+', '+(p.couverts||0)+' couverts">';
    svg += '<path class="mark" d="'+d+'"/>';
    if(now){ /* étiquette directe sur le service le plus récent uniquement */
      svg += '<text class="bar-lab" x="'+(x+bw/2)+'" y="'+(y-8)+'" text-anchor="middle">'+esc(EUR.format(p.ca||0))+'</text>';
    }
    svg += '<text class="axis-lab" x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(String(p.date||'').slice(0,5))+'</text>';
    svg += '<rect class="hit" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+ih+'"/>';
    svg += '</g>';
  });
  svg += '</svg>';
  return {svg:svg, pts:pts, geo:{W:W,padL:padL,slot:slot,padT:padT}};
}

function bindChart(container, chart){
  var wrap = container.querySelector('.chart-wrap');
  if(!wrap) return;
  var tip = document.createElement('div');
  tip.className = 'tip';
  wrap.appendChild(tip);
  var svgEl = wrap.querySelector('svg');

  function show(g){
    var i = +g.getAttribute('data-i');
    var p = chart.pts[i];
    tip.innerHTML = '<span class="t-meta">'+esc(p.date)+'</span><br>'
      + esc(EUR.format(p.ca||0)) + ' · ' + (p.couverts||0) + ' couverts';
    var rect = svgEl.getBoundingClientRect();
    var scale = rect.width / chart.geo.W;
    var cx = (chart.geo.padL + chart.geo.slot*(i+.5)) * scale;
    tip.style.left = cx + 'px';
    tip.style.top  = (chart.geo.padT * scale + 14) + 'px';
    tip.classList.add('on');
    g.classList.add('hov');
  }
  function hide(g){
    tip.classList.remove('on');
    if(g) g.classList.remove('hov');
  }
  wrap.querySelectorAll('.bar').forEach(function(g){
    g.addEventListener('pointerenter', function(){ show(g); });
    g.addEventListener('pointerleave', function(){ hide(g); });
    g.addEventListener('focus', function(){ show(g); });
    g.addEventListener('blur',  function(){ hide(g); });
    g.addEventListener('click', function(e){ e.stopPropagation(); show(g);
      setTimeout(function(){ hide(g); }, 2200);
    });
  });
}

function accAnneau(pct, montant, sous){

    + '<defs><linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">'

    + '<circle cx="70" cy="70" r="' + R + '" class="ring-bg"/>'
    + '<circle cx="70" cy="70" r="' + R + '" class="ring-val" stroke="url(#ringG)"'
    + ' stroke-dasharray="' + (C * p).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 70 70)"/>'
    + '<text x="70" y="64" class="ring-pct">' + Math.round(pct * 100) + '%</text>'
    + '<text x="70" y="84" class="ring-sub">' + esc(sous) + '</text>'
    + '</svg><div class="ring-cap">' + montant + '</div></div>';

/* ─── module VENTES — multi-périodes (v12) ────────── */
var V_PER = 'jour';   // 'jour' | 'mois' | 'tri' | 'an'
var V_OFF = 0;        // 0 = période courante, 1 = précédente, …
var MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var MOIS_C  = ['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];

function vPct(cur, prev){
  if(prev == null || prev <= 0) return null;
  return ((cur - prev) / prev) * 100;
}
function vDelta(pct, libelle){
  if(pct == null) return '<span class="vdelta na">— vs ' + esc(libelle) + '</span>';
  var up = pct >= 0;
  return '<span class="vdelta ' + (up?'up':'down') + '">' + (up?'▲':'▼') + ' '
    + Math.abs(Math.round(pct)) + ' % vs ' + esc(libelle) + '</span>';
}
function vSomme(tout, prefix){
  var ca = 0, cv = 0, n = 0;
  tout.forEach(function(x){ if(x.d.slice(0, prefix.length) === prefix){ ca += x.ca; cv += x.cv; n++; } });
  return { ca: ca, cv: cv, n: n };
}
function vSommeTri(tout, an, tri){
  var ca = 0, cv = 0, n = 0;
  tout.forEach(function(x){
    if(x.d.slice(0,4) !== String(an)) return;
    if(Math.floor((Number(x.d.slice(5,7)) - 1) / 3) !== tri) return;
    ca += x.ca; cv += x.cv; n++;
  });
  return { ca: ca, cv: cv, n: n };
}
function vMoisCle(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }

function renderVentes(){
  var v = DATA.ventes;
  var root = el('p-ventes');
  if(!v || !v.jour){
    root.innerHTML = stateBlock('<path d="M3 17l5-6 4 3 6-8"/><path d="M14 6h4v4"/>',
      'Aucune vente enregistrée',
      'Dès que le service est saisi (formulaire ou export Agora) dans la feuille <code>Ventes</code>, le chiffre s\'affiche ici.');
    return;
  }
  var tout = v.tout || [];
  if(!tout.length){ renderVentesSimple(v, root); return; }

  var now = new Date();
  var cur = { ca: 0, cv: 0, n: 0 }, prev = null, yoy = null;
  var labPrev = '', labYoy = '', titre = '', chartPts = [], ariaChart = '';

  if(V_PER === 'jour'){
    var idx = tout.length - 1 - V_OFF;
    if(idx < 0){ V_OFF = tout.length - 1; idx = 0; }
    var selJ = tout[idx];
    cur = { ca: selJ.ca, cv: selJ.cv, n: 1 };
    var dd = new Date(selJ.d + 'T12:00:00');
    titre = dd.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    if(idx > 0){ prev = { ca: tout[idx-1].ca }; labPrev = 'service préc.'; }
    var y1 = (Number(selJ.d.slice(0,4)) - 1) + selJ.d.slice(4);
    var e1 = null; tout.forEach(function(x){ if(x.d === y1) e1 = x; });
    if(e1){ yoy = { ca: e1.ca }; labYoy = 'même jour ' + y1.slice(0,4); }
    chartPts = tout.slice(Math.max(0, idx - 13), idx + 1).map(function(x){
      return { date: x.d.slice(8,10) + '/' + x.d.slice(5,7), ca: x.ca, couverts: x.cv };
    }).reverse();
    ariaChart = '14 derniers services';
  }
  else if(V_PER === 'mois'){
    var mAnc = new Date(now.getFullYear(), now.getMonth() - V_OFF, 1);
    var cle = vMoisCle(mAnc);
    cur = vSomme(tout, cle);
    titre = MOIS_FR[mAnc.getMonth()] + ' ' + mAnc.getFullYear();
    var mPrev = new Date(mAnc.getFullYear(), mAnc.getMonth() - 1, 1);
    var sPrev = vSomme(tout, vMoisCle(mPrev));
    if(sPrev.n){ prev = sPrev; labPrev = MOIS_C[mPrev.getMonth()] + ' ' + mPrev.getFullYear(); }
    var sYoy = vSomme(tout, (mAnc.getFullYear()-1) + '-' + String(mAnc.getMonth()+1).padStart(2,'0'));
    if(sYoy.n){ yoy = sYoy; labYoy = MOIS_C[mAnc.getMonth()] + ' ' + (mAnc.getFullYear()-1); }
    chartPts = tout.filter(function(x){ return x.d.slice(0,7) === cle; }).map(function(x){
      return { date: x.d.slice(8,10), ca: x.ca, couverts: x.cv };
    }).reverse();
    ariaChart = 'jours du mois';
  }
  else if(V_PER === 'tri'){
    var triNow = Math.floor(now.getMonth() / 3);
    var anT = now.getFullYear(), t = triNow - V_OFF;
    while(t < 0){ t += 4; anT--; }
    cur = vSommeTri(tout, anT, t);
    titre = 'T' + (t+1) + ' ' + anT;
    var tp = t - 1, anP = anT; if(tp < 0){ tp = 3; anP--; }
    var sTP = vSommeTri(tout, anP, tp);
    if(sTP.n){ prev = sTP; labPrev = 'T' + (tp+1) + ' ' + anP; }
    var sTY = vSommeTri(tout, anT - 1, t);
    if(sTY.n){ yoy = sTY; labYoy = 'T' + (t+1) + ' ' + (anT-1); }
    chartPts = [];
    for(var mi = t*3; mi < t*3+3; mi++){
      var s = vSomme(tout, anT + '-' + String(mi+1).padStart(2,'0'));
      chartPts.push({ date: MOIS_C[mi], ca: s.ca, couverts: s.cv });
    }
    chartPts.reverse();
    ariaChart = 'mois du trimestre';
  }
  else {
    var anA = now.getFullYear() - V_OFF;
    cur = vSomme(tout, String(anA));
    titre = String(anA);
    var sAP = vSomme(tout, String(anA - 1));
    if(sAP.n){ prev = sAP; labPrev = String(anA - 1); }
    chartPts = [];
    for(var mj = 0; mj < 12; mj++){
      var sm = vSomme(tout, anA + '-' + String(mj+1).padStart(2,'0'));
      chartPts.push({ date: MOIS_C[mj], ca: sm.ca, couverts: sm.cv });
    }
    chartPts.reverse();
    ariaChart = 'mois de l\'année';
  }

  var peutAvancer = V_OFF > 0;
  var peutReculer = (V_PER === 'jour') ? (V_OFF < tout.length - 1) : true;

  var h = '<div class="rseg" id="vseg">'
    + ['jour','mois','tri','an'].map(function(p){
        var lab = { jour:'Jour', mois:'Mois', tri:'Trimestre', an:'Année' }[p];
        return '<button data-per="' + p + '" class="' + (V_PER===p?'on':'') + '">' + lab + '</button>';
      }).join('')
    + '</div>';

  h += '<div class="vnav">'
    + '<button class="vnav-btn" id="vPrev"' + (peutReculer?'':' disabled') + '>‹</button>'
    + '<div class="vnav-lab">' + esc(titre) + '</div>'
    + '<button class="vnav-btn" id="vNext"' + (peutAvancer?'':' disabled') + '>›</button>'
    + '</div>';

  var ticket = cur.cv > 0 ? EUR2.format(cur.ca / cur.cv) : null;
  h += '<div class="card hero">'
    + '<div class="card-label">Chiffre d\'affaires' + (V_PER !== 'jour' && cur.n ? ' · ' + cur.n + ' jour' + (cur.n>1?'s':'') + ' de service' : '') + '</div>'
    + '<div class="figure"><span data-count="' + (cur.ca||0) + '" data-fmt="eur">' + EUR.format(0) + '</span></div>'
    + '<div class="figure-sub">' + (cur.cv > 0 ? (cur.cv + ' couverts · ticket moyen ' + ticket) : 'couverts non renseignés sur cette période') + '</div>'
    + '<div class="vdeltas">' + vDelta(vPct(cur.ca, prev && prev.ca), labPrev || 'période préc.')
    + (V_PER !== 'an' ? vDelta(vPct(cur.ca, yoy && yoy.ca), labYoy || 'année préc.') : '') + '</div>';

  var chart = null;
  if(chartPts.length > 1){
    chart = barChart(chartPts);
    h += '<div class="chart-wrap">' + chart.svg + '</div>';
  }

  if(V_PER !== 'jour' && cur.n > 0){
    var best = null;
    tout.forEach(function(x){
      var dans = (V_PER === 'mois') ? x.d.slice(0,7) === vMoisCle(new Date(now.getFullYear(), now.getMonth() - V_OFF, 1))
               : (V_PER === 'an') ? x.d.slice(0,4) === titre
               : (x.d.slice(0,4) === titre.slice(3) && Math.floor((Number(x.d.slice(5,7))-1)/3) === (Number(titre.slice(1,2))-1));
      if(dans && (!best || x.ca > best.ca)) best = x;
    });
    if(best){
      var bd = new Date(best.d + 'T12:00:00');
      h += '<div class="vbest">Meilleur service : ' + bd.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}) + ' — ' + EUR.format(best.ca) + '</div>';
    }
  }
  h += '</div>';

  root.innerHTML = h;
  if(chart) bindChart(root, chart);
  animateFigures(root);

  root.querySelectorAll('#vseg button').forEach(function(b){
    b.addEventListener('click', function(){ V_PER = b.getAttribute('data-per'); V_OFF = 0; renderVentes(); });
  });
  var bp = el('vPrev'), bn = el('vNext');
  if(bp) bp.addEventListener('click', function(){ V_OFF++; renderVentes(); });
  if(bn) bn.addEventListener('click', function(){ if(V_OFF > 0){ V_OFF--; renderVentes(); } });
}

/* repli si le backend ne fournit pas encore l'historique complet */
function renderVentesSimple(v, root){
  var j = v.jour, delta = v.deltaSemaine, d = '';
  if(delta != null){
    d = '<span class="delta '+(delta>=0?'up':'down')+'">'

/* ─── module RÉSERVATIONS ─────────────────────────── */
var RESA_VUE = 'avenir';       // 'avenir' | 'passees'
var RESA_LIMITE = 15;          // pagination des passées

function resaChip(source, statut){
  var s = String(source||'').toLowerCase();
  var cls = 'autre', lbl = source || '?';
  if(s.indexOf('fork') > -1 || s.indexOf('fourchette') > -1){ cls = 'thefork'; lbl = 'TheFork'; }
  else if(s.indexOf('whatsapp') > -1 || s.indexOf('wa') === 0){ cls = 'whatsapp'; lbl = 'WhatsApp'; }
  else if(s.indexOf('web') > -1 || s.indexOf('site') > -1 || s.indexOf('page') > -1){ cls = 'web'; lbl = 'Site web'; }
  else if(s.indexOf('mail') > -1 || s.indexOf('email') > -1 || s.indexOf('gmail') > -1){ cls = 'email'; lbl = 'Email'; }
  else if(s.indexOf('carnet') > -1){ cls = 'autre'; lbl = 'Carnet'; }
  else if(s.indexOf('app') > -1 || s.indexOf('equipe') > -1 || s.indexOf('équipe') > -1){ cls = 'web'; lbl = 'App équipe'; }
  var h = '<span class="rchip ' + cls + '">' + esc(lbl) + '</span>';
  if(/valid/i.test(statut||'')) h += '<span class="rchip valider">À valider</span>';
  return h;
}

function resaJourLabel(iso, isoAjd, isoDemain){
  if(iso === isoAjd) return 'Aujourd’hui';
  if(iso === isoDemain) return 'Demain';
  var d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
}

function resaCarte(r, montrerDate){
  var warn = /valid/i.test(r.statut||'');
  var cvt = Number(r.couverts) || 0;
  var manque = r.manque || [];
  var incomplet = manque.length > 0;
  return '<div class="rcard' + (warn ? ' warn' : '') + (incomplet ? ' incomplet' : '') + '"'
    + (r.ligne ? ' onclick="resaEdit(' + r.ligne + ')" style="cursor:pointer"' : '') + '>'
    + '<div class="rc-h">' + esc(r.heure || (montrerDate ? String(r.date).slice(5) : '—')) + '</div>'
    + '<div class="rc-mid">'
    +   '<div class="rc-nom">' + esc(r.nom || 'Sans nom') + '</div>'
    +   '<div class="rc-sub">' + resaChip(r.source, r.statut)
    +   (incomplet ? '<span class="rchip manq">à compléter : ' + esc(manque.join(', ')) + '</span>' : '') + '</div>'
    +   (r.note ? '<div class="rc-note">' + esc(r.note) + '</div>' : '')
    + '</div>'
    + '<div class="rc-cvt">' + (cvt || '?') + '<small>cvt</small></div>'
    + '</div>';
}

/* ─── édition d'une réservation (complète les infos manquantes) ─── */
function resaEdit(ligne){
  var r = (DATA.reservations||[]).filter(function(x){ return x.ligne === ligne; })[0];
  if(!r) return;
  var ov = document.createElement('div');
  ov.className = 'resa-ov';
  ov.innerHTML = '<div class="resa-modal">'
    + '<div class="card-label">Compléter la réservation</div>'
    + '<label class="rlab">Date<input id="reDate" type="date" value="' + esc(r.date||'') + '"></label>'
    + '<label class="rlab">Heure<input id="reHeure" type="time" value="' + esc(r.heure||'') + '"></label>'
    + '<label class="rlab">Couverts<input id="reCvt" type="number" min="1" max="60" value="' + (Number(r.couverts)||'') + '"></label>'
    + '<label class="rlab">Nom<input id="reNom" type="text" value="' + esc(r.nom||'') + '" placeholder="Nom du client"></label>'
    + '<label class="rlab">Contact<input id="reCtc" type="text" value="' + esc(r.contact||'') + '" placeholder="téléphone / email"></label>'
    + '<label class="rlab">Statut<select id="reSt">'
    +   ['Confirmée','À valider','Annulée','Historique'].map(function(o){
          return '<option' + (o === (r.statut||'') ? ' selected' : '') + '>' + o + '</option>'; }).join('')
    + '</select></label>'
    + '<label class="rlab">Note<input id="reNote" type="text" value="' + esc(r.note||'') + '" placeholder="allergie, table, occasion…"></label>'
    + '<div class="resa-act"><button class="rbtn ghost" id="reCancel">Fermer</button>'
    + '<button class="rbtn" id="reSave">Enregistrer</button></div>'
    + '<div class="resa-act" style="margin-top:8px">'
    +   '<button class="rbtn ghost" id="reAnnule">Annuler la réservation</button>'
    +   '<button class="rbtn danger" id="reSuppr">Supprimer</button></div>'
    + '<div class="rmsg" id="reMsg"></div></div>';
  document.body.appendChild(ov);
  function close(){ ov.remove(); }
  ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
  el('reCancel').addEventListener('click', close);

  /* annuler : la ligne reste, le statut passe a Annulee — rien ne se perd */
  el('reAnnule').addEventListener('click', function(){
    var msg = el('reMsg');
    msg.textContent = 'Annulation…';
    resaAction({ action:'resa_statut', ligne: ligne, statut:'Annulée', motif:'annulée depuis l\'application' }, msg, close);
  });

  /* supprimer : deux temps, pas de fenetre systeme */
  var sup = el('reSuppr'), armee = false;
  sup.addEventListener('click', function(){
    if(!armee){
      armee = true;
      sup.textContent = 'Confirmer ?';
      el('reMsg').textContent = 'La ligne sera effacée du classeur. Préfère « Annuler » pour garder la trace.';
      setTimeout(function(){ if(armee){ armee = false; sup.textContent = 'Supprimer'; } }, 6000);
      return;
    }
    var msg = el('reMsg');
    msg.textContent = 'Suppression…';
    resaAction({ action:'resa_supprimer', ligne: ligne }, msg, close);
  });
  el('reSave').addEventListener('click', function(){
    var msg = el('reMsg');
    msg.textContent = 'Enregistrement…';
    fetch(API, { method:'POST', cache:'no-store', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'resa_maj', code: ADMIN, ligne: ligne,
        date: el('reDate').value, heure: el('reHeure').value, couverts: el('reCvt').value,
        nom: el('reNom').value, contact: el('reCtc').value, statut: el('reSt').value, note: el('reNote').value }) })
      .then(function(x){ return x.json(); })
      .then(function(j){
        if(!j || j.ok === false){ msg.textContent = 'Échec : ' + ((j&&j.error)||'inconnu'); return; }
        msg.textContent = 'Enregistré.';
        setTimeout(function(){ close(); load(); }, 500);
      })
      .catch(function(e){ msg.textContent = 'Réseau : ' + e.message; });
  });
}

/* ═══ AJOUT DE RESERVATIONS PAR CAPTURE D'ECRAN ═══════════════════
   Bastien photographie l'ecran de TheFork (ou d'Agora, ou son carnet).
   Le backend lit l'image, compare avec ce qui est deja note, et ne
   propose que ce qui manque. Aucun doublon possible : la verification
   est refaite au moment d'ecrire.                                    */
var RESA_CAP = null;

function resaCaptureBloc(){
  return '<div class="card" id="capCard" style="margin-bottom:12px">'
    + '<div class="card-label">Ajouter depuis une capture</div>'
    + '<div class="row-meta" style="margin-bottom:10px">'
    +   'Photographie l\'écran de TheFork, d\'Agora ou le carnet. '
    +   'Les réservations déjà notées sont ignorées.'
    + '</div>'
    + '<input type="file" id="capFile" accept="image/*" style="display:none">'
    + '<div class="resa-act">'
    +   '<button class="rbtn" id="capBtn">Choisir une capture</button>'
    + '</div>'
    + '<div class="rmsg" id="capMsg" style="text-align:left"></div>'
    + '<div id="capList"></div>'
    + '</div>';
}

/* envoi d'une action reservation, avec message et fermeture */
function resaAction(payload, msg, apres){
  payload.code = ADMIN;
  fetch(API, { method:'POST', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) })
    .then(function(x){ return x.json(); })
    .then(function(j){
      if(!j || j.ok === false){ msg.textContent = 'Échec : ' + ((j&&j.error)||'inconnu'); return; }
      msg.textContent = 'C\'est fait.';
      setTimeout(function(){ if(apres) apres(); load(); }, 500);
    })
    .catch(function(e){ msg.textContent = 'Réseau : ' + e.message; });
}

/* la capture est reduite dans le telephone avant l'envoi :
   1400 px de cote suffisent a lire un ecran, et le trajet reste leger */
function resaCaptureLire(file){
  var msg = el('capMsg');
  msg.textContent = 'Lecture de la capture…';
  el('capList').innerHTML = '';
  var fr = new FileReader();
  fr.onerror = function(){ msg.textContent = 'Fichier illisible.'; };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ msg.textContent = 'Ce fichier n\'est pas une image.'; };
    img.onload = function(){
      var max = 1400, w = img.width, ht = img.height;
      if(Math.max(w, ht) > max){ var k = max / Math.max(w, ht); w = Math.round(w*k); ht = Math.round(ht*k); }
      var c = document.createElement('canvas');
      c.width = w; c.height = ht;
      c.getContext('2d').drawImage(img, 0, 0, w, ht);
      var data;
      try { data = c.toDataURL('image/jpeg', 0.82).split(',')[1]; }
      catch(e){ msg.textContent = 'Conversion impossible : ' + e.message; return; }
      fetch(API, { method:'POST', cache:'no-store',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'resa_capture', code: ADMIN, image: data, mime:'image/jpeg' }) })
        .then(function(x){ return x.json(); })
        .then(function(j){
          if(!j || j.ok === false){ msg.textContent = 'Échec : ' + ((j&&j.error)||'inconnu'); return; }
          RESA_CAP = j;
          resaCaptureAffiche();
        })
        .catch(function(e){ msg.textContent = 'Réseau : ' + e.message; });
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function resaCaptureAffiche(){
  var j = RESA_CAP;
  if(!j) return;
  var msg = el('capMsg'), list = el('capList');
  if(!msg || !list) return;
  var liste = j.reservations || [];
  var neuves = liste.filter(function(r){ return r.nouveau; });
  if(!liste.length){
    msg.textContent = 'Aucune réservation lisible sur cette capture.';
    list.innerHTML = '';
    return;
  }
  msg.textContent = liste.length + ' lue(s) sur la capture du ' + esc(j.date)
    + (j.plateforme ? ' · ' + esc(j.plateforme) : '')
    + ' — ' + (neuves.length ? neuves.length + ' à ajouter' : 'tout est déjà noté');
  var h = '';
  liste.forEach(function(r, i){
    h += '<label class="caprow' + (r.nouveau ? ' neuf' : '') + '">'
      + '<input type="checkbox" class="capck" data-i="' + i + '"'
      +   (r.nouveau ? ' checked' : ' disabled') + '>'
      + '<span class="cap-h">' + esc(r.heure || '—') + '</span>'
      + '<span class="cap-n">' + esc(r.nom || 'Sans nom') + '</span>'
      + '<span class="cap-c">' + (Number(r.couverts) || '?') + ' cvt</span>'
      + '<span class="cap-s">' + (r.nouveau ? 'à ajouter' : 'déjà notée') + '</span>'
      + '</label>';
  });
  if(neuves.length){
    h += '<div class="resa-act" style="margin-top:10px">'
      + '<button class="rbtn ghost" id="capVide">Laisser tomber</button>'
      + '<button class="rbtn" id="capGo">Ajouter (' + neuves.length + ')</button></div>';
  } else {
    h += '<div class="resa-act" style="margin-top:10px">'
      + '<button class="rbtn ghost" id="capVide">Fermer</button></div>';
  }
  list.innerHTML = h;
  var go = el('capGo');
  if(go) go.addEventListener('click', resaCaptureValide);
  var vd = el('capVide');
  if(vd) vd.addEventListener('click', resaCaptureRaz);
}

function resaCaptureRaz(){
  RESA_CAP = null;
  var l = el('capList'), m = el('capMsg'), f = el('capFile');
  if(l) l.innerHTML = '';
  if(m) m.textContent = '';
  if(f) f.value = '';
}

function resaCaptureValide(){
  var j = RESA_CAP;
  if(!j) return;
  var choisies = [];
  var cases = document.querySelectorAll('#capList .capck');
  for(var i = 0; i < cases.length; i++){
    var c = cases[i];
    if(c.checked && !c.disabled){
      var r = (j.reservations || [])[+c.getAttribute('data-i')];
      if(r) choisies.push(r);
    }
  }
  var msg = el('capMsg');
  if(!choisies.length){ msg.textContent = 'Rien de sélectionné.'; return; }
  msg.textContent = 'Ajout de ' + choisies.length + ' réservation(s)…';
  fetch(API, { method:'POST', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'resa_lot', code: ADMIN, reservations: choisies }) })
    .then(function(x){ return x.json(); })
    .then(function(r){
      if(!r || r.ok === false){ msg.textContent = 'Échec : ' + ((r&&r.error)||'inconnu'); return; }
      msg.textContent = r.ajoutees + ' ajoutée(s)'
        + (r.ignorees ? ' · ' + r.ignorees + ' déjà notée(s)' : '') + '.';
      RESA_CAP = null;
      setTimeout(load, 800);
    })
    .catch(function(e){ msg.textContent = 'Réseau : ' + e.message; });
}

function resaCaptureBind(){
  var b = el('capBtn'), f = el('capFile');
  if(!b || !f) return;
  b.addEventListener('click', function(){ f.click(); });
  f.addEventListener('change', function(){
    if(f.files && f.files[0]) resaCaptureLire(f.files[0]);
  });
  if(RESA_CAP) resaCaptureAffiche();
}

function resaGroupeParJour(liste, isoAjd, isoDemain){
  var jours = [], idx = {};
  liste.forEach(function(r){
    var k = r.date || '?';
    if(idx[k] == null){ idx[k] = jours.length; jours.push({ date:k, resas:[], cvt:0 }); }
    jours[idx[k]].resas.push(r);
    jours[idx[k]].cvt += Number(r.couverts) || 0;
  });
  var h = '';
  jours.forEach(function(j){
    j.resas.sort(function(a,b){ return String(a.heure||'').localeCompare(String(b.heure||'')); });
    h += '<div class="rday"><span class="rd-t">' + esc(resaJourLabel(j.date, isoAjd, isoDemain)) + '</span>'
      + '<span class="rd-c">' + j.resas.length + ' résa · ' + j.cvt + ' cvt</span></div>';
    j.resas.forEach(function(r){ h += resaCarte(r, false); });
  });
  return h;
}

function renderResa(){
  var root = el('p-resa');
  var resas = DATA.reservations || [];
  if(!resas.length){
    root.innerHTML = resaCaptureBloc() + stateBlock('<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
      'Pas encore de réservation',
      'Les réservations arrivent ici depuis la page publique, les emails, TheFork, WhatsApp et l\'app équipe.');
    resaCaptureBind();
    return;
  }
  var d = new Date();
  function iso(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
  var isoAjd = iso(d);
  var d2 = new Date(d.getTime() + 864e5), isoDemain = iso(d2);
  var d7 = new Date(d.getTime() + 7*864e5), iso7 = iso(d7);

  var futures = resas.filter(function(r){ return r.date >= isoAjd; })
                     .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)) || String(a.heure||'').localeCompare(String(b.heure||'')); });
  var passees = resas.filter(function(r){ return r.date < isoAjd; })
                     .sort(function(a,b){ return String(b.date).localeCompare(String(a.date)) || String(b.heure||'').localeCompare(String(a.heure||'')); });

  var ceSoir = futures.filter(function(r){ return r.date === isoAjd; });
  var cvtSoir = ceSoir.reduce(function(s,r){ return s + (Number(r.couverts)||0); }, 0);
  var sept = futures.filter(function(r){ return r.date < iso7; });
  var cvt7 = sept.reduce(function(s,r){ return s + (Number(r.couverts)||0); }, 0);
  var cvtPasses = passees.reduce(function(s,r){ return s + (Number(r.couverts)||0); }, 0);

  var h = resaCaptureBloc();
  h += '<div class="resa-stats">'
    + '<div class="rstat"><div class="rs-num">' + ceSoir.length + '<span style="font-size:15px;color:var(--ink-2)"> · ' + cvtSoir + '</span></div><div class="rs-lbl">Auj. · cvt</div></div>'
    + '<div class="rstat"><div class="rs-num">' + sept.length + '<span style="font-size:15px;color:var(--ink-2)"> · ' + cvt7 + '</span></div><div class="rs-lbl">7 jours · cvt</div></div>'
    + '<div class="rstat"><div class="rs-num">' + passees.length + '</div><div class="rs-lbl">90 j passés</div></div>'
    + '</div>';

  h += '<div class="rseg">'
    + '<button data-vue="avenir" class="' + (RESA_VUE==='avenir'?'on':'') + '">À venir (' + futures.length + ')</button>'
    + '<button data-vue="passees" class="' + (RESA_VUE==='passees'?'on':'') + '">Passées (' + passees.length + ')</button>'
    + '</div>';

  if(RESA_VUE === 'avenir'){
    h += futures.length
      ? resaGroupeParJour(futures, isoAjd, isoDemain)
      : '<div class="resa-vide">Aucune réservation à venir pour l\'instant.<br>Elles arrivent seules depuis TheFork, les emails, WhatsApp et la page de réservation.</div>';
  } else {
    if(passees.length){

        + '<span class="rd-c">' + cvtPasses + ' couverts servis</span></div>';

      var sous = [];

      else if(p.inscrit) sous.push('inscrit le '+esc(p.inscrit));

        + (sous.length ? '<div style="font-size:11px;color:var(--ink-3);margin-top:3px">'+sous.join(' · ')+'</div>' : '')
        + '</div>';

/* ─── accès de l'équipe : c'est le patron qui ouvre les profils ───
   L'auto-inscription a été retirée du backend le 31/07/2026 : un prénom
   était un champ libre, donc le code équipe suffisait à se fabriquer une
   identité, et un départ ne fermait rien. Ici, désactiver ferme vraiment. */
var PROFILS_ACCES = null;

function accesBloc(){
  var h = '<div class="card"><div class="card-h"><span class="card-t">Accès de l\'équipe</span></div>'
        + '<div id="accList"><div class="row-meta">Chargement…</div></div>'
        + '<div class="acc-form">'
        +   '<input id="accNom" maxlength="30" placeholder="Prénom" autocomplete="off">'
        +   '<input id="accCode" maxlength="40" placeholder="Code personnel (8 min.)" autocomplete="off">'
        +   '<button id="accAdd">Ouvrir le profil</button>'
        + '</div>'
        + '<div class="acc-msg" id="accMsg"></div>'
        + '<div class="acc-note">Désactiver ferme l\'accès tout de suite, même si le code est connu — '
        + 'c\'est ce qu\'il faut faire quand quelqu\'un s\'en va. Supprimer efface la ligne.</div>'
        + '</div>';
  return h;
}

function accesCharge(){
  if(!el('accList')) return;
  accesPost({ action:'equipe_liste' })
    .then(function(j){ PROFILS_ACCES = j.profils || []; accesRend(); })
    .catch(function(){ el('accList').innerHTML = '<div class="row-meta">Liste indisponible.</div>'; });
}

function accesRend(){
  var box = el('accList'); if(!box) return;
  if(!PROFILS_ACCES || !PROFILS_ACCES.length){
    box.innerHTML = '<div class="row-meta">Aucun profil. Ouvre le premier ci-dessous.</div>'; return;
  }
  box.innerHTML = PROFILS_ACCES.map(function(p){
    return '<div class="acc-li' + (p.actif ? '' : ' off') + '">'
      + '<span class="acc-dot ' + (p.actif ? 'ok' : 'no') + '"></span>'
      + '<div class="c"><div class="n">' + esc(p.prenom) + '</div>'
      + '<div class="m">' + (p.actif ? 'actif' : 'désactivé')
      + (p.cree ? ' · ouvert le ' + esc(p.cree) : '')
      + (p.aCode ? '' : ' · sans code') + '</div></div>'
      + '<button class="b" data-acc="code" data-nom="' + esc(p.prenom) + '">Code</button>'
      + '<button class="b' + (p.actif ? ' on' : '') + '" data-acc="' + (p.actif ? 'off' : 'on')
      + '" data-nom="' + esc(p.prenom) + '">' + (p.actif ? 'Désactiver' : 'Réactiver') + '</button>'
      + '</div>';
  }).join('');
}

function accesPost(p){
  p.code = ADMIN;
  return fetch(API, { method:'POST', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(p) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j.ok === false) throw new Error(j.error || 'erreur'); return j; });
}

function accesMsg(txt, ok){
  var m = el('accMsg'); if(!m) return;
  m.style.color = ok ? 'var(--ok)' : 'var(--alert)';
  m.textContent = txt;
  if(ok) setTimeout(function(){ if(m.textContent === txt) m.textContent = ''; }, 3500);
}

document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-acc]');
  if(b){
    var nom = b.getAttribute('data-nom'), quoi = b.getAttribute('data-acc');
    if(quoi === 'code'){
      var c = prompt('Nouveau code personnel pour ' + nom + ' (8 caractères minimum)');
      if(c === null) return;
      accesPost({ action:'equipe_code', prenom:nom, nouveauCode:String(c).trim() })
        .then(function(){ accesMsg('Code changé pour ' + nom + '.', true); accesCharge(); })
        .catch(function(e){ accesMsg(e.message, false); });
      return;
    }
    accesPost({ action:'equipe_actif', prenom:nom, actif: quoi === 'on' })
      .then(function(){ accesMsg(nom + (quoi === 'on' ? ' réactivé.' : ' désactivé — son code n\'ouvre plus rien.'), true); accesCharge(); })
      .catch(function(e){ accesMsg(e.message, false); });
    return;
  }
  if(ev.target.id === 'accAdd'){
    var n = el('accNom').value.trim(), c = el('accCode').value.trim();
    if(!n){ accesMsg('Indique un prénom.', false); return; }
    if(c.length < 8){ accesMsg('Le code doit faire au moins 8 caractères.', false); return; }
    accesPost({ action:'equipe_creer', prenom:n, nouveauCode:c })
      .then(function(){ el('accNom').value=''; el('accCode').value='';
        accesMsg('Profil ouvert pour ' + n + '. Donne-lui son code de vive voix.', true); accesCharge(); })
      .catch(function(e){ accesMsg(e.message, false); });
  }
});

/* ─── accès admin aux documents : le PDF passe par le backend, jamais par un lien Drive public ─── */
var PDF_CACHE = {};
function ouvrirPdf(id, lien){
  if(PDF_CACHE[id]){ window.open(PDF_CACHE[id], '_blank'); return; }
  var libelle = lien ? lien.textContent : '';
  if(lien) lien.textContent = '⏳ ouverture…';
  fetch(API, { method:'POST', cache:'no-store', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'facture_pdf', code: ADMIN, id: id }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(lien) lien.textContent = libelle;
      if(!j || j.ok === false) throw new Error((j && j.error) || 'refusé');
      var bin = atob(j.b64), n = bin.length, oct = new Uint8Array(n);
      for(var i=0;i<n;i++) oct[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([oct], {type: j.mime || 'application/pdf'}));
      PDF_CACHE[id] = url;
      window.open(url, '_blank');
    })
    .catch(function(e){
      if(lien){ lien.textContent = libelle; }
      alert('Impossible d\'ouvrir le document : ' + e.message);
    });
}

  var h = '';
  if(a.periodes){
    var P = a.periodes;
    function pst(t, s){
      return '<div class="rstat"><div class="rs-num">' + (s && s.moy != null ? s.moy.toFixed(1) + '<span style="font-size:14px">★</span>' : '—')
        + '</div><div class="rs-lbl">' + t + (s && s.n ? ' · ' + s.n + ' avis' : '') + '</div></div>';
    }
    h += '<div class="resa-stats">' + pst('7 jours', P.semaine) + pst('30 jours', P.mois) + pst('1 an', P.annee) + '</div>';
  }
  h += '<div class="duo">'
    + '<div class="card"><div class="card-label">Note moyenne globale</div>'
    + '<div class="figure"><span data-count="'+(a.moyenne||0)+'" data-fmt="dec">0.00</span><span class="unit">★</span></div>'
    + (a.parPlateforme ? '<div class="row-meta" style="margin-top:6px">' + Object.keys(a.parPlateforme).map(function(k){ return esc(k)+' : '+a.parPlateforme[k]; }).join(' · ') + '</div>' : '')
    + '</div>'
    + '<div class="card"><div class="card-label">Sans réponse</div>'
    + '<div class="figure"><span data-count="'+(a.sansReponse||0)+'" data-fmt="int">0</span></div>'
    + ((a.sansReponse>0)?'<span class="tag warn">à répondre</span>':'<span class="tag ok">tout est répondu</span>')
    + '</div>'
    + '</div>';

  h += '<div class="card" style="margin-top:12px" id="avRep">'
    + '<div class="card-label">Réponses à publier</div>'
    + '<div class="row-meta" id="avRepMsg">Chargement…</div>'
    + '<div id="avRepList"></div>'
    + '<div style="margin-top:10px"><button class="rbtn ghost" id="avGen">Rédiger les réponses manquantes</button></div>'
    + '</div>';

  h += '<div class="card" style="margin-top:12px"><div class="card-label">Derniers avis</div>';
  a.lignes.forEach(function(r){
    h += '<div class="row"><div class="row-main">'
      + '<div class="stars">' + stars(r.note) + '</div>'
      + '<div class="row-title" style="margin-top:4px">' + esc(r.auteur||'Anonyme')
      + ' <span style="color:var(--ink-3);font-size:12px">· ' + esc(r.plateforme||'') + ' · ' + esc(r.date||'') + '</span></div>'
      + (r.extrait ? '<div class="row-meta">' + esc(r.extrait) + '</div>' : '')
      + (r.repondu ? '' : '<span class="tag warn">à répondre</span>')
      + '</div></div>';
  });
  h += '</div>';
  root.innerHTML = h;
  animateFigures(root);
  chargerAvisAReponse();
  el('avGen').addEventListener('click', genererReponsesAvis);
}

/* ─── avis : file des réponses à publier ──────────── */
var AVIS_FILE = [];

var AVIS_LIENS = {
  google: 'https://business.google.com/reviews',
  tripadvisor: 'https://www.tripadvisor.fr/',
  thefork: 'https://manager.thefork.com/',
  facebook: 'https://www.facebook.com/'
};

function apiAvis(payload, cb){
  payload.code = ADMIN;
  fetch(API, { method:'POST', cache:'no-store', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload) })
    .then(function(x){ return x.json(); })
    .then(cb)
    .catch(function(e){ cb({ ok:false, error:e.message }); });
}

function chargerAvisAReponse(){
  var msg = el('avRepMsg'), list = el('avRepList');
  if(!msg) return;
  apiAvis({ action:'avis_liste' }, function(j){
    if(!j || j.ok === false){ msg.textContent = 'Impossible de charger : ' + ((j&&j.error)||'inconnu'); return; }
    AVIS_FILE = j.avis || [];
    var prets = AVIS_FILE.filter(function(x){ return (x.reponse||'').trim(); });
    var sans  = AVIS_FILE.length - prets.length;
    msg.innerHTML = AVIS_FILE.length
      ? '<b>' + prets.length + '</b> réponse(s) prête(s) à publier'
        + (sans ? ' · ' + sans + ' avis sans brouillon' : '')
      : 'Tout est répondu. Rien en attente.';
    list.innerHTML = prets.map(function(r){
      var plt = String(r.plateforme||'').toLowerCase();
      var sensible = /valider/i.test(r.statut||'');
      return '<div class="row" style="align-items:flex-start">'
        + '<div class="row-main">'
        +   '<div class="row-title">' + esc(r.auteur||'Anonyme')
        +     ' <span style="color:var(--ink-3);font-size:12px">· ' + esc(r.plateforme||'') + ' · '
        +     esc(r.date||'') + ' · ' + (Number(r.note)||'?') + '★</span>'
        +     (sensible ? ' <span class="tag alert">à valider</span>' : '') + '</div>'
        +   (r.extrait ? '<div class="row-meta">' + esc(String(r.extrait).slice(0,180)) + '</div>' : '')
        +   '<div class="row-meta" style="margin-top:6px;color:var(--ink-1)">↳ ' + esc(String(r.reponse).slice(0,220)) + '…</div>'
        +   '<div style="margin-top:8px"><button class="rbtn" data-avrep="' + r.ligne + '">Répondre</button></div>'
        + '</div></div>';
    }).join('') || '';
    list.querySelectorAll('[data-avrep]').forEach(function(b){
      b.addEventListener('click', function(){ avisRepondre(Number(b.dataset.avrep)); });
    });
  });
}

function genererReponsesAvis(){
  var msg = el('avRepMsg');
  msg.textContent = 'Rédaction en cours (jusqu\'à 12 avis, ~1 min)…';
  apiAvis({ action:'avis_agent', maxi:12 }, function(j){
    if(!j || j.ok === false){ msg.textContent = 'Échec : ' + ((j&&j.error)||'inconnu'); return; }
    msg.textContent = j.resultat || 'Terminé.';
    setTimeout(chargerAvisAReponse, 800);
  });
}

function avisRepondre(ligne){
  var r = AVIS_FILE.filter(function(x){ return x.ligne === ligne; })[0];
  if(!r) return;
  var plt = String(r.plateforme||'').toLowerCase();
  var lien = AVIS_LIENS[plt] || '';
  var ov = document.createElement('div');
  ov.className = 'resa-ov';
  ov.innerHTML = '<div class="resa-modal">'
    + '<div class="card-label">Répondre — ' + esc(r.plateforme||'') + '</div>'
    + '<div class="row-meta">' + esc(r.auteur||'Anonyme') + ' · ' + esc(r.date||'') + ' · ' + (Number(r.note)||'?') + '★</div>'
    + '<div class="row-meta" style="margin-top:6px">' + esc(String(r.extrait||'').slice(0,400)) + '</div>'
    + '<label class="rlab">Réponse<textarea id="avTxt" rows="7" style="width:100%">' + esc(r.reponse||'') + '</textarea></label>'
    + '<div class="resa-act" style="flex-wrap:wrap;gap:8px">'
    +   '<button class="rbtn ghost" id="avCancel">Fermer</button>'
    +   '<button class="rbtn ghost" id="avCopy">Copier</button>'
    +   (lien ? '<button class="rbtn ghost" id="avOpen">Ouvrir ' + esc(r.plateforme||'') + '</button>' : '')
    +   '<button class="rbtn" id="avDone">Copier + marquer publié</button>'
    + '</div>'
    + '<div class="rmsg" id="avMsg"></div></div>';
  document.body.appendChild(ov);
  function close(){ ov.remove(); }
  ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
  el('avCancel').addEventListener('click', close);

  function copier(){
    var t = el('avTxt').value;
    try { navigator.clipboard.writeText(t); } catch(_){
      el('avTxt').select(); try { document.execCommand('copy'); } catch(__){}
    }
  }
  el('avCopy').addEventListener('click', function(){ copier(); el('avMsg').textContent = 'Réponse copiée.'; });
  if(lien) el('avOpen').addEventListener('click', function(){ copier(); window.open(lien, '_blank'); });
  el('avDone').addEventListener('click', function(){
    copier();
    var msg = el('avMsg');
    msg.textContent = 'Enregistrement…';
    apiAvis({ action:'avis_reponse', ligne:ligne, reponse:el('avTxt').value, publie:true }, function(j){
      if(!j || j.ok === false){ msg.textContent = 'Échec : ' + ((j&&j.error)||'inconnu'); return; }
      msg.textContent = 'Marqué comme publié. La réponse est dans le presse-papier.';
      setTimeout(function(){ close(); chargerAvisAReponse(); }, 700);
    });
  });
}

/* ─── navigation modules ──────────────────────────── */
document.querySelectorAll('.dock-btn').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.dock-btn').forEach(function(x){ x.setAttribute('aria-selected','false'); });
    document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('on'); });
    b.setAttribute('aria-selected','true');
    var panel = el('p-' + b.dataset.panel);
    panel.classList.add('on');
    window.scrollTo({top:0, behavior: REDUCED ? 'auto' : 'smooth'});
  });
});

/* ─── ticket IA ───────────────────────────────────── */
function openTicket(){
  el('scrim').classList.add('on');
  el('ticketWrap').classList.add('on');
  if(!HISTORY.length) push('ai', 'Prêt. Demande-moi le résumé de la journée, ou pose une question sur les ventes, l\'équipe, les factures ou les avis.');
  setTimeout(function(){ el('input').focus(); }, 360);
}
function closeTicket(){
  el('scrim').classList.remove('on');
  el('ticketWrap').classList.remove('on');
}

function push(role, text){
  HISTORY.push({role: role==='me'?'user':'assistant', content:text});
  var d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  el('thread').appendChild(d);
  var hr = document.createElement('hr');
  hr.className = 'ticket-rule';
  el('thread').appendChild(hr);
  el('thread').scrollTop = el('thread').scrollHeight;
}

function ask(text){
  if(!text.trim()) return;
  if(!API){
    push('ai','Le dashboard n\'est pas encore relié à ton Apps Script — je n\'ai aucune donnée à lire.');
    return;
  }
  push('me', text);
  el('input').value = '';
  el('sendBtn').disabled = true;

  var wait = document.createElement('div');
  wait.className = 'msg typing';
  wait.textContent = 'Lecture des données…';
  el('thread').appendChild(wait);
  el('thread').scrollTop = el('thread').scrollHeight;

  fetch(API, {
    method:'POST',
    /* text/plain évite le preflight CORS, qu'Apps Script ne gère pas */
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({
      action:'chat',
      code: ADMIN,
      message: text,
      history: HISTORY.slice(-10)
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    wait.remove();
    if(j.ok === false) throw new Error(j.error || 'erreur inconnue');
    push('ai', j.reply || '(réponse vide)');
  })
  .catch(function(e){
    wait.remove();
    push('ai', 'Impossible de répondre : ' + e.message + '\nVérifie que la clé API est bien enregistrée dans les propriétés du script.');
  })
  .finally(function(){
    el('sendBtn').disabled = false;
  });
}

el('gateBtn').addEventListener('click', gateSubmit);
el('gateInput').addEventListener('keydown', function(e){ if(e.key==='Enter') gateSubmit(); });
el('askBtn').addEventListener('click', openTicket);
el('closeBtn').addEventListener('click', closeTicket);
el('scrim').addEventListener('click', closeTicket);
el('sendBtn').addEventListener('click', function(){ ask(el('input').value); });

el('input').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 110) + 'px';
});
el('input').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(this.value); }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeTicket();
});
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click', function(){ ask(c.textContent); });
});

/* ─── démarrage ───────────────────────────────────── */
paintHeader();
setInterval(paintHeader, 60 * 1000);
load();
setInterval(load, 5 * 60 * 1000);   /* rafraîchissement toutes les 5 min */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) load();
});
</script>
