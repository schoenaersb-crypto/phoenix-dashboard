<!doctype html>
<html lang="fr" id="htmlRoot"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1E2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com http://localhost:* http://127.0.0.1:*; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>Caisse — Brasserie Phoenix</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#16364A; --deep:#0B1E2C; --card:#17394E; --card2:rgba(27,63,85,.55);
 --copper:#B98D55; --gold:#D4A843; --cream:#F6F0E4;
 --ink:var(--cream); --ink2:rgba(246,240,228,.62); --ink3:rgba(246,240,228,.38);
 --ok:#7FA37A; --warn:#D4A843; --alert:#C4633F;
 --hair:rgba(185,141,85,.28); --hair2:rgba(185,141,85,.14);
 --serif:'Cormorant Garamond',Georgia,serif;
 --sans:'Jost',system-ui,-apple-system,sans-serif;
 --mono:'JetBrains Mono',ui-monospace,monospace;
 --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--deep);color:var(--ink);font-family:var(--sans);font-size:16px;
 -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}
/* Un montant se lit toujours de gauche à droite, même dans une page
   écrite de droite à gauche : sans cela le symbole € passe devant. */
[dir="rtl"] .mono,[dir="rtl"] .hero b,[dir="rtl"] .zl b,[dir="rtl"] .zl.sub span,
[dir="rtl"] .tot-l b,[dir="rtl"] .li .pr,[dir="rtl"] .ad-li .pr,[dir="rtl"] .pr-li .p,
[dir="rtl"] .bar .tot b,[dir="rtl"] .ecr,[dir="rtl"] .tb .m{direction:ltr;unicode-bidi:isolate}

header{flex:none;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
 border-bottom:1px solid var(--hair2);display:flex;align-items:center;gap:12px;background:var(--deep)}
header .t{flex:1;min-width:0}
header h1{font-family:var(--serif);font-weight:400;font-size:21px;margin:0;line-height:1.15;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--copper);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;display:flex;align-items:baseline;gap:5px;padding:5px 11px;border-radius:999px;
 border:1px solid var(--hair);background:rgba(185,141,85,.08)}
.pill b{font-family:var(--serif);font-size:19px;color:var(--gold);line-height:1}
.pill span{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.back,.moi{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--hair);
 display:grid;place-items:center;font-size:19px;color:var(--copper)}
.moi{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--gold)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 96px}
.vue{display:none}.vue.on{display:block}

/* ── plan de salle ─────────────────────────────────────────────── */
.zone{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--copper);margin:16px 0 9px}
.zone:first-child{margin-top:0}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:9px}
.tb{aspect-ratio:1;border:1px solid var(--hair);border-radius:13px;background:var(--card2);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
 transition:transform .1s,border-color .15s,background .15s;position:relative}
.tb:active{transform:scale(.95)}
.tb .r{font-family:var(--mono);font-size:14px;font-weight:600}
.tb .p{font-family:var(--mono);font-size:9px;color:var(--ink3)}
.tb .m{font-size:10.5px;color:var(--ink2);margin-top:1px}
.tb .sv{position:absolute;top:5px;right:7px;font-family:var(--mono);font-size:8px;color:var(--copper)}
.tb.occ{border-color:var(--gold);background:rgba(212,168,67,.13)}
.tb.att{border-color:var(--alert);background:rgba(196,99,63,.15)}
.tb.add{border-color:var(--ok);background:rgba(127,163,122,.15)}
.tb.oub{animation:oub 1.6s ease-in-out infinite}
@keyframes oub{0%,100%{box-shadow:0 0 0 0 rgba(196,99,63,0)}50%{box-shadow:0 0 0 4px rgba(196,99,63,.30)}}

/* ── commande ──────────────────────────────────────────────────── */
.svc{margin-bottom:16px}
.svc h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--copper);margin:0 0 8px;display:flex;align-items:center;gap:9px}
.svc h3 .etat{font-size:9px;letter-spacing:.08em;padding:2px 7px;border-radius:999px;border:1px solid}
.e-attente{color:var(--alert);border-color:rgba(196,99,63,.5)}
.e-lance{color:var(--ok);border-color:rgba(127,163,122,.5)}
.e-debar{color:var(--ink3);border-color:var(--hair)}
.e-retard{color:#E8A54B;border-color:rgba(232,165,75,.6);animation:clignote 1.1s ease-in-out infinite}
@keyframes clignote{0%,100%{opacity:1}50%{opacity:.35}}
.svc h3 button.pulse{animation:clignote 1.4s ease-in-out infinite}
.svc h3 button[data-debar]{background:transparent;color:var(--copper);border:1px solid var(--hair)}
/* écran cuisine : l'âge et les mots-couleurs */
.tk.retard{border-color:rgba(232,165,75,.7)}
.tk .ret-mn{color:#E8A54B;animation:clignote 1.1s ease-in-out infinite}
.tk .et{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;
 padding:1px 6px;border-radius:999px;border:1px solid;margin-inline-end:7px;vertical-align:1px}
.tk .et-att{color:#E08A6D;border-color:rgba(196,99,63,.6)}
.tk .et-env{color:#8FBF88;border-color:rgba(127,163,122,.6)}
.svc h3 button{margin-inline-start:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
 color:var(--deep);background:var(--gold);padding:5px 11px;border-radius:999px;font-weight:600}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border:1px solid var(--hair2);
 border-radius:12px;margin-bottom:7px;background:rgba(255,255,255,.02)}
.li .q{font-family:var(--mono);font-size:15px;color:var(--gold);min-width:22px}
.li .c{flex:1;min-width:0}
.li .n{font-size:14.5px;line-height:1.25}
.li .o{font-size:11.5px;color:var(--gold);margin-top:3px;line-height:1.35}
.li .o.ret{color:var(--alert)}
.li .o.gris{color:var(--ink3)}
.li .pr{font-family:var(--mono);font-size:13px;color:var(--ink2);white-space:nowrap}
.li .pr.off{text-decoration:line-through;color:var(--ink3)}
.li.att{opacity:.62}
.li.annule{opacity:.45}
.li.annule .n{text-decoration:line-through}
.li .x{flex:none;color:var(--ink3);font-size:17px;padding:0 4px;min-width:26px}
.vide{text-align:center;color:var(--ink3);font-size:13.5px;padding:26px 0;line-height:1.6}

/* ── carte ─────────────────────────────────────────────────────── */
/* Toutes les categories visibles d'un coup, en tuiles pleines —
   le geste Agora que l'equipe connait, aux couleurs Phoenix. */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;
 padding:2px 0 12px;margin:0}
.cat{padding:10px 6px;min-height:48px;border-radius:11px;border:1px solid var(--hair);
 font-size:13px;line-height:1.15;color:var(--ink2);background:var(--card2);
 text-align:center;white-space:normal;word-break:break-word;
 display:flex;align-items:center;justify-content:center}
.cat:active{background:rgba(185,141,85,.18)}
.cat.on{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:600}
.pr-li{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--hair2);
 border-radius:12px;margin-bottom:7px;background:rgba(255,255,255,.02);width:100%;text-align:start}
.pr-li:active{background:rgba(185,141,85,.10)}
.pr-li .c{flex:1;min-width:0}
.pr-li .n{font-size:15px;line-height:1.25}
.pr-li .d{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.3;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr-li .p{font-family:var(--mono);font-size:14px;color:var(--gold);flex:none}
.pr-li.rupt{opacity:.42}
.pr-li.rupt .p{color:var(--alert)}
.coeur{color:var(--gold);font-size:11px}
.rech{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--hair);
 background:rgba(0,0,0,.2);color:var(--cream);font-family:inherit;font-size:15px;margin-bottom:11px}

/* ── feuille modale ────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;z-index:900;display:none;background:rgba(11,26,36,.72);
 -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet.on{display:block}
.sheet .pan{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
 background:var(--card);border-top:1px solid var(--hair);border-radius:20px 20px 0 0;
 padding:14px 16px calc(18px + var(--safe));animation:up .2s cubic-bezier(.22,.9,.3,1) both}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto 13px}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 2px}
.sheet .sub{font-size:12px;color:var(--ink3);margin-bottom:14px}
.lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--copper);margin:15px 0 8px}
.lab .oblig{color:var(--alert);letter-spacing:0}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:9px 14px;border-radius:999px;border:1px solid var(--hair);font-size:13.5px;color:var(--ink2)}
.opt.on{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:500}
.opt.ret.on{background:var(--alert);border-color:var(--alert);color:#fff}
.nb{display:flex;align-items:center;gap:14px}
.nb button{width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);font-size:20px;
 display:grid;place-items:center;color:var(--gold)}
.nb b{font-family:var(--serif);font-size:26px;min-width:34px;text-align:center}
.inp{width:100%;padding:12px;border-radius:11px;border:1px solid var(--hair);
 background:rgba(0,0,0,.2);color:var(--cream);font-family:inherit;font-size:15px}
.go{width:100%;margin-top:18px;padding:15px;border-radius:14px;background:var(--gold);
 color:var(--deep);font-weight:600;font-size:16px}
.go:disabled{opacity:.4}
.go.sec{background:transparent;border:1px solid var(--hair);color:var(--ink2);margin-top:9px}
.go.dang{background:var(--alert);color:#fff}

/* ── pavé numérique ────────────────────────────────────────────── */
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.pave button{padding:16px 0;border-radius:13px;border:1px solid var(--hair);
 font-family:var(--mono);font-size:22px;color:var(--cream);background:rgba(255,255,255,.03)}
.pave button:active{background:rgba(212,168,67,.2)}
.pave button.eff{color:var(--alert);font-size:17px}
.ecr{font-family:var(--mono);font-size:32px;text-align:center;padding:14px 0 6px;
 color:var(--gold);letter-spacing:.06em;min-height:58px}
.ecr small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* ── connexion ─────────────────────────────────────────────────── */
#vLogin{position:fixed;inset:0;z-index:1000;background:var(--deep);display:none;
 flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(20px + var(--safe));
 overflow-y:auto}
#vLogin.on{display:flex}
#vLogin .marque{text-align:center;margin-bottom:8px}
#vLogin .marque b{font-family:var(--serif);font-weight:400;font-size:30px;display:block}
#vLogin .marque span{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;
 text-transform:uppercase;color:var(--copper)}
#vLogin .qui{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 4px}
#vLogin .qui button{padding:11px 18px;border-radius:999px;border:1px solid var(--hair);
 font-size:15px;color:var(--ink2)}
#vLogin .qui button.on{background:var(--gold);border-color:var(--gold);color:var(--deep);font-weight:600}
#vLogin .msg{text-align:center;font-size:13px;min-height:20px;margin-top:10px;color:var(--alert)}
#vLogin .pave{max-width:300px;margin:6px auto 0;width:100%}
#vLogin .lg{display:flex;gap:7px;justify-content:center;margin-top:18px}
#vLogin .lg button{padding:7px 13px;border-radius:999px;border:1px solid var(--hair2);
 font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink3)}
#vLogin .lg button.on{color:var(--gold);border-color:var(--hair)}

/* ── addition ──────────────────────────────────────────────────── */
.ad-li{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--hair2);
 border-radius:12px;margin-bottom:6px;background:rgba(255,255,255,.02)}
.ad-li.sel{border-color:var(--gold);background:rgba(212,168,67,.12)}
.ad-li .ck{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--hair);
 display:grid;place-items:center;font-size:13px;color:var(--deep)}
.ad-li.sel .ck{background:var(--gold);border-color:var(--gold)}
.ad-li .c{flex:1;min-width:0}
.ad-li .n{font-size:14.5px}
.ad-li .o{font-size:11px;color:var(--ink3);margin-top:2px}
.ad-li .pr{font-family:var(--mono);font-size:13.5px;color:var(--ink2)}
.tot-bloc{border:1px solid var(--hair);border-radius:14px;padding:13px 15px;margin:14px 0;
 background:var(--card2)}
.tot-l{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:14px;color:var(--ink2)}
.tot-l b{font-family:var(--mono);color:var(--ink)}
.tot-l.gd{padding-top:11px;margin-top:7px;border-top:1px dashed var(--hair);font-size:16px;color:var(--ink)}
.tot-l.gd b{font-family:var(--serif);font-size:27px;color:var(--gold)}
.tot-l.rem b{color:var(--ok)}
.paie{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.paie button{padding:17px 10px;border-radius:14px;border:1px solid var(--hair);font-size:15px;
 display:flex;flex-direction:column;align-items:center;gap:5px}
.paie button i{font-style:normal;font-size:21px}
.paie button.pr-esp{border-color:var(--ok);color:var(--ok)}
.paie button.pr-car{border-color:var(--gold);color:var(--gold)}
.mini{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.mini button{flex:1;min-width:104px;padding:11px;border-radius:11px;border:1px solid var(--hair2);
 font-size:12.5px;color:var(--ink2)}

/* ── écrans cuisine / bar ──────────────────────────────────────── */
.tk{border:1px solid var(--hair);border-radius:14px;padding:13px;margin-bottom:11px;background:var(--card2)}
.tk.marche{border-color:var(--gold);background:rgba(212,168,67,.12)}
.tk.rappel{border-color:var(--alert)}
.tk .h{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;padding-bottom:9px;
 border-bottom:1px dashed var(--hair)}
.tk .h b{font-family:var(--serif);font-size:27px;color:var(--gold);line-height:1}
.tk .h .m{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.tk .h .cp{margin-inline-start:auto;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
 padding:3px 8px;border-radius:999px;border:1px solid var(--hair);color:var(--copper)}
.tk .l{display:flex;gap:9px;padding:4px 0;font-size:14.5px}
.tk .l .q{font-family:var(--mono);color:var(--gold);min-width:20px}
.tk .l em{display:block;font-style:normal;font-weight:600;font-size:12.5px;color:var(--gold);margin-top:1px}
.tk .l em.ret{color:var(--alert)}
.tk .alg{margin:-4px 0 9px;padding:6px 9px;border-radius:8px;background:rgba(196,99,63,.2);
 border:1px solid rgba(196,99,63,.5);font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#F0B8A0}
.tk .fait{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--hair);
 color:var(--ok);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.seg{display:flex;gap:7px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:11px;border:1px solid var(--hair);font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:500}

/* ── journée / Z ───────────────────────────────────────────────── */
.blocz{border:1px solid var(--hair2);border-radius:14px;padding:13px 15px;margin-bottom:11px;
 background:rgba(255,255,255,.02)}
.blocz h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--copper);margin:0 0 10px}
.zl{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px;color:var(--ink2)}
.zl b{font-family:var(--mono);color:var(--ink);white-space:nowrap}
.zl.sub{font-size:12.5px;color:var(--ink3);padding-inline-start:12px}
.hero{text-align:center;padding:6px 0 14px}
.hero b{font-family:var(--serif);font-size:44px;color:var(--gold);display:block;line-height:1}
.hero span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}

/* ── barre du bas ──────────────────────────────────────────────── */
.bar{position:fixed;left:0;right:0;bottom:calc(53px + var(--safe));z-index:500;display:none;gap:9px;
 padding:11px 14px;background:linear-gradient(to top,var(--deep) 78%,rgba(11,30,44,0));align-items:center}
.bar.on{display:flex}
.bar .tot{flex:1;min-width:0}
.bar .tot b{font-family:var(--serif);font-size:23px;color:var(--gold);display:block;line-height:1.05}
.bar .tot span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.bar button{flex:none;padding:13px 15px;border-radius:13px;font-weight:600;font-size:14px}
.bar .env{background:var(--gold);color:var(--deep)}
.bar .add{border:1px solid var(--hair);color:var(--gold)}
.bar .fin{border:1px solid rgba(127,163,122,.6);color:var(--ok)}

nav{flex:none;display:flex;border-top:1px solid var(--hair2);background:var(--deep);
 padding-bottom:var(--safe)}
nav button{flex:1;padding:11px 4px 9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
 text-transform:uppercase;color:var(--ink3)}
nav button.on{color:var(--gold)}
nav button i{display:block;font-style:normal;font-size:17px;margin-bottom:3px}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:9px;background:var(--alert);
 color:#fff;font-size:9px;line-height:16px;margin-inline-start:3px;vertical-align:1px}
#hors{display:none;background:var(--alert);color:#fff;font-family:var(--mono);font-size:10px;
 letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:4px}
#hors.on{display:block}
#pr{position:fixed;width:0;height:0;border:0;left:-9999px;top:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>

<div id="vLogin">
  <div class="marque"><b>Caisse Phoenix</b><span>Brasserie Phoenix</span></div>
  <div class="qui" id="lgQui"></div>
  <div class="ecr" id="lgEcr">····<small id="lgLab">code</small></div>
  <div class="pave" id="lgPave"></div>
  <div class="msg" id="lgMsg"></div>
  <div class="lg" id="lgLangues"></div>
</div>

<div id="hors">hors ligne — les ventes sont gardées ici</div>

/* ─────────────────────────────────────────────────────────────────
   L'ÉTAT — écrit sur l'appareil à chaque changement.
   ───────────────────────────────────────────────────────────────── */
var CLE = 'phx_caisse_v2';
var S = null;
function etatNeuf(){
  return { v:2, jour:jourService(), tables:{}, tickets:[], ventes:[], journal:[],
           pointages:[], seq:0, numTicket:0, fond:0, rupture:{}, ouvertA:Date.now() };
}
function charge(){
  try{
    var b = localStorage.getItem(CLE);
    if(b){ var o = JSON.parse(b);
      if(o && o.v===2){
        /* Une journée nouvelle sans Z de la veille : on garde tout, le
           Z de la veille reste à faire et l'écran de journée le dira. */
        S = o; return;
      } }
  }catch(e){}
  S = etatNeuf();
}
var sauveT = null;
function sauve(){
  clearTimeout(sauveT);
  sauveT = setTimeout(function(){ ecrisLocal(); syncPousse(); }, 120);
}
function ecrisLocal(){
  try{ localStorage.setItem(CLE, JSON.stringify(S)); }
  catch(e){ PHXtoast('Mémoire pleine — préviens Bastien'); }
}
function id(){ S.seq++; return S.seq; }

/* ═════════════════════════════════════════════════════════════════
   LE PARTAGE ENTRE APPAREILS
   Tous les appareils parlent au même serveur : Phoenix Relais, sur
   le PC du bar — jamais entre eux. Après chaque geste, l'appareil
   envoie ses DIFFÉRENCES ; toutes les 2,5 secondes, il demande un
   simple numéro de version et ne rapatrie l'état que s'il a bougé.
   Une table appartient au dernier appareil qui l'a modifiée ; une
   table soldée laisse une pierre tombale pour ne pas ressusciter ;
   ventes et journal ne font que s'ajouter. Servie depuis GitHub
   (https), la caisse reste seule : le partage ne vit qu'en http,
   sur le wifi du bar.
   ═════════════════════════════════════════════════════════════════ */
var SYNC_OK = (location.protocol === 'http:');
var SYNC_URL = location.origin;
var SYNCV = -1, SYNC_OMBRE = null;
function jsonSans(o){ return JSON.stringify(o, function(k,v){ return k==='mod' ? undefined : v; }); }
function ombreVide(){ return { tables:{}, tickets:{}, nV:0, nJ:0, rupture:'{}' }; }
function ombreDe(){
  var o = { tables:{}, tickets:{}, nV:S.ventes.length, nJ:S.journal.length,
            rupture: JSON.stringify(S.rupture||{}) };
  for(var r in S.tables) o.tables[r] = jsonSans(S.tables[r]);
  S.tickets.forEach(function(k){ o.tickets[k.id] = !!k.fait; });
  return o;
}
function syncPousse(){
  if(!SYNC_OK) return Promise.resolve();
  var o = SYNC_OMBRE || ombreVide();
  var d = null, r, js;
  function D(){ return d = d || { jour:S.jour, appareil:APPAREIL }; }
  for(r in S.tables){
    js = jsonSans(S.tables[r]);
    if(o.tables[r] !== js){ S.tables[r].mod = Date.now(); (D().tables = D().tables || {})[r] = S.tables[r]; }
  }
  for(r in o.tables){ if(!S.tables[r]) (D().supprime = D().supprime || {})[r] = Date.now(); }
  var neufs = S.tickets.filter(function(k){ return !(k.id in o.tickets); });
  if(neufs.length) D().tickets = neufs;
  var faits = S.tickets.filter(function(k){ return (k.id in o.tickets) && k.fait && !o.tickets[k.id]; })
                       .map(function(k){ return k.id; });
  if(faits.length) D().ticketsFait = faits;
  if(S.ventes.length > o.nV) D().ventes = S.ventes.slice(o.nV);
  if(S.journal.length > o.nJ) D().journal = S.journal.slice(o.nJ);
  if(JSON.stringify(S.rupture||{}) !== o.rupture) D().rupture = { map:S.rupture, ts:Date.now() };
  if(!d) return Promise.resolve();
  SYNC_OMBRE = ombreDe();
  return fetch(SYNC_URL + '/sync/maj', { method:'POST', cache:'no-store',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(d) })
    .then(function(x){ return x.json(); })
    .then(function(j){
      if(!j || typeof j.v !== 'number') return;
      if(typeof j.gen === 'number' && S.syncGen === undefined) S.syncGen = j.gen;
      var avant = SYNCV; SYNCV = j.v;
      /* Le serveur n'a rien changé alors qu'on lui a envoyé quelque
         chose : il a refusé (table déjà soldée ailleurs, Z passé…).
         On rapatrie son état pour se remettre d'accord. */
      if(j.v === avant){ SYNCV = -1; return syncTire(); }
    })
    .catch(function(){ SYNC_OMBRE = null; }); /* échec : tout repartira au prochain contact */
}
function syncApplique(E){
  SYNCV = E.v;
  /* La génération change quand un Z est passé quelque part : la journée
     commune est repartie de zéro, on adopte l'état du serveur en bloc.
     Un appareil qui n'a jamais synchronisé retient simplement la
     génération courante et fusionne normalement. */
  if(typeof E.gen === 'number'){
    if(S.syncGen === undefined){ S.syncGen = E.gen; }
    else if(E.gen !== S.syncGen){
      S.syncGen = E.gen; S.jour = E.jour || S.jour;
      S.tables = E.tables || {}; S.tickets = E.tickets || [];
      S.ventes = E.ventes || []; S.journal = E.journal || [];
      S.rupture = E.rupture || {}; S.ruptureTs = E.ruptureTs || 0;
      TREF = null; SYNC_OMBRE = ombreDe(); ecrisLocal();
      if(VUE==='table' || VUE==='add') aller('plan');
      renderPlan(); majBadge(); if(VUE==='ecran') renderEcran();
      return;
    }
  }
  /* Journée différente déjà entamée sur le serveur : un appareil vide
     l'adopte, un appareil chargé s'abstient plutôt que de mélanger. */
  var srvOccupe = (E.ventes && E.ventes.length) || Object.keys(E.tables||{}).length;
  var locOccupe = S.ventes.length || Object.keys(S.tables).length;
  if(E.jour && E.jour !== S.jour){
    if(srvOccupe && locOccupe) return;
    if(srvOccupe) S.jour = E.jour;
  }
  var change = false, r;
  for(r in E.tables){
    var loc = S.tables[r], srv = E.tables[r];
    if(!loc || (srv.mod||0) >= (loc.mod||0)){
      if(!loc || jsonSans(loc) !== jsonSans(srv) || (loc.mod||0) !== (srv.mod||0)){ S.tables[r] = srv; change = true; }
    }
  }
  for(r in S.tables){
    if(!E.tables[r] && ((E.tombes||{})[r]||0) > Math.max(S.tables[r].ts||0, S.tables[r].mod||0)){
      delete S.tables[r]; change = true;
      if(TREF === r){ TREF = null; if(VUE!=='plan' && VUE!=='ecran' && VUE!=='jour') aller('plan'); }
    }
  }
  var srvIds = {}; (E.tickets||[]).forEach(function(k){ srvIds[k.id] = 1; });
  var locaux = S.tickets.filter(function(k){ return !srvIds[k.id]; });
  if(locaux.length !== S.tickets.length || (E.tickets||[]).length !== S.tickets.length) change = true;
  S.tickets = locaux.concat(E.tickets||[]);
  var parNo = {}; S.ventes.concat(E.ventes||[]).forEach(function(v){ parNo[v.no] = v; });
  var ventes = Object.keys(parNo).map(function(n){ return parNo[n]; })
                     .sort(function(a,b){ return a.ts - b.ts; });
  if(ventes.length !== S.ventes.length) change = true;
  S.ventes = ventes;
  var clefs = {}, journal = [];
  S.journal.concat(E.journal||[]).forEach(function(e){
    var c = [e.ts,e.qui,e.type,e.detail,e.montant].join('|');
    if(!clefs[c]){ clefs[c] = 1; journal.push(e); }
  });
  journal.sort(function(a,b){ return a.ts - b.ts; });
  if(journal.length !== S.journal.length) change = true;
  S.journal = journal;
  if(E.rupture && (E.ruptureTs||0) > (S.ruptureTs||0)){
    S.rupture = E.rupture; S.ruptureTs = E.ruptureTs; change = true;
  }
  SYNC_OMBRE = ombreDe();
  if(change){
    ecrisLocal();
    if(VUE==='plan') renderPlan();
    if(VUE==='table' && TREF && S.tables[TREF]) renderTable();
    if(VUE==='add' && TREF && S.tables[TREF]) renderAdd();
    if(VUE==='ecran') renderEcran();
    majBadge();
  }
}
function syncTire(){
  if(!SYNC_OK) return Promise.resolve();
  return fetch(SYNC_URL + '/sync/version', { cache:'no-store' })
    .then(function(x){ return x.json(); })
    .then(function(j){
      if(!j || j.v === SYNCV) return;
      return fetch(SYNC_URL + '/sync/etat', { cache:'no-store' })
        .then(function(x){ return x.json(); })
        .then(function(E){ if(E) syncApplique(E); });
    })
    .catch(function(){});
}
function syncRaz(){
  if(!SYNC_OK) return Promise.resolve();
  SYNC_OMBRE = ombreDe();
  return fetch(SYNC_URL + '/sync/maj', { method:'POST', cache:'no-store',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ z:true, jour:S.jour, appareil:APPAREIL }) })
    .then(function(x){ return x.json(); })
    .then(function(j){ if(j && typeof j.v === 'number'){ SYNCV = j.v;
      if(typeof j.gen === 'number') S.syncGen = j.gen; } })
    .catch(function(){});
}
function syncDemarre(){
  if(!SYNC_OK) return;
  syncTire().then(function(){ SYNC_OMBRE = SYNC_OMBRE || ombreVide(); return syncPousse(); });
  setInterval(function(){ if(!document.hidden) syncTire(); }, 2500);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) syncTire(); });
}

/* La liste des prénoms est mise en cache : si le wifi tombe entre deux
   services, on doit pouvoir reprendre le poste sans réseau. */
var PROFILS = [];
function chargeProfils(){
  try{ PROFILS = JSON.parse(localStorage.getItem('phx_caisse_profils')||'[]'); }catch(e){ PROFILS=[]; }
  if(!PROFILS.length) PROFILS = ['Clément','Bouchra','Oumaima','Bastien'];
  rendLogin();
  if(!API || API.indexOf('http')!==0) return;
  if(chargeProfils.fait) return;
  chargeProfils.fait = 1;
  fetch(API, {method:'POST', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'caisse_profils' })})
   .then(function(r){ return r.json(); })
   .then(function(j){ if(j && j.ok && j.noms && j.noms.length){
      PROFILS = j.noms; localStorage.setItem('phx_caisse_profils', JSON.stringify(PROFILS)); rendLogin(); } })
   .catch(function(){});
}

var LG_SEL = null, LG_CODE = '';
function rendLogin(){
  el('lgQui').innerHTML = PROFILS.map(function(n){
    return '<button data-qui="'+esc(n)+'"'+(n===LG_SEL?' class="on"':'')+'>'+esc(n)+'</button>';
  }).join('');
  el('lgLangues').innerHTML = Object.keys(T).map(function(k){
    return '<button data-lg="'+k+'"'+(k===LG?' class="on"':'')+'>'+esc(T[k].nom)+'</button>';
  }).join('');
  el('lgPave').innerHTML = [1,2,3,4,5,6,7,8,9].map(function(n){
      return '<button data-num="'+n+'">'+n+'</button>'; }).join('')
    + '<button class="eff" data-num="C">&#9003;</button><button data-num="0">0</button>'
    + '<button data-num="ok" style="color:var(--gold)">✓</button>';
  majEcranCode();
}
/* Les cases vides doivent se distinguer des chiffres tapes. Avant, un code
   efface affichait quatre points identiques a quatre chiffres masques : le
   serveur appuyait sur C, voyait toujours quatre points, et croyait que son
   code s'ajoutait par-dessus. Ici les cases remplies sont pleines et dorees,
   les cases vides sont creuses et grises. */
function majEcranCode(){
  var n = LG_CODE.length, cases = '';
  for(var i=0;i<Math.max(4,n);i++){
    cases += i<n ? '<b style="color:var(--gold)">&#9679;</b>'
                 : '<b style="color:var(--ink3);font-weight:400">&#9675;</b>';
  }
  el('lgEcr').innerHTML = '<span style="letter-spacing:.18em">' + cases + '</span>'
    + '<small>' + esc(LG_SEL ? LG_SEL : t('qui_es_tu')) + '</small>';
}
var LG_LONG = 4;
function tenteConnexion(){
  if(tenteConnexion.enCours) return;              /* deux appuis = deux pointages */
  if(!LG_SEL){ el('lgMsg').style.color='var(--alert)';
               el('lgMsg').textContent = t('qui_es_tu'); return; }
  if(LG_CODE.length<LG_LONG){ el('lgMsg').style.color='var(--alert)';
               el('lgMsg').textContent = t('mauvais_code'); return; }
  tenteConnexion.enCours = true;
  el('lgPave').style.opacity = '.45';
  var msg = el('lgMsg'); msg.style.color='var(--ink3)'; msg.textContent='…';
  function ouvre(){
    tenteConnexion.enCours = false; el('lgPave').style.opacity = '1';
    msg.textContent=''; LG_CODE=''; majEcranCode();
    poseMoi({ nom:LG_SEL, debut:Date.now() });
    pointe('entree');
    el('vLogin').classList.remove('on');
    PHXtoast(t('bonjour') + ' ' + MOI.nom);
    aller('plan');
  }
  if(!API || API.indexOf('http')!==0){ ouvre(); return; }

  /* Le serveur met deux a quatre secondes a repondre — c'est Apps Script, et
     il n'y a rien a y faire. Attendre cela a chaque prise de service, en plein
     coup de feu, est insupportable. Alors : si cet appareil a deja vu ce code
     fonctionner, on ouvre TOUT DE SUITE et on verifie derriere. Si le serveur
     refuse, la session se ferme et le message le dit. Le premier jour, ou
     apres un changement de code, l'attente reste — une seule fois. */
  var att = null; try{ att = localStorage.getItem('phx_ec_'+LG_SEL); }catch(e){}
  var connu = att && att === sceau(LG_CODE);
  var qui = LG_SEL, cle = LG_CODE;

  /* Sans delai de garde, un serveur muet laissait l'ecran sur « … » pour
     toujours. Et Apps Script renvoie parfois du HTML au lieu du JSON. */
  function verifie(surSucces, surEchec){
    var fini = false;
    var minuteur = setTimeout(function(){ if(!fini){ fini=true; surEchec(true); } }, 12000);
    fetch(API, {method:'POST', cache:'no-store',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'caisse_login', prenom:qui, code:cle })})
     .then(function(r){ return r.text(); })
     .then(function(txt){
       if(fini) return; fini=true; clearTimeout(minuteur);
       var j=null; try{ j=JSON.parse(txt); }catch(e){}
       if(!j) return surEchec(true);
       if(j.ok){ try{ localStorage.setItem('phx_ec_'+qui, sceau(cle)); }catch(e){}
                 surSucces(); }
       else surEchec(false);
     })
     .catch(function(){ if(fini) return; fini=true; clearTimeout(minuteur); surEchec(true); });
  }
  function refuse(reseau){
    tenteConnexion.enCours = false;
    el('lgPave').style.opacity = '1';
    msg.style.color='var(--alert)';
    if(reseau){ msg.textContent = 'Serveur injoignable — reessaie'; return; }
    msg.textContent = t('mauvais_code'); LG_CODE=''; majEcranCode();
  }

  if(connu){
    ouvre();
    verifie(function(){}, function(reseau){
      if(reseau) return;
      PHXtoast(t('mauvais_code'));
      poseMoi(null);
      try{ sessionStorage.removeItem('phx_caisse_moi');
           localStorage.removeItem('phx_ec_'+qui); }catch(e){}
      LG_SEL=null; LG_CODE=''; rendLogin();
      el('vLogin').classList.add('on');
    });
    return;
  }
  verifie(ouvre, refuse);
}
/* Empreinte locale du code : de quoi reconnaître le même code sans le
   garder en clair sur la tablette. Ce n'est pas un coffre-fort, c'est
   un dépannage pour les soirs sans wifi. */
function sceau(c){
  var s = 'phoenix|' + c, h1 = 5381, h2 = 52711;
  for(var i=0;i<s.length;i++){ h1 = ((h1*33) ^ s.charCodeAt(i)) >>> 0;
                               h2 = ((h2*39) ^ s.charCodeAt(s.length-1-i)) >>> 0; }
  return h1.toString(36) + '-' + h2.toString(36);
}
function deconnexion(){
  pointe('sortie');
  var d = MOI ? MOI.debut : Date.now();
  poseMoi(null);
  try{ sessionStorage.removeItem('phx_caisse_moi'); }catch(e){}
  LG_SEL=null; LG_CODE=''; rendLogin();
  el('vLogin').classList.add('on');
  fermerFeuille();
}

var FILE = [];
try{ FILE = JSON.parse(localStorage.getItem('phx_caisse_file')||'[]'); }catch(e){ FILE=[]; }
function fileSauve(){ try{ localStorage.setItem('phx_caisse_file', JSON.stringify(FILE)); }catch(e){} }
function envoiDiffere(p){ FILE.push({ p:p, essais:0 }); fileSauve(); videFile(); }
var enVidage = false;
function videFile(){
  if(enVidage || !FILE.length || !API || API.indexOf('http')!==0) return;
  if(!navigator.onLine){ majHors(); return; }
  enVidage = true;
  var it = FILE[0];
  fetch(API, {method:'POST', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(it.p)})
   .then(function(r){ return r.json(); })
   .then(function(){ FILE.shift(); fileSauve(); enVidage=false; majHors(); if(FILE.length) videFile(); })
   .catch(function(){ it.essais++; enVidage=false; majHors();
                      setTimeout(videFile, Math.min(60000, 3000*it.essais)); });
}
function majHors(){
  el('hors').classList.toggle('on', !navigator.onLine || FILE.length>2);
}

var VUE = 'plan', TREF = null, CAT = D.ordre[0], ECRAN = 'cuisine', RECH = '';
var ORDRE_SVC = ['aperitif','entree','plat','dessert','boisson'];
/* Délais depuis le faire marcher, en minutes — au-delà, orange. */
var SEUIL_SVC = {aperitif:5, entree:10, plat:10, dessert:5, boisson:5};
var NOM_SVC = {aperitif:'Apéritif', entree:'Entrées', plat:'Plats', dessert:'Desserts', boisson:'Boissons'};
var ZONES = [
  {k:'terraza', t:'Terraza — notre salle'},
  {k:'passage', t:'Tables hautes'},
  {k:'mer',     t:'Front de mer'}
];
function tablesDe(z){ return D.plan.tables.filter(function(x){ return x.zone===z && x.places>0; }); }
function vivantes(t){ return t.lignes.filter(function(l){ return !l.annule; }); }
function etatTable(ref){
  var t = S.tables[ref]; if(!t) return '';
  if(t.addDemandee) return 'add';
  var att=0, saisie=0, vieux=0, now=Date.now();
  vivantes(t).forEach(function(l){
    if(l.etat==='attente') att++;
    if(l.etat==='saisie') saisie++;
    if(l.etat==='lance' && now-l.tsLance > 25*60*1000) vieux++;
  });
  if(vieux) return 'oub';
  if(att||saisie) return 'att';
  return 'occ';
}
function totalTable(ref){
  var t = S.tables[ref]; if(!t) return 0;
  return vivantes(t).reduce(function(s,l){ return s + (l.offert?0:l.pu*l.qte); }, 0);
}
function payeTable(ref){
  var t = S.tables[ref]; if(!t || !t.paiements) return 0;
  return t.paiements.reduce(function(s,p){ return s+p.montant; },0);
}
function resteTable(ref){
  var t = S.tables[ref]; if(!t) return 0;
  return Math.max(0, totalTable(ref) - (t.remise||0) - payeTable(ref));
}
function renderPlan(){
  var h='', couverts=0, occ=0;
  ZONES.forEach(function(z){
    var lst = tablesDe(z.k);
    if(!lst.length) return;
    h += '<div class="zone">'+esc(z.t)+'</div><div class="grille">';
    lst.forEach(function(tb){
      var t = S.tables[tb.ref];
      if(t){ couverts += t.couverts; occ++; }
      var cl = t ? etatTable(tb.ref) : '';
      h += '<button class="tb '+cl+'" data-ref="'+esc(tb.ref)+'">'
         +   (t && t.par ? '<span class="sv">'+esc(t.par.slice(0,2).toUpperCase())+'</span>' : '')
         +   '<span class="r">'+esc(tb.ref)+'</span>'
         +   '<span class="p">'+(t? t.couverts+' cv' : tb.places+' pl.')+'</span>'
         +   (t ? '<span class="m">'+eur(totalTable(tb.ref))+'</span>' : '')
         + '</button>';
    });
    h += '</div>';
  });
  el('vPlan').innerHTML = h;
  /* Le plan se redessine aussi quand on est ailleurs (après un
     encaissement, toutes les minutes). Il ne doit pas pour autant
     écrire par-dessus l'en-tête de la vue en cours. */
  if(VUE==='plan'){
    el('kpi1').textContent = couverts;
    el('kpi1l').textContent = t('couverts');
    el('soustitre').textContent = occ + ' ' + (occ>1? t('tables_ouvertes') : t('table_ouverte'));
  }
}

/* ─────────────────────────────────────────────────────────────────
   LA TABLE
   ───────────────────────────────────────────────────────────────── */
function optionsTexte(l){
  var g=[], r=[];
  for(var k in l.mods){ if(l.mods[k]) g.push(l.mods[k]); }
  if(l.verres) g.push(l.verres + ' ' + t('verres'));
  if(l.retraits && l.retraits.length) r.push(t('sans') + ' ' + l.retraits.join(', ').toLowerCase());
  if(l.note) g.push('« '+l.note+' »');
  return {g:g.join(' · '), r:r.join(' · ')};
}
function renderTable(){
  var tb = S.tables[TREF];
  if(!tb){ el('cmdListe').innerHTML=''; return; }
  el('titre').textContent = t('table') + ' ' + tb.ref;
  el('soustitre').textContent = tb.couverts + ' ' + t('couverts') + ' · ' + t('ouverte_a') + ' ' + hhmm(tb.ts)
                              + (tb.par ? ' · ' + t('par') + ' ' + tb.par : '');
  el('kpi1').textContent = tb.couverts;
  el('kpi1l').textContent = t('couverts');

  /* Le service tel que Bastien le veut : chronos, retards, débarrassage.
     Deux chronos — depuis la prise de commande (sur la table), depuis le
     faire marcher (sur chaque service). Au-delà du délai : orange qui
     clignote, en salle comme en cuisine. Le débarrassage se marque ici,
     et ouvre la fenêtre du service suivant. */
  var maintenant = Date.now();
  tb.debar = tb.debar || {};
  if(tb.tsCommande){
    var mnT = Math.floor((maintenant - tb.tsCommande)/60000);
    el('soustitre').textContent += ' · ' + t('commande_dep') + ' ' + mnT + ' min';
  }
  var h='';
  var precDebar = true;   /* le premier service à table n'attend personne */
  ORDRE_SVC.forEach(function(sv){
    var lst = tb.lignes.filter(function(l){ return l.service===sv; });
    if(!lst.length) return;
    var vives = lst.filter(function(l){ return !l.annule; });
    var enAttente = vives.some(function(l){ return l.etat==='attente'; });
    var lance     = vives.some(function(l){ return l.etat==='lance'; });
    var toutParti = vives.length && vives.every(function(l){ return l.etat==='lance'; });
    var mange = sv==='entree' || sv==='plat' || sv==='dessert';
    h += '<div class="svc"><h3>'+esc(NOM_SVC[sv]);
    if(tb.debar[sv]){
      h += '<span class="etat e-debar">'+t('debarrasse')+' '+hhmm(tb.debar[sv])+'</span>';
    } else if(lance){
      var tsl = Math.max.apply(null, vives.filter(function(l){ return l.etat==='lance'; })
                                          .map(function(l){ return l.tsLance||0; }));
      var mn = Math.floor((maintenant - tsl)/60000);
      var seuil = SEUIL_SVC[sv]||10;
      h += '<span class="etat '+(mn>seuil && mange ? 'e-retard':'e-lance')+'">'
         + (mn>seuil && mange ? t('en_retard')+' · ' : t('lance')+' · ') + mn + ' min</span>';
    }
    if(enAttente && !lance) h += '<span class="etat e-attente">'+t('en_attente')+'</span>';
    if(enAttente) h += '<button data-marche="'+sv+'"'
       + (precDebar ? ' class="pulse"' : '') + '>'+t('faire_marcher')+'</button>';
    if(toutParti && mange && !tb.debar[sv])
       h += '<button data-debar="'+sv+'">'+t('debarrasser')+'</button>';
    h += '</h3>';
    if(mange) precDebar = !!tb.debar[sv];
    lst.forEach(function(l){
      var cl = l.annule ? ' annule' : (l.etat==='attente' ? ' att' : '');
      h += '<div class="li'+cl+'">'
         + '<span class="q">'+l.qte+'</span><div class="c"><div class="n">'+esc(l.nom)+'</div>';
      var o = optionsTexte(l);
      if(o.g) h += '<div class="o">'+esc(o.g)+'</div>';
      if(o.r) h += '<div class="o ret">'+esc(o.r)+'</div>';
      if(l.annule) h += '<div class="o gris">'+t('annule')+' · '+esc(l.motif||'')+'</div>';
      else if(l.offert) h += '<div class="o gris">'+t('offert')+' · '+esc(l.motif||'')+'</div>';
      else if(l.etat==='lance') h += '<div class="o gris">'+hhmm(l.tsLance)+'</div>';
      h += '</div><span class="pr'+(l.offert||l.annule?' off':'')+'">'+eur(l.pu*l.qte)+'</span>';
      if(!l.annule) h += '<button class="x" data-lig="'+l.id+'">⋯</button>';
      h += '</div>';
    });
    h += '</div>';
  });
  el('cmdListe').innerHTML = h || '<div class="vide">'+t('rien_commande')+'</div>';

  var nb = vivantes(tb).reduce(function(s,l){ return s+l.qte; },0);
  el('totMt').textContent = eur(totalTable(TREF));
  el('totNb').textContent = nb + ' ' + (nb>1? t('articles') : t('article'));
  var aEnvoyer = tb.lignes.some(function(l){ return !l.annule && l.etat==='saisie'; });
  el('btnEnvoyer').disabled = !aEnvoyer;
  el('btnEnvoyer').style.opacity = aEnvoyer ? 1 : .4;
  el('btnAddition').style.display = vivantes(tb).length ? '' : 'none';
}

var EN_COURS = null;
function ouvrirProduit(pid){
  var p = D.produits.filter(function(x){ return x.id===pid; })[0];
  if(!p) return;
  if(S.rupture[pid]){ feuilleRupture(p); return; }
  var tb = S.tables[TREF];
  EN_COURS = {p:p, qte:1, mods:{}, retraits:[], note:'', verres:0};
  (p.mods||[]).forEach(function(mk){
    var m = D.mods[mk]; if(!m) return;
    if(m.type==='unique'){ var def=(m.opt||[]).filter(function(o){ return o.d; })[0];
                           EN_COURS.mods[mk] = def ? '' : (m.obl ? null : ''); }
    if(m.type==='quantite') EN_COURS.verres = Math.min(tb?tb.couverts:2, m.max||8);
  });
  dessinerFeuille();
  el('sheet').classList.add('on');

function dessinerFeuille(){
  var E = EN_COURS, p = E.p, h='';
  h += '<div class="grab"></div><h2>'+esc(p.nom)+'</h2>';
  h += '<div class="sub">'+(p.desc? esc(p.desc) : (p.dest==='bar'?'Bar':'Cuisine'))+'</div>';
  h += '<div class="lab">'+t('quantite')+'</div><div class="nb">'
     + '<button data-q="-">−</button><b id="qv">'+E.qte+'</b><button data-q="+">+</button></div>';

    h += '<div class="lab">'+t('prix_jour')+'</div>'
       + '<input class="inp" id="prixLibre" type="number" inputmode="decimal" step="0.10" placeholder="0,00">';
  }
  (p.mods||[]).forEach(function(mk){
    var m = D.mods[mk]; if(!m) return;
    if(m.type==='unique'){
      h += '<div class="lab">'+esc(m.titre)+(m.obl?' <span class="oblig">'+t('obligatoire')+'</span>':'')+'</div><div class="opts">';
      (m.opt||[]).forEach(function(o){
        var choisi = (E.mods[mk]||'') === o.l || (E.mods[mk]==null && o.d && !m.obl);
        h += '<button class="opt'+(choisi?' on':'')+'" data-mod="'+esc(mk)+'" data-val="'+esc(o.l)+'">'

      });
      h += '</div>';

      /* data-vq et non data-v : l'ecouteur unique traite data-v comme une
         demande de navigation. Un serveur qui montait le nombre de verres
         d'une bouteille appelait aller('+') et se retrouvait devant un ecran
         blanc, en plein service. Huit produits etaient concernes. */
      h += '<div class="lab">'+esc(m.titre)+'</div><div class="nb">'
         + '<button data-vq="-">−</button><b id="vv">'+E.verres+'</b><button data-vq="+">+</button></div>';

    p.ret.forEach(function(r){
      h += '<button class="opt ret'+(E.retraits.indexOf(r)>=0?' on':'')+'" data-ret="'+esc(r)+'">'+esc(r)+'</button>';
    });
    h += '</div>';
  }
  h += '<div class="lab">'+t('precision')+'</div>'
     + '<input class="inp" id="noteLibre" maxlength="60" placeholder="'+t('facultatif')+'" value="'+esc(E.note)+'">';
  var manque = false;
  (p.mods||[]).forEach(function(mk){ var m=D.mods[mk];
    if(m && m.type==='unique' && m.obl && !E.mods[mk]) manque = true; });
  h += '<button class="go" id="okProd"'+(manque?' disabled':'')+'>'

function feuilleRupture(p){
  el('pan').innerHTML = '<div class="grab"></div><h2>'+esc(p.nom)+'</h2>'
    + '<div class="sub">'+t('rupture')+'</div>'
    + '<button class="go" data-rupt-off="'+esc(p.id)+'">'+t('remettre')+'</button>'
    + '<button class="go sec" id="annProd">'+t('fermer')+'</button>';
  el('sheet').classList.add('on');
}
function validerProduit(){
  var E = EN_COURS, p = E.p, tb = S.tables[TREF];
  if(!tb) return;
  /* Prix du jour : la virgule du clavier espagnol vide un champ number,
     et un prix vide partait à 0,00 € sans que personne ne le voie. */
  var brut = String((el('prixLibre')||{}).value || '').replace(',', '.');
  var pu = p.libre ? cts(brut) : cts(p.prix);
  if(p.libre && !(pu > 0)){ PHXtoast('Prix obligatoire · Precio obligatorio'); return; }
  for(var k in E.mods){
    var m = D.mods[k]; if(!m || !m.opt) continue;
    var o = m.opt.filter(function(x){ return x.l===E.mods[k]; })[0];
    if(o && o.p) pu += cts(o.p);
  }
  tb.lignes.push({
    id:'L'+id(), prod:p.id, nom:p.nom, cat:p.cat, pu:pu, qte:E.qte,
    mods:JSON.parse(JSON.stringify(E.mods)), retraits:E.retraits.slice(),
    note:(el('noteLibre')||{}).value||'', verres:E.verres||0,
    service:(D.serv[p.cat]||'boisson'), dest:p.dest, duo:p.duo?1:0, etat:'saisie',
    ts:Date.now(), par:MOI?MOI.nom:'', annule:false, offert:false, tva:(p.tva||10)
  });
  sauve(); fermerFeuille(); aller('table');
  /* Table déjà commandée : l'ajout part tout seul, le serveur n'a plus à
     repasser par Envoyer. Trois secondes de garde pour qu'une suite
     d'ajouts tienne sur un seul bon en cuisine. */
  if(tb.tsCommande) envoiAuto(TREF);
}
var ENVOI_AUTO = null;
function envoiAuto(ref){
  if(ENVOI_AUTO) clearTimeout(ENVOI_AUTO);
  ENVOI_AUTO = setTimeout(function(){
    ENVOI_AUTO = null;
    if(!S.tables[ref]) return;            /* table fermée entre-temps */
    var avant = TREF;
    TREF = ref;
    try { envoyer(); } catch(e){ }
    TREF = avant;
    if(VUE==='table' && TREF && S.tables[TREF]) renderTable();
    renderPlan();
  }, 3000);
}

/* ─────────────────────────────────────────────────────────────────
   CORRIGER UNE LIGNE — annuler, offrir, changer la quantité.
   Rien ne s'efface : tout se raye et se garde, avec un motif et un nom.
   C'est ce qui permet de répondre à la question « qui a annulé quoi ».
   ───────────────────────────────────────────────────────────────── */
function feuilleLigne(lid){
  var tb = S.tables[TREF]; if(!tb) return;
  var l = tb.lignes.filter(function(x){ return x.id===lid; })[0]; if(!l) return;
  var o = optionsTexte(l);
  var h = '<div class="grab"></div><h2>'+esc(l.nom)+'</h2>'
        + '<div class="sub">'+esc([o.g,o.r].filter(Boolean).join(' · ') || eur(l.pu*l.qte))+'</div>';
  h += '<div class="lab">'+t('quantite')+'</div><div class="nb">'
     + '<button data-lq="-" data-lid="'+l.id+'">−</button><b>'+l.qte+'</b>'
     + '<button data-lq="+" data-lid="'+l.id+'">+</button></div>';

function envoyer(){
  var tb = S.tables[TREF]; if(!tb) return;
  var neuves = tb.lignes.filter(function(l){ return !l.annule && l.etat==='saisie'; });
  if(!neuves.length) return;
  /* le chrono de la table court depuis la première prise de commande */
  tb.tsCommande = tb.tsCommande || Date.now();
  /* Un service déjà lancé sur cette table repart lancé : un dessert
     rappelé à 21 h 40 ne doit pas ressortir marqué ANNONCE, la cuisine
     attendrait un faire marcher qui ne viendra jamais. */
  var dejaLance = {};
  tb.lignes.forEach(function(l){ if(l.etat==='lance') dejaLance[l.service] = 1; });
  var lance = neuves.filter(function(l){ return l.service==='boisson' || l.service==='aperitif' || l.service==='entree' || dejaLance[l.service]; });
  var attend = neuves.filter(function(l){ return lance.indexOf(l)<0; });
  lance.forEach(function(l){ l.etat='lance'; l.tsLance=Date.now(); });
  attend.forEach(function(l){ l.etat='attente'; });
  /* Le bon COMPLET part des l'envoi : la cuisine voit toute la table et
     peut anticiper. Les services non lances sont marques ANNONCE — la
     cuisine sait, mais ne lance pas avant le faire marcher. */
  emettreTickets(tb, neuves, null);
  sauve(); renderTable(); renderPlan(); majBadge();
  PHXtoast(lance.length + ' ' + t('envoye_n') + (attend.length? ', '+attend.length+' '+t('et_attente') : ''));
}

  ['cuisine','bar'].forEach(function(dest){

function lignesPayables(tb){
  return vivantes(tb).filter(function(l){ return !l.offert && !l.paye; });
}
function sousTotal(tb){ return vivantes(tb).reduce(function(s,l){ return s + (l.offert?0:l.pu*l.qte); },0); }
function montantOfferts(tb){ return vivantes(tb).reduce(function(s,l){ return s + (l.offert?l.pu*l.qte:0); },0); }

function montantSel(tb){
  var s=0, toutes=true;
  lignesPayables(tb).forEach(function(l){ if(ADD.sel[l.id]) s += l.pu*l.qte; else toutes=false; });
  if(!s) return 0;
  /* Derniere selection : sur une table remisee, la somme des prorata
     arrondis ne retombe pas juste. Quand la selection couvre tout ce qui
     reste a payer, on sert le solde exact — jamais de centimes orphelins. */
  if(toutes) return resteTable(tb.ref);
  var tot = sousTotal(tb);
  var rem = tb.remise ? Math.round(tb.remise * s / tot) : 0;
  return Math.max(0, s - rem);
}
function montantAPayer(tb){
  var reste = resteTable(tb.ref);
  if(ADD.mode==='sel')  return Math.min(reste, montantSel(tb));
  if(ADD.mode==='part' && ADD.parts>1){
    /* La part se calcule sur le total fige au moment du choix des parts,
       jamais sur le reste : sinon chaque paiement redivise ce qui reste,
       les parts fondent et la table ne se solde jamais.
       Le dernier payeur recoit le solde exact, centimes compris. */
    var base = ADD.base || reste;
    if(ADD.partsPayees >= ADD.parts-1) return reste;
    return Math.min(reste, Math.round(base/ADD.parts));
  }
  return reste;
}

/* ── la table est soldée : on fabrique le ticket et on ferme ────── */
function solde(tb){
  S.numTicket++;
  var lignes = vivantes(tb).map(function(l){
    return { nom:l.nom, qte:l.qte, pu:l.pu, cat:l.cat, tva:l.tva||10, offert:!!l.offert,
             opt:optionsTexte(l) };
  });
  var st = sousTotal(tb), rem = tb.remise||0, tot = st - rem;
  var v = {
    no: 'INT-' + APPAREIL + '-' + S.jour.replace(/-/g,'') + '-' + ('000'+S.numTicket).slice(-3),
    ts: Date.now(), jour:S.jour, table:tb.ref, couverts:tb.couverts,
    serveur: tb.par || (MOI?MOI.nom:''), encaisse: MOI?MOI.nom:'',
    ouvertA: tb.ts, lignes:lignes, brut:st, offerts:montantOfferts(tb),
    remise:rem, remiseMotif:tb.remiseMotif||'', total:tot,
    paiements: tb.paiements||[], tva: ventileTVA(lignes, rem, st)
  };
  S.ventes.push(v);
  S.journal.push({ ts:Date.now(), qui:MOI?MOI.nom:'', type:'vente', table:tb.ref,
                   detail:'ticket '+v.no, montant:tot });
  delete S.tables[tb.ref];
  sauve();
  envoiDiffere({ action:'caisse_vente', vente:v });
  imprimeTicket(v);
  TREF = null;
  PHXtoast(t('table_soldee') + ' · ' + eur(tot));
  aller('plan');
}
/* En hostelería espagnole le service est à 10 %. Le taux est porté par
   le produit pour que la gestora puisse le corriger sans toucher au code. */
function ventileTVA(lignes, remise, brut){
  var par = {};
  lignes.forEach(function(l){
    if(l.offert) return;
    var r = l.tva || 10, ttc = l.pu*l.qte;
    if(remise && brut) ttc -= Math.round(remise*ttc/brut);
    par[r] = (par[r]||0) + ttc;
  });
  var out = {};
  for(var r in par){
    var ttc = par[r], base = Math.round(ttc/(1+(+r)/100));
    out[r] = { ttc:ttc, base:base, taxe:ttc-base };
  }
  return out;
}

function transfere(vers){
  var tb = S.tables[TREF]; if(!tb) return;
  var dst = S.tables[vers];
  if(dst){
    tb.lignes.forEach(function(l){ dst.lignes.push(l); });
    dst.couverts += tb.couverts;
    if(tb.allergie) dst.allergie = (dst.allergie? dst.allergie+' / ':'') + tb.allergie;
    (tb.paiements||[]).forEach(function(p){ (dst.paiements=dst.paiements||[]).push(p); });
    dst.remise = (dst.remise||0) + (tb.remise||0);
    /* le chrono et les services débarrassés suivent la table */
    if(tb.tsCommande) dst.tsCommande = Math.min(dst.tsCommande || tb.tsCommande, tb.tsCommande);
    if(tb.debar){ dst.debar = dst.debar || {};
      for(var sv in tb.debar){ if(!dst.debar[sv]) dst.debar[sv] = tb.debar[sv]; } }
  } else {
    S.tables[vers] = tb; tb.ref = vers;
  }
  /* La table posée doit être plus récente que toute pierre tombale portant
     cette référence : sinon la synchro la voit comme une table soldée qui
     ressuscite, et l'efface partout — lignes et paiements avec elle.
     L'heure d'ouverture réelle est gardée à part pour les chronos. */
  var cible = S.tables[vers];
  cible.tsOuvert = cible.tsOuvert || cible.ts;
  cible.ts = Date.now();
  cible.mod = Date.now();
  delete S.tables[TREF];
  S.journal.push({ ts:Date.now(), qui:MOI?MOI.nom:'', type:'transfert',
                   table:TREF, detail:TREF+' → '+vers, montant:0 });
  TREF = vers; sauve(); fermerFeuille(); renderPlan(); aller('table');
  PHXtoast(t('transferer')+' → '+vers);
}

/* ═════════════════════════════════════════════════════════════════
   LES TICKETS — 42 colonnes, la largeur d'un rouleau de 80 mm.
   ═════════════════════════════════════════════════════════════════ */
function cap(s){ return String(s).charAt(0).toUpperCase() + String(s).slice(1); }
function rep(c,n){ return new Array(Math.max(0,n)+1).join(c); }
function centre(s){ s=String(s); if(s.length>=LARG) return s.slice(0,LARG);
  return rep(' ', Math.floor((LARG-s.length)/2)) + s; }
function lr(g,d){ g=String(g); d=String(d);
  var n = LARG - g.length - d.length;
  if(n < 1){ g = g.slice(0, Math.max(1, LARG - d.length - 1)); n = LARG - g.length - d.length; }
  return g + rep(' ', n) + d; }
function sep(c){ return rep(c||'-', LARG); }
/* Les lignes de suite d'une option gardent le retrait : sans cela
   « Potence rhum — saignant » revient coller a gauche et se lit comme
   un article de plus. */
function coupeInd(txt, ind){
  return coupe(ind + txt, LARG).map(function(x, i){ return i ? ind + x : x; });
}
function coupe(s, l){
  s = String(s); var out=[];
  while(s.length > l){ var i = s.lastIndexOf(' ', l); if(i<10) i=l;
    out.push(s.slice(0,i)); s = s.slice(i).replace(/^ /,''); }
  out.push(s); return out;
}
/* Ni NIF, ni ventilation de TVA, ni numerotation qui ressemble a une serie :
   avec ces trois elements le papier remplissait le contenu de l'article 7.1
   du RD 1619/2012 et devenait une factura simplificada. Tant qu'Agora est la
   caisse declaree, ce document est un justificatif de consommation, et il doit
   le dire en toutes lettres. La ventilation de TVA reste calculee pour le Z et
   pour le classeur : elle ne s'imprime simplement plus pour le client. */
function enteteTicket(){
  return [ ENSEIGNE.nom, ENSEIGNE.adresse, ENSEIGNE.ville, ENSEIGNE.tel ]
         .filter(function(x){ return x && String(x).trim(); })
         .map(centre);
}

function texteCuisine(k){
  var L = [];
  L.push(centre('*** ' + k.copie + ' ***'));
  L.push(sep('='));
  L.push(lr(k.table, hhmm(k.ts)));
  L.push(lr(k.couverts + ' cv', k.serveur || ''));
  if(k.titre){ L.push(sep('-')); L.push(centre('>>> ' + k.titre + ' <<<')); }
  if(k.allergie){ L.push(sep('-')); L.push(centre('!! ALLERGIE !!')); coupe(k.allergie, LARG).forEach(function(x){ L.push(centre(x)); }); }
  L.push(sep('='));
  function uneLigne(l){
    coupe(l.qte + ' x ' + l.nom, LARG).forEach(function(x,i){ L.push(i? '    '+x : x); });
    if(l.opt.g) coupe('   > ' + l.opt.g, LARG).forEach(function(x){ L.push(x); });
    if(l.opt.r) coupe('   ! ' + l.opt.r.toUpperCase(), LARG).forEach(function(x){ L.push(x); });
    L.push('');
  }
  /* Le bon complet est decoupe par service, dans l'ordre du repas.
     Un service annonce mais pas encore lance est marque en toutes
     lettres : la cuisine sait, elle ne lance pas. */
  var groupes = ORDRE_SVC.filter(function(sv){
    return k.lignes.some(function(l){ return l.svc===sv; });
  });
  var horsSvc = k.lignes.filter(function(l){ return ORDRE_SVC.indexOf(l.svc)<0; });
  var enAttente = k.lignes.some(function(l){ return l.att; });
  if(groupes.length > 1 || enAttente){
    groupes.forEach(function(sv){
      var lst = k.lignes.filter(function(l){ return l.svc===sv; });
      var att = lst.every(function(l){ return l.att; });
      L.push(centre('--- ' + NOM_SVC[sv].toUpperCase() + ' ---'));
      if(att) L.push(centre('ANNONCE - NE PAS LANCER'));
      L.push('');
      lst.forEach(uneLigne);
    });
    horsSvc.forEach(uneLigne);
  } else {
    k.lignes.forEach(uneLigne);
  }
  L.push(sep('='));
  return L;
}

/* ═════════════════════════════════════════════════════════════════
   LA CLÔTURE — le Z
   ═════════════════════════════════════════════════════════════════ */
function calculeJour(){
  var z = { nb:0, couverts:0, ca:0, brut:0, remises:0, offerts:0, pourboires:0,
            paiements:{}, serveurs:{}, cats:{}, tva:{}, annulations:0, nbAnnul:0,
            heures:{}, ouvert:S.ouvertA, ticketMoyen:0 };
  S.ventes.forEach(function(v){
    z.nb++; z.couverts += v.couverts; z.ca += v.total; z.brut += v.brut;
    z.remises += v.remise||0; z.offerts += v.offerts||0;
    (v.paiements||[]).forEach(function(p){
      z.paiements[p.mode] = (z.paiements[p.mode]||0) + p.montant;
      z.pourboires += p.pourboire||0;
      var q = p.qui || v.serveur || '—';
      z.serveurs[q] = z.serveurs[q] || {mt:0, nb:0};
      z.serveurs[q].mt += p.montant;
    });
    var sv = v.serveur || '—';
    z.serveurs[sv] = z.serveurs[sv] || {mt:0, nb:0};
    z.serveurs[sv].nb++;
    v.lignes.forEach(function(l){ if(l.offert) return;
      var c = l.cat || '—'; z.cats[c] = (z.cats[c]||0) + l.pu*l.qte; });
    for(var r in (v.tva||{})){
      z.tva[r] = z.tva[r] || {base:0, taxe:0, ttc:0};
      z.tva[r].base += v.tva[r].base; z.tva[r].taxe += v.tva[r].taxe; z.tva[r].ttc += v.tva[r].ttc;
    }
  });
  S.journal.forEach(function(j){ if(j.type==='annulation'){ z.nbAnnul++; z.annulations += j.montant||0; } });
  /* Les heures de présence sortent des pointages : entrée / sortie par personne. */
  var ouvert = {};
  S.pointages.forEach(function(p){
    if(p.sens==='entree'){ ouvert[p.qui] = p.ts; }
    else if(ouvert[p.qui]!=null){
      z.heures[p.qui] = (z.heures[p.qui]||0) + (p.ts - ouvert[p.qui]); delete ouvert[p.qui];
    }
  });
  for(var q in ouvert) z.heures[q] = (z.heures[q]||0) + (Date.now() - ouvert[q]);
  z.ticketMoyen = z.nb ? Math.round(z.ca/z.nb) : 0;
  return z;
}

  var m = Math.round(ms/60000); return Math.floor(m/60)+' h '+('0'+(m%60)).slice(-2);
}

/* La clôture efface la journée sur l'appareil : elle ne part donc pas
   sans avoir été acceptée par le serveur. Hors ligne, on refuse — un Z
   perdu, c'est une journée de caisse perdue. */
function faitZ(){
  var compte = CAISSE_SAISIE ? Math.round(parseFloat(CAISSE_SAISIE.replace(',','.'))*100) : 0;
  var code = (el('zAdmin')||{}).value || '';
  if(code.length < 4){ PHXtoast(t('mauvais_code')); return; }
  var z = calculeJour();
  var no = (parseInt(localStorage.getItem('phx_z_no')||'0',10) + 1);
  var lignes = texteZ(z, no, compte);
  function conclut(){
    localStorage.setItem('phx_z_no', String(no));
    /* Copie locale avant la remise a zero : la cloture efface la journee, et
       le journal est la seule trace des deplacements, annulations et remises. */
    try{ localStorage.setItem('phx_z_'+S.jour, JSON.stringify({no:no, z:z, compte:compte,
         journal:S.journal, ventes:S.ventes, texte:lignes.join('\n')})); }catch(e){}
    imprime(lignes);
    var fond = S.fond;
    S = etatNeuf(); S.fond = fond; sauve();
    syncRaz();   /* la journée commune repart de zéro pour tous les appareils */
    fermerFeuille();
    PHXtoast(t('z_fait') + ' · Z' + no);
    aller('plan');
  }
  if(!API || API.indexOf('http')!==0){ conclut(); return; }
  if(!navigator.onLine){ PHXtoast(t('hors_ligne')); return; }
  var bt = el('okZ'); if(bt){ bt.disabled = true; bt.textContent = '…'; }
  fetch(API, {method:'POST', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'caisse_z', code:code, jour:S.jour, no:no,
                           z:z, compte:compte, ventes:S.ventes, journal:S.journal,
                           appareil:APPAREIL, texte:lignes.join('\n') })})
   .then(function(r){ return r.json(); })
   .then(function(j){
     if(j && j.ok) conclut();
     else { PHXtoast(t('mauvais_code'));
            if(bt){ bt.disabled=false; bt.textContent=t('faire_z'); } } })
   .catch(function(){ PHXtoast(t('hors_ligne'));
     if(bt){ bt.disabled=false; bt.textContent=t('faire_z'); } });
}

/* ═════════════════════════════════════════════════════════════════
   IMPRESSION
   Une page servie en HTTPS ne peut pas parler à une imprimante du
   réseau local en HTTP : le navigateur refuse le mélange. Tant que
   l'application vient de GitHub, on passe donc par la boîte
   d'impression du navigateur. Si un jour elle est servie depuis le
   PC de la caisse (en http://), le relais prend le relais tout seul.
   ═════════════════════════════════════════════════════════════════ */
var RELAIS = localStorage.getItem('phx_relais') || '';
/* Servie par Phoenix Relais (le PC du bar), la caisse trouve le relais
   toute seule : même adresse, chemin /imprime. Rien à configurer. */
if(!RELAIS && location.protocol === 'http:') RELAIS = location.origin + '/imprime';
var AUTO = localStorage.getItem('phx_imp_auto') === '1';
function relaisPossible(){ return RELAIS && location.protocol === 'http:'; }
function imprime(lignes, dest){
  if(relaisPossible()){
    fetch(RELAIS, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ dest:dest||'caisse', texte:lignes.join('\n') })})
     .then(function(r){ if(!r.ok) imprimeNavigateur(lignes); })
     .catch(function(){ imprimeNavigateur(lignes); });
    return;
  }
  imprimeNavigateur(lignes);
}
/* Les balises de fermeture sont coupées en deux morceaux à dessein : le
   script qui injecte le bloc d'attente cherche la première balise de
   fermeture du corps de page, et il l'avait trouvée ici, au milieu de cette
   chaîne — ce qui a mis l'application en ligne par terre le 31 juillet.
   Ne pas les recoller, et ne pas écrire cette balise en toutes lettres. */
function imprimeNavigateur(lignes){
  if(window.__phxSansImpression){ (window.__impressions=window.__impressions||[]).push(lignes.join('\n')); return; }
  /* Les marques de grossissement sont pour l'imprimante ; ici on les retire. */
  lignes = lignes.map(function(x){ return String(x).replace(/^[]/, ''); });
  /* Sept lignes vides pour degager la derniere ligne du bord dentele :
     sans elles, le texte du bas se coupe au moment de dechirer. */
  lignes = lignes.concat(['','','','','','','']);
  var f = el('pr');
  var doc = f.contentDocument || f.contentWindow.document;
  doc.open();
  doc.write('<!doctype html><meta charset="utf-8"><style>'
    + '@page{size:80mm auto;margin:3mm}'
    + 'body{margin:0;font-family:"JetBrains Mono",ui-monospace,monospace;'
    + 'font-size:11.5px;line-height:1.32;color:#000;white-space:pre}'
    + '</st'+'yle><bo'+'dy>' + lignes.map(function(x){ return esc(x); }).join('\n'));
  doc.close();
  setTimeout(function(){ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} }, 120);
}
function imprimeTicketCuisine(k){ if(AUTO || relaisPossible()) imprime(texteCuisine(k), k.dest); }
function imprimeTicket(v){ imprime(texteTicket(v), 'caisse'); }

function aller(v){
  VUE = v;
  ['Plan','Table','Carte','Add','Ecran','Jour'].forEach(function(n){
    el('v'+n).classList.toggle('on', n.toLowerCase()===v);
  });
  el('btnBack').style.display = (v==='plan'||v==='ecran'||v==='jour') ? 'none' : '';
  el('barBas').classList.toggle('on', v==='table');
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.v===v
      || (b.dataset.v==='plan' && (v==='table'||v==='carte'||v==='add')));
  });
  if(v==='plan'){ el('titre').textContent=t('plan'); renderPlan(); }
  if(v==='table') renderTable();
  if(v==='carte'){ el('titre').textContent=t('carte');
                   el('soustitre').textContent=t('table')+' '+TREF; renderCarte(); }
  if(v==='add') renderAdd();
  if(v==='ecran'){ el('titre').textContent=t('ecrans'); el('soustitre').textContent='Cuisine & bar';
                   el('kpi1').textContent=S.tickets.filter(function(k){return !k.fait;}).length;
                   el('kpi1l').textContent=t('tickets'); renderEcran(); }
  if(v==='jour') renderJour();
  document.querySelector('main').scrollTop = 0;
}

function PHXtoast(msg){
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;left:50%;bottom:calc(132px + var(--safe));transform:translateX(-50%);'
    + 'background:#17394E;border:1px solid rgba(185,141,85,.4);color:#F6F0E4;padding:10px 16px;'
    + 'border-radius:999px;font-size:13px;z-index:950;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:88vw;text-align:center';

                         setTimeout(function(){ d.remove(); }, 320); }, 1700);
}

/* ═════════════════════════════════════════════════════════════════
   UN SEUL ÉCOUTEUR
   ═════════════════════════════════════════════════════════════════ */
document.addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if(!b) return;

  /* — connexion — */
  if(b.dataset.qui){ b.blur(); LG_SEL = b.dataset.qui; LG_CODE=''; rendLogin(); return; }
  if(b.dataset.lg){ LG = b.dataset.lg; appliqueLangue(); rendLogin();
    if(MOI){ fermerFeuille(); aller(VUE); } return; }
  if(b.dataset.num){
    /* blur() : sans lui le bouton garde le focus, et la touche Entree du
       clavier rejoue ce bouton — le code se corrompait a chaque validation. */
    b.blur();
    var n = b.dataset.num;
    if(n==='C'){ LG_CODE = LG_CODE.slice(0,-1); }   /* le glyphe promet un retour arriere */
    else if(n==='ok'){ tenteConnexion(); return; }
    else if(LG_CODE.length<LG_LONG){ LG_CODE += n; }
    majEcranCode();
    if(LG_CODE.length>=4 && LG_SEL) el('lgMsg').textContent='';
    return;
  }
  if(b.id==='btnMoi'){ feuilleMoi(); return; }
  if(b.id==='btnFin'){ deconnexion(); return; }

  /* — navigation — */
  if(b.dataset.v && ['plan','table','carte','add','ecran','jour'].indexOf(b.dataset.v)>=0){
    aller(b.dataset.v); return; }
  if(b===el('btnBack')){ aller(VUE==='carte'?'table':(VUE==='add'?'table':'plan')); return; }

  /* — écrans — */
  if(b.dataset.d){ ECRAN=b.dataset.d;
    document.querySelectorAll('#segEcran button').forEach(function(x){ x.classList.toggle('on', x===b); });
    renderEcran(); return; }
  if(b.dataset.fait){ S.tickets.forEach(function(k){ if(k.id===b.dataset.fait) k.fait=true; });
    sauve(); renderEcran(); majBadge(); return; }
  if(b.dataset.impk){ var kk = S.tickets.filter(function(k){ return k.id===b.dataset.impk; })[0];
    if(kk) imprime(texteCuisine(kk), kk.dest); return; }

  /* — salle — */
  if(b.dataset.ref){
    var ref=b.dataset.ref;
    if(S.tables[ref]){ TREF=ref; aller('table'); }
    else{ var tb = D.plan.tables.filter(function(x){ return x.ref===ref; })[0];
          feuilleOuverture(ref, tb?tb.places:2); }
    return;
  }
  if(b.dataset.c){ var e=el('cv'); e.textContent = Math.max(1, Math.min(30, +e.textContent+(b.dataset.c==='+'?1:-1))); return; }
  if(b.id==='okTable'){
    var r=el('pan').dataset.ref;
    S.tables[r]={ ref:r, couverts:+el('cv').textContent, allergie:el('alg').value.trim(),
                  lignes:[], paiements:[], remise:0, ts:Date.now(), par:MOI?MOI.nom:'' };
    TREF=r; sauve(); fermerFeuille(); aller('table'); renderPlan(); return; }
  if(b.id==='annTable' || b.id==='annProd'){ fermerFeuille(); return; }

  /* — commande — */
  if(b.id==='btnAjouter'){ RECH=''; el('rech').value=''; aller('carte'); return; }
  if(b.id==='btnEnvoyer'){ envoyer(); return; }
  if(b.id==='btnAddition'){ ADD={mode:'tout', sel:{}, parts:0, base:0, partsPayees:0}; aller('add'); return; }
  if(b.dataset.cat){ CAT=b.dataset.cat; renderCarte(); return; }
  if(b.dataset.prod){ ouvrirProduit(b.dataset.prod); return; }
  if(b.dataset.marche){ faireMarcher(b.dataset.marche); return; }
  if(b.dataset.debar){ marquerDebar(b.dataset.debar); return; }
  if(b.dataset.lig){ feuilleLigne(b.dataset.lig); return; }
  if(b.dataset.rupt){ S.rupture[b.dataset.rupt]=1; sauve(); fermerFeuille(); renderCarte();
    S.journal.push({ts:Date.now(), qui:MOI?MOI.nom:'', type:'86', detail:b.dataset.rupt, montant:0}); return; }
  if(b.dataset.ruptOff){ delete S.rupture[b.dataset.ruptOff]; sauve(); fermerFeuille(); renderCarte(); return; }
  if(b.dataset.motif){ MOTIF = b.dataset.motif;
    b.parentNode.querySelectorAll('.opt').forEach(function(x){ x.classList.toggle('on', x===b); });
    return; }
  if(b.dataset.sup){ annuleLigne(b.dataset.sup); return; }
  if(b.dataset.offre){ offreLigne(b.dataset.offre); return; }
  if(b.dataset.lq){
    var tb2=S.tables[TREF], l2=tb2.lignes.filter(function(x){ return x.id===b.dataset.lid; })[0];
    if(l2){ l2.qte = Math.max(1, Math.min(30, l2.qte + (b.dataset.lq==='+'?1:-1))); sauve();
            feuilleLigne(l2.id); renderTable(); }
    return; }

  /* — feuille produit — */
  if(b.dataset.q){ EN_COURS.qte = Math.max(1, Math.min(30, EN_COURS.qte + (b.dataset.q==='+'?1:-1)));
    EN_COURS.note = (el('noteLibre')||{}).value||''; dessinerFeuille(); return; }
  if(b.dataset.vq){ EN_COURS.verres = Math.max(1, Math.min(12,
      EN_COURS.verres + (b.dataset.vq==='+'?1:-1))); dessinerFeuille(); return; }
  if(b.dataset.mod){ EN_COURS.mods[b.dataset.mod] = b.dataset.val;
    EN_COURS.note=(el('noteLibre')||{}).value||''; dessinerFeuille(); return; }
  if(b.dataset.ret){ var rr=b.dataset.ret, ii=EN_COURS.retraits.indexOf(rr);
    if(ii>=0) EN_COURS.retraits.splice(ii,1); else EN_COURS.retraits.push(rr);
    EN_COURS.note=(el('noteLibre')||{}).value||''; dessinerFeuille(); return; }
  if(b.id==='okProd'){ validerProduit(); return; }

  /* — addition — */
  if(b.dataset.am){ ADD.mode=b.dataset.am; ADD.sel={}; ADD.parts=0; ADD.base=0; ADD.partsPayees=0; renderAdd(); return; }
  if(b.dataset.parts){ ADD.parts=+b.dataset.parts; ADD.base=resteTable(TREF); ADD.partsPayees=0; renderAdd(); return; }
  if(b.dataset.sel){ ADD.sel[b.dataset.sel] = !ADD.sel[b.dataset.sel]; renderAdd(); return; }
  if(b.dataset.paie){
    var mt = montantAPayer(S.tables[TREF]);
    if(!mt) return;
    if(b.dataset.paie==='especes') feuilleEspeces(mt); else { POURBOIRE=0; feuilleCarte(mt); }
    return; }
  if(b.dataset.cn){
    var c=b.dataset.cn;
    if(c==='C') CAISSE_SAISIE = CAISSE_SAISIE.slice(0,-1);
    else if(c===',' ){ if(CAISSE_SAISIE.indexOf(',')<0 && CAISSE_SAISIE) CAISSE_SAISIE += ','; }
    else { var d2 = CAISSE_SAISIE.split(','); if(d2[1] && d2[1].length>=2) return; CAISSE_SAISIE += c; }
    if(el('okZ')) dessineZ(); else dessineEspeces(MT_COURANT);
    return; }
  if(b.dataset.esp){ CAISSE_SAISIE = b.dataset.esp.replace('.',',');
    dessineEspeces(MT_COURANT); return; }
  if(b.dataset.okesp){
    var mtE = +b.dataset.okesp;
    var recu = Math.round(parseFloat(CAISSE_SAISIE.replace(',','.'))*100);
    encaisse('especes', mtE, recu); return; }
  if(b.dataset.pb!=null && b.dataset.pb!==''){ POURBOIRE = +b.dataset.pb;
    b.parentNode.querySelectorAll('.opt').forEach(function(x){ x.classList.toggle('on', x===b); }); return; }
  if(b.dataset.okcar){ encaisse('carte', +b.dataset.okcar); return; }
  if(b.id==='impNote'){ imprime(texteNote(S.tables[TREF]), 'caisse');
    S.tables[TREF].addDemandee = true; sauve(); renderPlan(); return; }
  if(b.id==='mRemise'){ feuilleRemise(); return; }
  if(b.dataset.rem!=null){
    var tbr = S.tables[TREF];
    tbr.remise = +b.dataset.rem;
    tbr.remiseMotif = motifChoisi();
    if(tbr.remise) S.journal.push({ ts:Date.now(), qui:MOI?MOI.nom:'', type:'remise',
      table:tbr.ref, detail:tbr.remiseMotif, montant:tbr.remise });
    MOTIF=''; sauve(); fermerFeuille(); renderAdd(); return; }
  if(b.id==='mTransf'){ feuilleTransfert(); return; }
  if(b.dataset.transf){ transfere(b.dataset.transf); return; }
  if(b.id==='mTiroir'){ S.journal.push({ts:Date.now(), qui:MOI?MOI.nom:'', type:'tiroir', detail:'', montant:0});
    sauve(); imprime([' ', ' '], 'caisse'); PHXtoast(t('ouvrir_tiroir')); return; }

  /* — journée — */
  if(b.id==='impX'){ imprime(texteZ(calculeJour(), 'X', 0), 'caisse'); return; }
  if(b.id==='btnZ'){ feuilleZ(); return; }
  if(b.id==='okZ'){ faitZ(); return; }
});
/* Le patron travaille sur un PC avec un vrai clavier : son premier geste est
   de taper le code au clavier. Il ne se passait rien du tout — aucun ecouteur
   de touche n'existait. C'est ce qu'il appelait « le clavier est bugue ». */
document.addEventListener('keydown', function(ev){
  if(!el('vLogin').classList.contains('on')) return;
  if(ev.ctrlKey || ev.altKey || ev.metaKey) return;
  var k = ev.key;
  if(k>='0' && k<='9'){ ev.preventDefault();
    if(LG_CODE.length<LG_LONG) LG_CODE += k;
    majEcranCode();
    if(LG_CODE.length>=LG_LONG && LG_SEL) el('lgMsg').textContent='';
    return; }
  if(k==='Enter'){ ev.preventDefault(); tenteConnexion(); return; }
  if(k==='Backspace'){ ev.preventDefault(); LG_CODE = LG_CODE.slice(0,-1); majEcranCode(); return; }
  if(k==='Escape'){ ev.preventDefault(); LG_CODE=''; majEcranCode(); return; }
});
el('sheet').addEventListener('click', function(ev){ if(ev.target===this) fermerFeuille(); });
el('rech').addEventListener('input', function(){ RECH = this.value.trim(); renderCarte(); });

setInterval(function(){ if(VUE==='plan') renderPlan(); }, 60000);

setInterval(function(){
  if(VUE==='table' && TREF && S.tables[TREF]) renderTable();

}, 30000);
