<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1E2C">

<title>Caisse — Brasserie Phoenix</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#16364A; --deep:#0B1E2C; --card:#17394E; --card2:rgba(27,63,85,.55);
 --copper:#B98D55; --gold:#D4A843; --cream:#F6F0E4;
 --ink:var(--cream); --ink2:rgba(246,240,228,.62); --ink3:rgba(246,240,228,.38);
 --ok:#7FA37A; --warn:#D4A843; --alert:#C4633F;
 --hair:rgba(185,141,85,.28); --hair2:rgba(185,141,85,.14);
 --serif:'Cormorant Garamond',Georgia,serif;
 --sans:'Jost',system-ui,-apple-system,sans-serif;
 --mono:'JetBrains Mono',ui-monospace,monospace;
 --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--deep);color:var(--ink);font-family:var(--sans);font-size:16px;
 -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}

header{flex:none;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
 border-bottom:1px solid var(--hair2);display:flex;align-items:center;gap:12px;background:var(--deep)}
header .t{flex:1;min-width:0}
header h1{font-family:var(--serif);font-weight:400;font-size:21px;margin:0;line-height:1.15;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--copper);margin-top:2px}
.pill{flex:none;display:flex;align-items:baseline;gap:5px;padding:5px 11px;border-radius:999px;
 border:1px solid var(--hair);background:rgba(185,141,85,.08)}
.pill b{font-family:var(--serif);font-size:19px;color:var(--gold);line-height:1}
.pill span{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.back{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--hair);
 display:grid;place-items:center;font-size:19px;color:var(--copper)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 96px}
.vue{display:none}.vue.on{display:block}

/* ── plan de salle ─────────────────────────────────────────────── */
.zone{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--copper);margin:16px 0 9px}
.zone:first-child{margin-top:0}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:9px}
.tb{aspect-ratio:1;border:1px solid var(--hair);border-radius:13px;background:var(--card2);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
 transition:transform .1s,border-color .15s,background .15s}
.tb:active{transform:scale(.95)}
.tb .r{font-family:var(--mono);font-size:14px;font-weight:600}
.tb .p{font-family:var(--mono);font-size:9px;color:var(--ink3)}
.tb .m{font-size:10.5px;color:var(--ink2);margin-top:1px}
.tb.occ{border-color:var(--gold);background:rgba(212,168,67,.13)}
.tb.att{border-color:var(--alert);background:rgba(196,99,63,.15)}
.tb.enc{border-color:var(--ok);background:rgba(127,163,122,.15)}
.tb.oub{animation:oub 1.6s ease-in-out infinite}
@keyframes oub{0%,100%{box-shadow:0 0 0 0 rgba(196,99,63,0)}50%{box-shadow:0 0 0 4px rgba(196,99,63,.30)}}

/* ── commande ──────────────────────────────────────────────────── */
.svc{margin-bottom:16px}
.svc h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--copper);margin:0 0 8px;display:flex;align-items:center;gap:9px}
.svc h3 .etat{font-size:9px;letter-spacing:.08em;padding:2px 7px;border-radius:999px;border:1px solid}
.e-attente{color:var(--alert);border-color:rgba(196,99,63,.5)}
.e-lance{color:var(--ok);border-color:rgba(127,163,122,.5)}
.svc h3 button{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
 color:var(--deep);background:var(--gold);padding:5px 11px;border-radius:999px;font-weight:600}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border:1px solid var(--hair2);
 border-radius:12px;margin-bottom:7px;background:rgba(255,255,255,.02)}
.li .q{font-family:var(--mono);font-size:15px;color:var(--gold);min-width:22px}
.li .c{flex:1;min-width:0}
.li .n{font-size:14.5px;line-height:1.25}
.li .o{font-size:11.5px;color:var(--gold);margin-top:3px;line-height:1.35}
.li .o.ret{color:var(--alert)}
.li .pr{font-family:var(--mono);font-size:13px;color:var(--ink2)}
.li.att{opacity:.62}
.li .x{flex:none;color:var(--ink3);font-size:17px;padding:0 2px}
.vide{text-align:center;color:var(--ink3);font-size:13.5px;padding:26px 0}

/* ── carte ─────────────────────────────────────────────────────── */
.cats{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;margin:0 -14px;padding-left:14px;
 padding-right:14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--hair);
 font-size:13px;color:var(--ink2);white-space:nowrap}
.cat.on{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:500}
.pr-li{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--hair2);
 border-radius:12px;margin-bottom:7px;background:rgba(255,255,255,.02)}
.pr-li:active{background:rgba(185,141,85,.10)}
.pr-li .c{flex:1;min-width:0}
.pr-li .n{font-size:15px;line-height:1.25}
.pr-li .d{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.3;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr-li .p{font-family:var(--mono);font-size:14px;color:var(--gold);flex:none}
.coeur{color:var(--gold);font-size:11px}

/* ── feuille modale ────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;z-index:900;display:none;background:rgba(11,26,36,.72);
 -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet.on{display:block}
.sheet .pan{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
 background:var(--card);border-top:1px solid var(--hair);border-radius:20px 20px 0 0;
 padding:14px 16px calc(18px + var(--safe));animation:up .2s cubic-bezier(.22,.9,.3,1) both}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto 13px}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 2px}
.sheet .sub{font-size:12px;color:var(--ink3);margin-bottom:14px}
.lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--copper);margin:15px 0 8px}
.lab .oblig{color:var(--alert);letter-spacing:0}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:9px 14px;border-radius:999px;border:1px solid var(--hair);font-size:13.5px;color:var(--ink2)}
.opt.on{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:500}
.opt.ret.on{background:var(--alert);border-color:var(--alert);color:#fff}
.nb{display:flex;align-items:center;gap:14px}
.nb button{width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);font-size:20px;
 display:grid;place-items:center;color:var(--gold)}
.nb b{font-family:var(--serif);font-size:26px;min-width:34px;text-align:center}
.inp{width:100%;padding:12px;border-radius:11px;border:1px solid var(--hair);
 background:rgba(0,0,0,.2);color:var(--cream);font-family:inherit;font-size:15px}
.go{width:100%;margin-top:18px;padding:15px;border-radius:14px;background:var(--gold);
 color:var(--deep);font-weight:600;font-size:16px}
.go:disabled{opacity:.4}
.go.sec{background:transparent;border:1px solid var(--hair);color:var(--ink2);margin-top:9px}

/* ── barre du bas ──────────────────────────────────────────────── */
.bar{position:fixed;left:0;right:0;bottom:calc(53px + var(--safe));z-index:500;display:none;gap:9px;
 padding:11px 14px;background:linear-gradient(to top,var(--deep) 78%,rgba(11,30,44,0));align-items:center}
.bar.on{display:flex}
.bar .tot{flex:1;min-width:0}
.bar .tot b{font-family:var(--serif);font-size:23px;color:var(--gold);display:block;line-height:1.05}
.bar .tot span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.bar button{flex:none;padding:13px 17px;border-radius:13px;font-weight:600;font-size:14.5px}
.bar .env{background:var(--gold);color:var(--deep)}
.bar .add{border:1px solid var(--hair);color:var(--gold)}

/* ── écrans cuisine / bar ──────────────────────────────────────── */
.tk{border:1px solid var(--hair);border-radius:14px;padding:13px;margin-bottom:11px;background:var(--card2)}
.tk.marche{border-color:var(--gold);background:rgba(212,168,67,.12)}
.tk .h{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;padding-bottom:9px;
 border-bottom:1px dashed var(--hair)}
.tk .h b{font-family:var(--serif);font-size:27px;color:var(--gold);line-height:1}
.tk .h .m{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.tk .h .cp{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
 padding:3px 8px;border-radius:999px;border:1px solid var(--hair);color:var(--copper)}
.tk .l{display:flex;gap:9px;padding:4px 0;font-size:14.5px}
.tk .l .q{font-family:var(--mono);color:var(--gold);min-width:20px}
.tk .l em{display:block;font-style:normal;font-weight:600;font-size:12.5px;color:var(--gold);margin-top:1px}
.tk .l em.ret{color:var(--alert)}
.tk .alg{margin:-4px 0 9px;padding:6px 9px;border-radius:8px;background:rgba(196,99,63,.2);
 border:1px solid rgba(196,99,63,.5);font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#F0B8A0}
.tk .fait{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--hair);
 color:var(--ok);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.seg{display:flex;gap:7px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:11px;border:1px solid var(--hair);font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:500}

nav{flex:none;display:flex;border-top:1px solid var(--hair2);background:var(--deep);
 padding-bottom:var(--safe)}
nav button{flex:1;padding:11px 4px 9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
 text-transform:uppercase;color:var(--ink3)}
nav button.on{color:var(--gold)}
nav button i{display:block;font-style:normal;font-size:17px;margin-bottom:3px}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:9px;background:var(--alert);
 color:#fff;font-size:9px;line-height:16px;margin-left:3px;vertical-align:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

<main>

<div class="sheet" id="sheet"><div class="pan" id="pan"></div></div>

var el = function (i) { return document.getElementById(i); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function eur(n){ return n.toFixed(2).replace('.', ',') + ' €'; }
function hhmm(t){ var d=new Date(t); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

var TABLES = {}, TICKETS = [], VUE = 'plan', TREF = null, CAT = D.ordre[0], SEQ = 0;
var SERVEUR = 'Service';
var ORDRE_SVC = ['aperitif','entree','plat','dessert','boisson'];
var NOM_SVC = {aperitif:'Apéritif', entree:'Entrées', plat:'Plats', dessert:'Desserts', boisson:'Boissons'};

/* ── la salle, reprise du plan à l'échelle ───────────────────────── */
var ZONES = [
  {k:'terraza', t:'Terraza — notre salle'},
  {k:'passage', t:'Tables hautes'},
  {k:'mer',     t:'Front de mer'}
];
function tablesDe(z){
  return D.plan.tables.filter(function(t){ return t.zone===z && t.places>0; });
}
function etatTable(ref){
  var t = TABLES[ref];
  if(!t) return '';
  var att=0, saisie=0, vieux=0, now=Date.now();
  for(var i=0;i<t.lignes.length;i++){
    var l=t.lignes[i];
    if(l.etat==='attente') att++;
    if(l.etat==='saisie') saisie++;
    if(l.etat==='lance' && now-l.tsLance > 25*60*1000) vieux++;
  }
  if(vieux) return 'oub';
  if(att||saisie) return 'att';
  return 'occ';
}
function renderPlan(){
  var h='', couverts=0, occ=0;
  ZONES.forEach(function(z){
    var lst = tablesDe(z.k);
    if(!lst.length) return;
    h += '<div class="zone">'+esc(z.t)+'</div><div class="grille">';
    lst.forEach(function(tb){
      var t = TABLES[tb.ref];
      if(t){ couverts += t.couverts; occ++; }
      var cl = t ? etatTable(tb.ref) : '';
      h += '<button class="tb '+cl+'" data-ref="'+esc(tb.ref)+'">'
         +   '<span class="r">'+esc(tb.ref)+'</span>'
         +   '<span class="p">'+(t? t.couverts+' cv' : tb.places+' pl.')+'</span>'
         +   (t ? '<span class="m">'+eur(totalTable(tb.ref))+'</span>' : '')
         + '</button>';
    });
    h += '</div>';
  });
  el('vPlan').innerHTML = h;
  el('kpi1').textContent = couverts;
  el('kpi1l').textContent = 'couverts';
  el('soustitre').textContent = occ + (occ>1?' tables ouvertes':' table ouverte');
}

/* ── la commande ─────────────────────────────────────────────────── */
function totalTable(ref){
  var t=TABLES[ref]; if(!t) return 0;
  return t.lignes.reduce(function(s,l){ return s + l.pu*l.qte; }, 0);
}
function serviceDe(p){ return D.serv[p.cat] || 'boisson'; }

function renderTable(){
  var t = TABLES[TREF];
  if(!t){ el('cmdListe').innerHTML=''; return; }
  el('titre').textContent = 'Table ' + t.ref;
  el('soustitre').textContent = t.couverts + ' couverts · ouverte à ' + hhmm(t.ts);
  el('kpi1').textContent = t.couverts;
  el('kpi1l').textContent = 'couverts';

  var h='';
  ORDRE_SVC.forEach(function(sv){
    var lst = t.lignes.filter(function(l){ return l.service===sv; });
    if(!lst.length) return;
    var enAttente = lst.some(function(l){ return l.etat==='attente'; });
    var lance     = lst.some(function(l){ return l.etat==='lance'; });
    h += '<div class="svc"><h3>'+NOM_SVC[sv];
    if(enAttente) h += '<span class="etat e-attente">en attente</span>';
    else if(lance) h += '<span class="etat e-lance">lancé</span>';
    if(enAttente) h += '<button data-marche="'+sv+'">Faire marcher</button>';
    h += '</h3>';
    lst.forEach(function(l){
      h += '<div class="li'+(l.etat==='attente'?' att':'')+'">'
         + '<span class="q">'+l.qte+'</span><div class="c"><div class="n">'+esc(l.nom)+'</div>';
      var o = optionsTexte(l);
      if(o.g) h += '<div class="o">'+esc(o.g)+'</div>';
      if(o.r) h += '<div class="o ret">'+esc(o.r)+'</div>';
      h += '</div><span class="pr">'+eur(l.pu*l.qte)+'</span>';
      if(l.etat==='saisie') h += '<button class="x" data-sup="'+l.id+'">×</button>';
      h += '</div>';
    });
    h += '</div>';
  });
  el('cmdListe').innerHTML = h || '<div class="vide">Rien de commandé pour l\'instant.</div>';

  var nb = t.lignes.reduce(function(s,l){ return s+l.qte; },0);
  el('totMt').textContent = eur(totalTable(TREF));
  el('totNb').textContent = nb + (nb>1?' articles':' article');
  var aEnvoyer = t.lignes.some(function(l){ return l.etat==='saisie'; });
  el('btnEnvoyer').disabled = !aEnvoyer;
  el('btnEnvoyer').style.opacity = aEnvoyer ? 1 : .4;
}
function optionsTexte(l){
  var g=[], r=[];
  for(var k in l.mods){ if(l.mods[k]) g.push(l.mods[k]); }
  if(l.verres) g.push(l.verres + ' verres');
  if(l.retraits && l.retraits.length) r.push('sans ' + l.retraits.join(', ').toLowerCase());
  if(l.note) g.push('« '+l.note+' »');
  return {g:g.join(' · '), r:r.join(' · ')};
}

/* ── la carte ────────────────────────────────────────────────────── */
function renderCarte(){
  var h='';
  D.ordre.forEach(function(c){
    h += '<button class="cat'+(c===CAT?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';
  });
  el('cats').innerHTML = h;
  var lst = D.produits.filter(function(p){ return p.cat===CAT; });
  el('prodListe').innerHTML = lst.map(function(p){
    return '<button class="pr-li" data-prod="'+esc(p.id)+'"><div class="c">'
      + '<div class="n">'+(p.coeur?'<span class="coeur">◆</span> ':'')+esc(p.nom)+'</div>'
      + (p.desc? '<div class="d">'+esc(p.desc)+'</div>':'')
      + '</div><span class="p">'+(p.libre? 'du jour' : eur(p.prix))+'</span></button>';
  }).join('');
}

/* ── la feuille d'options ────────────────────────────────────────── */
var EN_COURS = null;
function ouvrirProduit(id){
  var p = D.produits.filter(function(x){ return x.id===id; })[0];
  if(!p) return;
  var t = TABLES[TREF];
  EN_COURS = {p:p, qte:1, mods:{}, retraits:[], note:'', verres:0,
              pu:p.prix, libre:p.libre?0:null};
  (p.mods||[]).forEach(function(mk){
    var m = D.mods[mk];
    if(!m) return;
    if(m.type==='unique'){
      var def = (m.opt||[]).filter(function(o){ return o.d; })[0];
      EN_COURS.mods[mk] = def ? '' : (m.obl ? null : '');
    }
    if(m.type==='quantite') EN_COURS.verres = Math.min(t?t.couverts:2, m.max||8);
  });
  dessinerFeuille();
  el('sheet').classList.add('on');
}
function dessinerFeuille(){
  var E = EN_COURS, p = E.p, h='';
  h += '<div class="grab"></div><h2>'+esc(p.nom)+'</h2>';
  h += '<div class="sub">'+(p.desc? esc(p.desc) : (p.dest==='bar'?'Bar':'Cuisine'))+'</div>';

  h += '<div class="lab">Quantité</div><div class="nb">'
     + '<button data-q="-">−</button><b id="qv">'+E.qte+'</b><button data-q="+">+</button></div>';

  if(p.libre){
    h += '<div class="lab">Prix du jour</div>'
       + '<input class="inp" id="prixLibre" type="number" inputmode="decimal" step="0.10" placeholder="0,00">';
  }

  (p.mods||[]).forEach(function(mk){
    var m = D.mods[mk]; if(!m) return;
    if(m.type==='unique'){
      h += '<div class="lab">'+esc(m.titre)+(m.obl?' <span class="oblig">— obligatoire</span>':'')+'</div><div class="opts">';
      (m.opt||[]).forEach(function(o){
        var choisi = (E.mods[mk]||'') === o.l || (E.mods[mk]==null && o.d && !m.obl);
        h += '<button class="opt'+(choisi?' on':'')+'" data-mod="'+esc(mk)+'" data-val="'+esc(o.l)+'">'
           + esc(o.l) + (o.p? ' +'+eur(o.p) : '') + '</button>';
      });
      h += '</div>';
    } else if(m.type==='quantite'){
      h += '<div class="lab">'+esc(m.titre)+'</div><div class="nb">'
         + '<button data-v="-">−</button><b id="vv">'+E.verres+'</b><button data-v="+">+</button></div>';
    }
  });

  if(p.ret && p.ret.length){
    h += '<div class="lab">Retirer un ingrédient</div><div class="opts">';
    p.ret.forEach(function(r){
      h += '<button class="opt ret'+(E.retraits.indexOf(r)>=0?' on':'')+'" data-ret="'+esc(r)+'">'+esc(r)+'</button>';
    });
    h += '</div>';
  }

  h += '<div class="lab">Précision pour la cuisine</div>'
     + '<input class="inp" id="noteLibre" maxlength="60" placeholder="facultatif" value="'+esc(E.note)+'">';

  var manque = false;
  (p.mods||[]).forEach(function(mk){
    var m=D.mods[mk];
    if(m && m.type==='unique' && m.obl && !E.mods[mk]) manque = true;
  });
  h += '<button class="go" id="okProd"'+(manque?' disabled':'')+'>'
     + (manque ? 'Choisis la cuisson' : 'Ajouter à la table') + '</button>'
     + '<button class="go sec" id="annProd">Annuler</button>';
  el('pan').innerHTML = h;
}
function validerProduit(){
  var E = EN_COURS, p = E.p, t = TABLES[TREF];
  if(!t) return;
  var pu = p.libre ? (parseFloat((el('prixLibre')||{}).value)||0) : p.prix;
  for(var k in E.mods){
    var m = D.mods[k];
    if(!m || !m.opt) continue;
    var o = m.opt.filter(function(x){ return x.l===E.mods[k]; })[0];
    if(o && o.p) pu += o.p;
  }
  if(E.verres && D.mods.format && E.mods.format==='Litre'){ /* le format porte déjà le supplément */ }
  SEQ++;
  t.lignes.push({
    id:'L'+SEQ, prod:p.id, nom:p.nom, pu:pu, qte:E.qte,
    mods:JSON.parse(JSON.stringify(E.mods)), retraits:E.retraits.slice(),
    note:(el('noteLibre')||{}).value||'', verres:E.verres||0,
    service:serviceDe(p), dest:p.dest, etat:'saisie', ts:Date.now()
  });
  fermerFeuille();
  aller('table');
}
function fermerFeuille(){ el('sheet').classList.remove('on'); EN_COURS=null; }

/* ── envoi, attente, faire marcher ───────────────────────────────── */
function envoyer(){
  var t = TABLES[TREF]; if(!t) return;
  var neuves = t.lignes.filter(function(l){ return l.etat==='saisie'; });
  if(!neuves.length) return;
  /* Les boissons et les entrées partent tout de suite ; le reste attend
     que le serveur fasse marcher. C'est le rythme d'un vrai service. */
  var lance = neuves.filter(function(l){ return l.service==='boisson' || l.service==='aperitif' || l.service==='entree'; });
  var attend = neuves.filter(function(l){ return lance.indexOf(l)<0; });
  lance.forEach(function(l){ l.etat='lance'; l.tsLance=Date.now(); });
  attend.forEach(function(l){ l.etat='attente'; });
  if(lance.length) emettreTickets(t, lance, null);
  renderTable(); renderPlan(); majBadge();
  PHXtoast(lance.length + ' ligne(s) envoyée(s)' + (attend.length? ', '+attend.length+' en attente' : ''));
}
function faireMarcher(sv){
  var t = TABLES[TREF]; if(!t) return;
  var lst = t.lignes.filter(function(l){ return l.service===sv && l.etat==='attente'; });
  if(!lst.length) return;
  lst.forEach(function(l){ l.etat='lance'; l.tsLance=Date.now(); });
  emettreTickets(t, lst, 'FAIRE MARCHER');
  renderTable(); renderPlan(); majBadge();
  PHXtoast('Faire marcher : ' + NOM_SVC[sv].toLowerCase());
}
/* Deux tickets par destinataire : un pour celui qui prépare, un pour celui qui sert. */
function emettreTickets(t, lignes, titre){
  ['cuisine','bar'].forEach(function(dest){
    var lst = lignes.filter(function(l){ return l.dest===dest; });
    if(!lst.length) return;
    ['PRÉPARATION','SERVICE'].forEach(function(copie){
      TICKETS.unshift({
        id:'K'+(++SEQ), dest:dest, copie:copie, titre:titre, ts:Date.now(),
        table:t.ref, couverts:t.couverts, serveur:SERVEUR, fait:false,
        lignes:lst.map(function(l){ return {qte:l.qte, nom:l.nom, opt:optionsTexte(l)}; }),
        allergie: t.allergie || ''
      });
    });
  });
}
var ECRAN='cuisine';
function renderEcran(){
  var lst = TICKETS.filter(function(k){ return k.dest===ECRAN && !k.fait; });
  el('tickets').innerHTML = lst.length ? lst.map(function(k){
    var h = '<div class="tk'+(k.titre?' marche':'')+'"><div class="h"><b>'+esc(k.table)+'</b>'
      + '<span class="m">'+hhmm(k.ts)+' · '+k.couverts+' cv</span>'
      + '<span class="cp">'+esc(k.copie)+'</span></div>';
    if(k.allergie) h += '<div class="alg">ALLERGIE : '+esc(k.allergie)+'</div>';
    if(k.titre) h += '<div class="alg" style="background:rgba(212,168,67,.18);border-color:rgba(212,168,67,.5);color:#E8CD8E">'+esc(k.titre)+'</div>';
    k.lignes.forEach(function(l){
      h += '<div class="l"><span class="q">'+l.qte+'</span><span>'+esc(l.nom);
      if(l.opt.g) h += '<em>'+esc(l.opt.g)+'</em>';
      if(l.opt.r) h += '<em class="ret">'+esc(l.opt.r)+'</em>';
      h += '</span></div>';
    });
    h += '<button class="fait" data-fait="'+k.id+'">✓ Servi</button></div>';
    return h;
  }).join('') : '<div class="vide">Aucun ticket en attente.</div>';
}
function majBadge(){
  var n = TICKETS.filter(function(k){ return !k.fait; }).length;
  var b = el('bdg');
  b.style.display = n ? '' : 'none';
  b.textContent = n;
}

/* ── navigation ──────────────────────────────────────────────────── */
function aller(v){
  VUE = v;
  ['Plan','Table','Carte','Ecran'].forEach(function(n){
    el('v'+n).classList.toggle('on', n.toLowerCase()===v);
  });
  el('btnBack').style.display = (v==='plan'||v==='ecran') ? 'none' : '';
  el('barBas').classList.toggle('on', v==='table');
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.v===v || (v==='table'&&b.dataset.v==='plan') || (v==='carte'&&b.dataset.v==='plan'));
  });
  if(v==='plan'){ el('titre').textContent='Plan de salle'; renderPlan(); }
  if(v==='table') renderTable();
  if(v==='carte'){ el('titre').textContent='Carte'; el('soustitre').textContent='Table '+TREF; renderCarte(); }
  if(v==='ecran'){ el('titre').textContent='Écrans'; el('soustitre').textContent='Cuisine & bar';
                   el('kpi1').textContent=TICKETS.filter(function(k){return !k.fait;}).length;
                   el('kpi1l').textContent='tickets'; renderEcran(); }
  window.scrollTo(0,0);
  document.querySelector('main').scrollTop = 0;
}

/* ── ouverture de table ──────────────────────────────────────────── */
function feuilleOuverture(ref, places){
  var n = places;
  el('pan').innerHTML = '<div class="grab"></div><h2>Table '+esc(ref)+'</h2>'
    + '<div class="sub">Combien de couverts ?</div>'
    + '<div class="nb"><button data-c="-">−</button><b id="cv">'+n+'</b><button data-c="+">+</button></div>'
    + '<div class="lab">Allergie déclarée</div>'
    + '<input class="inp" id="alg" maxlength="40" placeholder="facultatif — ex. fruits à coque">'
    + '<button class="go" id="okTable">Ouvrir la table</button>'
    + '<button class="go sec" id="annTable">Annuler</button>';
  el('sheet').classList.add('on');
  el('pan').dataset.ref = ref;
  el('pan').dataset.n = n;
}

function PHXtoast(msg){
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;left:50%;bottom:calc(132px + var(--safe));transform:translateX(-50%);'
    + 'background:#17394E;border:1px solid rgba(185,141,85,.4);color:#F6F0E4;padding:10px 16px;'
    + 'border-radius:999px;font-size:13px;z-index:950;box-shadow:0 6px 24px rgba(0,0,0,.4)';
  document.body.appendChild(d);
  setTimeout(function(){ d.style.transition='opacity .3s'; d.style.opacity=0;
                         setTimeout(function(){ d.remove(); }, 320); }, 1700);
}

/* ── un seul écouteur pour toute l'application ───────────────────── */
document.addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if(!b) return;

  if(b.dataset.v){ aller(b.dataset.v==='plan'?'plan':'ecran'); return; }
  if(b===el('btnBack')){ aller(VUE==='carte'?'table':'plan'); return; }
  if(b.dataset.d){ ECRAN=b.dataset.d;
    document.querySelectorAll('#segEcran button').forEach(function(x){ x.classList.toggle('on', x===b); });
    renderEcran(); return; }
  if(b.dataset.fait){ TICKETS.forEach(function(k){ if(k.id===b.dataset.fait) k.fait=true; });
    renderEcran(); majBadge(); return; }

  if(b.dataset.ref){
    var ref=b.dataset.ref;
    if(TABLES[ref]){ TREF=ref; aller('table'); }
    else{
      var tb = D.plan.tables.filter(function(x){ return x.ref===ref; })[0];
      feuilleOuverture(ref, tb?tb.places:2);
    }
    return;
  }
  if(b.dataset.c){ var e=el('cv'); var n=Math.max(1,Math.min(20,+e.textContent+(b.dataset.c==='+'?1:-1)));
    e.textContent=n; return; }
  if(b.id==='okTable'){
    var ref=el('pan').dataset.ref;
    TABLES[ref]={ref:ref, couverts:+el('cv').textContent, allergie:el('alg').value.trim(),
                  lignes:[], ts:Date.now()};
    TREF=ref; fermerFeuille(); aller('table'); renderPlan(); return; }
  if(b.id==='annTable' || b.id==='annProd'){ fermerFeuille(); return; }

  if(b.id==='btnAjouter'){ aller('carte'); return; }
  if(b.id==='btnEnvoyer'){ envoyer(); return; }
  if(b.dataset.cat){ CAT=b.dataset.cat; renderCarte(); return; }
  if(b.dataset.prod){ ouvrirProduit(b.dataset.prod); return; }
  if(b.dataset.marche){ faireMarcher(b.dataset.marche); return; }
  if(b.dataset.sup){ var t=TABLES[TREF];
    t.lignes = t.lignes.filter(function(l){ return l.id!==b.dataset.sup; });
    renderTable(); renderPlan(); return; }

  if(b.dataset.q){ EN_COURS.qte = Math.max(1, Math.min(20, EN_COURS.qte + (b.dataset.q==='+'?1:-1)));
    EN_COURS.note = (el('noteLibre')||{}).value||''; dessinerFeuille(); return; }
  if(b.dataset.v==='+'||b.dataset.v==='-'){ EN_COURS.verres = Math.max(1, Math.min(8,
      EN_COURS.verres + (b.dataset.v==='+'?1:-1))); dessinerFeuille(); return; }
  if(b.dataset.mod){ EN_COURS.mods[b.dataset.mod] = b.dataset.val;
    EN_COURS.note=(el('noteLibre')||{}).value||''; dessinerFeuille(); return; }
  if(b.dataset.ret){ var r=b.dataset.ret, i=EN_COURS.retraits.indexOf(r);
    if(i>=0) EN_COURS.retraits.splice(i,1); else EN_COURS.retraits.push(r);
    EN_COURS.note=(el('noteLibre')||{}).value||''; dessinerFeuille(); return; }
  if(b.id==='okProd'){ validerProduit(); return; }
});
el('sheet').addEventListener('click', function(ev){ if(ev.target===this) fermerFeuille(); });

/* Une table oubliée doit se voir toute seule : on repasse toutes les minutes. */
setInterval(function(){ if(VUE==='plan') renderPlan(); }, 60000);

aller('plan');
</script>
</body></html>
