    var liste = tous();
    D.produits.length = 0;
    liste.forEach(function(p){ if(!p.cache) D.produits.push(p); });
    var ordre = (FILE.ordre || CARTE.ordre || BASE.ordre).slice();
    liste.forEach(function(p){ if(ordre.indexOf(p.cat) < 0){
      var h = ordre.indexOf('Hors carte'); if(h < 0) ordre.push(p.cat); else ordre.splice(h, 0, p.cat); } });
    D.ordre.length = 0; ordre.forEach(function(c){ D.ordre.push(c); });
    if(D.ordre.indexOf(CAT) < 0) CAT = D.ordre[0];
    try{ if(VUE==='carte') renderCarte(); }catch(e){}
  }
  window.PHXcarte = { applique: applique, tous: tous };

  function poste(corps){
    return fetch(API, { method:'POST', cache:'no-store', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(corps) }).then(function(r){ return r.text(); })
      .then(function(t){ var j=null; try{ j=JSON.parse(t); }catch(e){} if(!j) throw new Error('réponse illisible'); return j; });
  }
  function tireCarte(){
    if(!API || API.indexOf('http')!==0) return Promise.resolve();
    return poste({ action:'caisse_carte' }).then(function(j){
      if(!j.ok) return;
      var m = {}; (j.produits||[]).forEach(function(p){ if(p && p.id) m[p.id] = p; });
      CARTE = { produits:m, ordre:j.ordre||null, maj:j.maj||'' }; ecrit(CLE, CARTE);
      applique(); if(el('gxVoile')) rend();
    }).catch(function(){});
  }
  function envoieFile(){
    var ids = Object.keys(FILE.produits);
    if(!CODE || (!ids.length && !FILE.ordre)) return Promise.resolve(true);
    var envoi = { action:'caisse_carte_maj', code:CODE, par:(MOI&&MOI.nom)||'patron',
                  produits: ids.map(function(id){ return FILE.produits[id]; }) };
    if(FILE.ordre) envoi.ordre = FILE.ordre;
    return poste(envoi).then(function(j){
      if(!j.ok){ PHXtoast(j.error || 'Refusé'); return false; }
      ids.forEach(function(id){ CARTE.produits[id] = FILE.produits[id]; delete FILE.produits[id]; });
      if(envoi.ordre){ CARTE.ordre = envoi.ordre; FILE.ordre = null; }
      ecrit(CLE, CARTE); ecrit(CLE_FILE, FILE); return true;
    }).catch(function(){ return false; });
  }
  function enregistre(p){
    FILE.produits[p.id] = p; ecrit(CLE_FILE, FILE); applique();
    envoieFile().then(function(ok){ PHXtoast(ok ? 'Enregistré pour toutes les caisses' : 'Enregistré ici — envoi dès que le réseau revient'); rend(); });
  }

  /* ── affichage ── */
  var CSS = '#gxVoile{position:fixed;inset:0;z-index:900;background:var(--deep);display:flex;flex-direction:column}'
    + '#gxVoile header{border-bottom:1px solid var(--hair2)}#gxCorps{flex:1;overflow:auto;padding:12px 14px calc(30px + var(--safe))}'
    + '.gx-tabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--hair2);overflow-x:auto}'
    + '.gx-tabs button{padding:9px 14px;border-radius:999px;border:1px solid var(--hair);font-size:13.5px;color:var(--ink2);white-space:nowrap}'
    + '.gx-tabs button.on{background:var(--gold);color:var(--deep);border-color:var(--gold)}'
    + '.gx-li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 10px;border-bottom:1px solid var(--hair2)}'
    + '.gx-li .n{flex:1;min-width:0}.gx-li small{display:block;color:var(--ink3);font-size:12px}.gx-li .p{font-family:var(--mono)}'
    + '.gx-tag{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--hair);color:var(--ink2);margin-left:6px}'
    + '.gx-row{display:flex;gap:8px}.gx-row>*{flex:1}.gx-mini{padding:8px 12px;border-radius:10px;border:1px solid var(--hair);font-size:13px}'
    + '.gx-chips{display:flex;flex-wrap:wrap;gap:6px}.gx-chips button{padding:7px 11px;border-radius:999px;border:1px solid var(--hair);font-size:12.5px;color:var(--ink2)}'
    + '.gx-chips button.on{background:rgba(212,168,67,.18);border-color:var(--gold);color:var(--cream)}'
    + '.gx-note{color:var(--ink3);font-size:12.5px;line-height:1.45;margin:8px 0}.gx-qr{background:#fff;border-radius:14px;padding:12px;width:min(78vw,300px);margin:14px auto}'
    + '.gx-qr svg{display:block;width:100%;height:auto}select.inp{appearance:auto}';

  function ouvre(){
    if(!el('gxStyle')){ var s=document.createElement('style'); s.id='gxStyle'; s.textContent=CSS; document.head.appendChild(s); }
    var v = el('gxVoile');
    if(!v){ v = document.createElement('div'); v.id='gxVoile'; document.body.appendChild(v);
      v.addEventListener('click', clic); v.addEventListener('input', saisie); }
    rend();
  }
  function ferme(){ var v=el('gxVoile'); if(v) v.remove(); EDIT=null; }
  function entete(titre, sous){
    return '<header><div class="t"><h1>'+esc(titre)+'</h1><div style="color:var(--ink3);font-size:12px">'+esc(sous||'')+'</div></div>'
      + '<button class="gx-mini" data-gx="fermer">Fermer</button></header>'
      + '<div class="gx-tabs">'
      + [['carte','Carte'],['rayons','Rayons'],['equipe','Équipe'],['photos','Photos du jour']].map(function(o){
          return '<button data-gx="ong" data-gx-v="'+o[0]+'"'+(ONG===o[0]?' class="on"':'')+'>'+o[1]+'</button>'; }).join('')
      + '</div><div id="gxCorps">';
  }
  function attente(){ var n = Object.keys(FILE.produits).length + (FILE.ordre?1:0);
    return n ? '<div class="gx-note" style="color:var(--warn)">⏳ '+n+' modification(s) pas encore envoyée(s) — elles partiront dès que le réseau revient. <button class="gx-mini" data-gx="renvoyer">Renvoyer</button></div>' : ''; }

  function rend(){
    var v = el('gxVoile'); if(!v) return;
    if(!CODE && ONG !== 'photos'){ v.innerHTML = entete('Mode gérant', 'Code du patron') + porte() + '</div>'; return; }
    if(EDIT){ v.innerHTML = entete(EDIT.neuf ? 'Nouveau produit' : 'Modifier', EDIT.p.nom || '') + fiche() + '</div>'; return; }
    var h = '';
    if(ONG==='carte') h = listeCarte();
    if(ONG==='rayons') h = listeRayons();
    if(ONG==='equipe') h = listeEquipe();
    if(ONG==='photos') h = photos();
    v.innerHTML = entete(ONG==='photos' ? 'Photos du jour' : 'Mode gérant', MOI ? MOI.nom : '') + attente() + h + '</div>';
  }
  function porte(){
    return '<div class="lab" style="margin-top:20px">Code du patron</div>'
      + '<input class="inp" id="gxCode" type="password" inputmode="numeric" autocomplete="off">'
      + '<button class="go" data-gx="entrer">Entrer</button><div class="gx-note" id="gxMsg"></div>'
      + '<div class="gx-note">Le mode gérant permet de changer les prix, d\'ajouter ou masquer un produit, de ranger les rayons et de gérer les codes de l\'équipe. Tout est enregistré dans le classeur.</div>';
  }
  function listeCarte(){
    var liste = tous(), q = RQ.toLowerCase();
    var cats = D.ordre.filter(function(c){ return liste.some(function(p){ return p.cat===c; }); });
    if(!RAY || cats.indexOf(RAY)<0) RAY = cats[0];
    var h = '<div class="gx-row"><input class="inp" id="gxRech" placeholder="Chercher un produit" value="'+esc(RQ)+'">'
      + '<button class="go" style="margin-top:0;flex:none;width:auto;padding:0 16px" data-gx="nouveau">+ Produit</button></div>';
    if(!q) h += '<div class="gx-chips" style="margin:10px 0">' + cats.map(function(c){
      return '<button data-gx="ray" data-gx-v="'+esc(c)+'"'+(c===RAY?' class="on"':'')+'>'+esc(c)+'</button>'; }).join('') + '</div>';
    var l = liste.filter(function(p){ return q ? (p.nom+' '+(p.desc||'')+' '+p.cat).toLowerCase().indexOf(q)>=0 : p.cat===RAY; });
    h += l.map(function(p){
      return '<button class="gx-li" data-gx="edit" data-gx-v="'+esc(p.id)+'"><span class="n">'+(p.coeur?'◆ ':'')+esc(p.nom)
        + (p.cache?'<span class="gx-tag">masqué</span>':'') + (estEpuise(p.id)?'<span class="gx-tag" style="color:var(--alert)">épuisé</span>':'')
        + (FILE.produits[p.id]?'<span class="gx-tag">⏳</span>':'')
        + '<small>'+esc(p.cat)+' · '+(p.dest==='bar'?'bar':'cuisine')+'</small></span>'
        + '<span class="p">'+(p.libre?'prix du jour':eur(cts(p.prix)))+'</span></button>';
    }).join('') || '<div class="gx-note">Aucun produit.</div>';
    return h;
  }
  function fiche(){
    var p = EDIT.p, rayons = D.ordre.slice(); if(rayons.indexOf(p.cat)<0 && p.cat) rayons.push(p.cat);
    var algs = (D.allergenes||[]), mods = Object.keys(D.mods||{});
    var h = '<div class="lab">Nom</div><input class="inp" id="gxNom" maxlength="80" value="'+esc(p.nom||'')+'">'
      + '<div class="gx-row"><div><div class="lab">Prix TTC (€)</div><input class="inp" id="gxPrix" inputmode="decimal" value="'+(p.prix!=null?String(p.prix).replace('.',','):'')+'"></div>'
      + '<div><div class="lab">Envoi</div><select class="inp" id="gxDest"><option value="cuisine"'+(p.dest!=='bar'?' selected':'')+'>Cuisine</option><option value="bar"'+(p.dest==='bar'?' selected':'')+'>Bar</option></select></div></div>'
      + '<div class="lab">Rayon</div><select class="inp" id="gxCat">' + rayons.map(function(c){ return '<option'+(c===p.cat?' selected':'')+'>'+esc(c)+'</option>'; }).join('')
      + '<option value="__neuf">+ Nouveau rayon…</option></select>'
      + '<input class="inp" id="gxCatNeuf" style="margin-top:8px;display:none" maxlength="40" placeholder="Nom du nouveau rayon">'
      + '<div class="lab">Description (facultatif)</div><input class="inp" id="gxDesc" maxlength="300" value="'+esc(p.desc||'')+'">'
      + '<div class="lab">Réglages</div><div class="gx-chips">'
      + puce('coeur', p.coeur, '◆ Coup de cœur') + puce('libre', p.libre, 'Prix du jour (tapé à la commande)')
      + puce('epuise', !!S.rupture[p.id], 'Épuisé ce soir') + puce('cache', p.cache, 'Masqué de la caisse') + '</div>'
      + '<div class="lab">Allergènes</div><div class="gx-chips">' + algs.map(function(a){
          return '<button data-gx="alg" data-gx-v="'+esc(a.c)+'"'+((p.alg||[]).indexOf(a.c)>=0?' class="on"':'')+'>'+esc(a[LG]||a.fr||a.c)+'</button>'; }).join('')
      + '</div><div class="gx-note">Obligatoire de pouvoir informer le client (règlement UE 1169/2011). Laisser vide = « à demander en cuisine ».</div>'
      + (mods.length ? '<div class="lab">Options proposées à la commande</div><div class="gx-chips">' + mods.map(function(k){
          return '<button data-gx="mod" data-gx-v="'+esc(k)+'"'+((p.mods||[]).indexOf(k)>=0?' class="on"':'')+'>'+esc(D.mods[k].titre||k)+'</button>'; }).join('') + '</div>' : '')
      + '<div class="lab">Ingrédients qu\'on peut retirer (séparés par des virgules)</div><input class="inp" id="gxRet" value="'+esc((p.ret||[]).join(', '))+'">'
      + '<button class="go" data-gx="sauver">Enregistrer</button>'
      + '<button class="go sec" data-gx="annuler">Annuler</button>';
    if(!EDIT.neuf){
      var deBase = BASE.produits.some(function(x){ return x.id===p.id; });
      h += deBase ? '<div class="gx-note">Produit de la carte d\'origine : pour l\'enlever, cochez « Masqué de la caisse ».</div>'
                  : '<button class="go sec" style="color:var(--alert)" data-gx="supprimer">Supprimer ce produit</button>';
    }
    return h;
  }
  function puce(k, on, txt){ return '<button data-gx="puce" data-gx-v="'+k+'"'+(on?' class="on"':'')+'>'+txt+'</button>'; }
  function listeRayons(){
    return '<div class="gx-note">L\'ordre des rayons tel qu\'il apparaît sur la caisse.</div>'
      + D.ordre.map(function(c, i){
        return '<div class="gx-li"><span class="n">'+esc(c)+'</span>'
          + '<button class="gx-mini" data-gx="monte" data-gx-v="'+i+'"'+(i?'':' disabled')+'>↑</button>'
          + '<button class="gx-mini" data-gx="descend" data-gx-v="'+i+'"'+(i<D.ordre.length-1?'':' disabled')+'>↓</button></div>';
      }).join('');
  }
  function listeEquipe(){
    if(EQUIPE===null){ chargeEquipe(); return '<div class="gx-note">Chargement de l\'équipe…</div>'; }
    if(EQUIPE.erreur) return '<div class="gx-note" style="color:var(--alert)">'+esc(EQUIPE.erreur)+'</div><button class="go sec" data-gx="equipeRe">Réessayer</button>';
    return '<div class="gx-note">Chaque personne se connecte à la caisse avec son prénom et son code (4 à 6 chiffres). Les codes ne sont jamais affichés.</div>'
      + EQUIPE.map(function(m){
        return '<div class="gx-li"><span class="n">'+esc(m.prenom)+(m.actif?'':'<span class="gx-tag">désactivé</span>')+'</span>'
          + '<button class="gx-mini" data-gx="nvCode" data-gx-v="'+esc(m.prenom)+'">Nouveau code</button>'
          + '<button class="gx-mini" data-gx="actif" data-gx-v="'+esc(m.prenom)+'">'+(m.actif?'Désactiver':'Réactiver')+'</button></div>';
      }).join('')
      + '<div class="lab" style="margin-top:22px">Ajouter quelqu\'un ou changer un code</div>'
      + '<div class="gx-row"><input class="inp" id="gxPre" maxlength="30" placeholder="Prénom"><input class="inp" id="gxPin" inputmode="numeric" maxlength="6" placeholder="Code (4 à 6 chiffres)"></div>'
      + '<button class="go" data-gx="ajoute">Ajouter / changer le code</button>';
  }
  function photos(){
    return '<div class="gx-note" style="font-size:14px;color:var(--ink2)">Scannez avec le téléphone de Bastien : le scanner du QG s\'ouvre. Photos des tickets Z, factures, bons de livraison, feuilles de comptage, notes et aides : tout part au village, qui les lit, les range dans Drive et les met à leur place dans le classeur.</div>'
      + '<div class="gx-qr">'+QR_SVG+'</div>'
      + '<div class="gx-note" style="text-align:center;word-break:break-all">'+esc(QG_SCAN)+'</div>'
      + '<div class="gx-note">Rien n\'est écrit tant que vous n\'avez pas validé ce que le village a lu.</div>';
  }

  function chargeEquipe(){
    poste({ action:'caisse_equipe', code:CODE }).then(function(j){
      EQUIPE = j.ok ? j.equipe : { erreur: j.error || 'Refusé' }; rend();
    }).catch(function(){ EQUIPE = { erreur:'Serveur injoignable — l\'équipe se gère avec le réseau.' }; rend(); });
  }
  function majEquipe(corps){
    corps.action = 'caisse_equipe_maj'; corps.code = CODE;
    poste(corps).then(function(j){
      if(!j.ok){ PHXtoast(j.error || 'Refusé'); return; }
      EQUIPE = j.equipe; PHXtoast('Équipe enregistrée');
      PROFILS = j.equipe.filter(function(m){ return m.actif; }).map(function(m){ return m.prenom; });
      try{ localStorage.setItem('phx_caisse_profils', JSON.stringify(PROFILS)); }catch(e){}
      rend();
    }).catch(function(){ PHXtoast('Serveur injoignable — réessaie avec le réseau'); });
  }
  function num(s){ var n = parseFloat(String(s||'').replace(/\s/g,'').replace(',', '.')); return isNaN(n) ? null : n; }
  function idNeuf(nom){
    var b = String(nom).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40) || 'produit';
    var id = b, i = 2, ex = tous().map(function(p){ return p.id; }).concat(BASE.produits.map(function(p){ return p.id; }));
    while(ex.indexOf(id)>=0) id = b + '_' + (i++);
    return id;
  }

  function clic(ev){
    var b = ev.target.closest('button'); ev.stopPropagation();
    if(!b || !b.dataset.gx) return;
    var a = b.dataset.gx, v = b.dataset.gxV;
    if(a==='fermer'){ ferme(); return; }
    if(a==='ong'){ ONG = v; EDIT = null; rend(); return; }
    if(a==='entrer'){
      var c = (el('gxCode').value||'').trim(); if(!c) return;
      el('gxMsg').textContent = '…';
      poste({ action:'caisse_gerant', code:c }).then(function(j){
        if(j.ok){ CODE = c; rend(); envoieFile(); tireCarte(); }
        else el('gxMsg').textContent = j.error || 'Code refusé';
      }).catch(function(){ el('gxMsg').textContent = 'Serveur injoignable — le mode gérant a besoin du réseau.'; });
      return;
    }
    if(a==='renvoyer'){ envoieFile().then(function(ok){ PHXtoast(ok?'Tout est envoyé':'Toujours pas de réseau'); rend(); }); return; }
    if(a==='ray'){ RAY = v; rend(); return; }
    if(a==='nouveau'){ EDIT = { neuf:true, p:{ nom:'', cat:RAY||D.ordre[0], prix:'', dest:'cuisine', coeur:0, ret:[], mods:[], alg:[], algv:0, desc:'' } }; rend(); return; }
    if(a==='edit'){ var p = tous().filter(function(x){ return x.id===v; })[0]; if(!p) return;
      EDIT = { neuf:false, p: JSON.parse(JSON.stringify(p)) }; rend(); return; }
    if(a==='annuler'){ EDIT = null; rend(); return; }
    if(a==='puce'){ var P = EDIT.p;
      if(v==='epuise'){ EDIT.epuise = !(EDIT.epuise!=null ? EDIT.epuise : !!S.rupture[P.id]); b.classList.toggle('on', EDIT.epuise); return; }
      P[v] = P[v] ? 0 : 1; b.classList.toggle('on', !!P[v]); return; }
    if(a==='alg' || a==='mod'){ var k = a==='alg'?'alg':'mods', L = EDIT.p[k] = (EDIT.p[k]||[]).filter(function(x){ return x!=='?'; });
      var i = L.indexOf(v); if(i>=0) L.splice(i,1); else L.push(v); b.classList.toggle('on', i<0);
      if(a==='alg') EDIT.p.algv = 1; return; }
    if(a==='sauver'){ sauve_(); return; }
    if(a==='supprimer'){ if(!confirmeDouce(b)) return;
      enregistre({ id:EDIT.p.id, suppr:1 }); EDIT = null; rend(); return; }
    if(a==='monte' || a==='descend'){ var o = D.ordre.slice(), j = +v, k2 = a==='monte'? j-1 : j+1;
      var tmp = o[j]; o[j] = o[k2]; o[k2] = tmp; FILE.ordre = o; ecrit(CLE_FILE, FILE); applique();
      envoieFile().then(function(){ rend(); }); rend(); return; }
    if(a==='equipeRe'){ EQUIPE = null; rend(); return; }
    if(a==='ajoute'){ var pr = el('gxPre').value.trim(), pin = el('gxPin').value.trim();
      if(!pr || !/^\d{4,6}$/.test(pin)){ PHXtoast('Prénom et code de 4 à 6 chiffres'); return; }
      majEquipe({ prenom:pr, codePerso:pin }); return; }
    if(a==='nvCode'){ var fp = el('gxPre'), fc = el('gxPin'); if(!fp) return;
      fp.value = v; fc.value = ''; fc.focus(); fc.scrollIntoView({block:'center'});
      PHXtoast('Tape le nouveau code de ' + v + ' puis « Ajouter / changer »'); return; }
    if(a==='actif'){ var m = (EQUIPE||[]).filter(function(x){ return x.prenom===v; })[0]; if(!m) return;
      majEquipe({ prenom:v, actif:!m.actif }); return; }
  }
  /* Deuxième appui pour confirmer : pas de fenêtre du navigateur, elle bloque la caisse. */
  function confirmeDouce(b){ if(b.dataset.arme){ return true; } b.dataset.arme = 1; b.textContent = 'Appuyer encore pour supprimer'; return false; }
  function saisie(ev){
    if(ev.target.id==='gxRech'){ RQ = ev.target.value; var pos = ev.target.selectionStart; rend();
      var r = el('gxRech'); if(r){ r.focus(); try{ r.setSelectionRange(pos,pos); }catch(e){} } }
    if(ev.target.id==='gxCat'){ el('gxCatNeuf').style.display = ev.target.value==='__neuf' ? '' : 'none'; }
  }
  document.addEventListener('change', function(ev){ if(ev.target && ev.target.id==='gxCat') saisie(ev); });
  function sauve_(){
    var P = EDIT.p, nom = el('gxNom').value.trim(), prix = num(el('gxPrix').value);
    if(!nom){ PHXtoast('Il faut un nom'); return; }
    if(!P.libre && (prix==null || prix<0)){ PHXtoast('Prix invalide'); return; }
    var cat = el('gxCat').value; if(cat==='__neuf') cat = el('gxCatNeuf').value.trim();
    if(!cat){ PHXtoast('Choisis un rayon'); return; }
    P.nom = nom; P.prix = prix==null ? 0 : Math.round(prix*100)/100; P.cat = cat;
    P.dest = el('gxDest').value; P.desc = el('gxDesc').value.trim();
    P.ret = el('gxRet').value.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    if(EDIT.neuf) P.id = idNeuf(nom);
    if(EDIT.epuise!=null){ if(EDIT.epuise) S.rupture[P.id]=1; else delete S.rupture[P.id]; try{ sauve(); }catch(e){} }
    ['coeur','libre','cache'].forEach(function(k){ if(!P[k]) delete P[k]; });
    RAY = cat; EDIT = null; enregistre(P); rend();
  }

  /* ── branchement : le bouton « moi » gagne deux entrées ── */
  var feuilleMoiAvant = feuilleMoi;
  feuilleMoi = function(){
    feuilleMoiAvant();
    var fin = el('btnFin'); if(!fin) return;
    var d = document.createElement('div');
    d.innerHTML = '<button class="go" id="btnDispo">📋 Dispo du jour — ce qu’on n’a pas</button>'
                + '<button class="go sec" id="gxPhotos">📷 Envoyer les photos du jour (QR)</button>'
                + '<button class="go sec" id="gxGerant">⚙︎ Mode gérant — carte, prix, équipe</button>';
    fin.parentNode.insertBefore(d, fin);
  };
  document.addEventListener('click', function(ev){
    var b = ev.target.closest && ev.target.closest('button'); if(!b) return;
    if(b.id==='gxGerant'){ fermerFeuille(); ONG='carte'; ouvre(); }
    if(b.id==='gxPhotos'){ fermerFeuille(); ONG='photos'; ouvre(); }
  });

  applique();
  tireCarte();
  setInterval(function(){ if(!el('gxVoile')) tireCarte(); }, 300000);

@keyframes phxFlame{ from{background-position:50% 0%} to{background-position:50% 100%} }
@keyframes phxSpin{ to{transform:rotate(360deg)} }
@keyframes phxRise{ 0%,100%{transform:translateY(2px)} 50%{transform:translateY(-4px)} }
@keyframes phxFade{ from{opacity:0} to{opacity:1} }
@keyframes phxBar{ 0%{left:-38%} 100%{left:100%} }

/* ── voile plein écran : opérations où l'on doit attendre ── */
#phxVeil{
  position:fixed; inset:0; z-index:99999; display:none;
  align-items:center; justify-content:center; flex-direction:column;
  background:rgba(11,26,36,.88); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  animation:phxFade .22s ease both; -webkit-tap-highlight-color:transparent;
}
#phxVeil.on{ display:flex }
.phx-halo{ position:relative; width:132px; height:132px; display:grid; place-items:center }
.phx-halo::before{ content:''; position:absolute; width:104px; height:104px; border-radius:50%;
  background:radial-gradient(circle, rgba(212,168,67,.16) 0%, rgba(212,168,67,0) 68%);
  animation:phxGlow 2.6s ease-in-out infinite }
@keyframes phxGlow{ 0%,100%{transform:scale(.86);opacity:.55} 50%{transform:scale(1.06);opacity:1} }
.phx-halo .ring{
  position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg, rgba(185,141,85,0) 0deg, rgba(185,141,85,0) 190deg,
             rgba(185,141,85,.75) 300deg, var(--phx-gold) 352deg, rgba(185,141,85,0) 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
  animation:phxSpin 1.25s linear infinite;
}
.phx-halo .bird{ width:86px; height:86px; animation:phxFlame 2.1s linear infinite, phxRise 2.6s ease-in-out infinite }
#phxVeilMsg{
  margin-top:26px; font-family:var(--mono,'JetBrains Mono',monospace); font-size:11px;
  letter-spacing:.18em; text-transform:uppercase; color:var(--phx-gold); text-align:center; padding:0 24px;
}
#phxVeilSub{
  margin-top:9px; font-size:12.5px; color:rgba(246,240,228,.52); text-align:center;
  padding:0 32px; max-width:300px; line-height:1.5; min-height:18px;
}

/* ── ruban discret : tout appel réseau de fond ── */
#phxWisp{ position:fixed; top:0; left:0; right:0; height:2px; z-index:99998; display:none; overflow:hidden;
  background:rgba(185,141,85,.16) }
#phxWisp.on{ display:block }
#phxWisp i{ position:absolute; top:0; height:100%; width:38%;
  background:linear-gradient(90deg, transparent, var(--phx-gold), transparent);
  animation:phxBar 1.15s ease-in-out infinite }

/* ── en ligne : remplace les « Chargement… » dans les listes ── */
/* la couleur est héritée du conteneur : le même bloc sert sur fond navy comme sur fond crème */
.phx-inline{ display:flex; align-items:center; justify-content:center; gap:10px;
  padding:18px 0; color:inherit; opacity:.72; font-size:13px }
.phx-inline .bird{ width:22px; height:22px; flex:none }

@media (prefers-reduced-motion:reduce){
  .phx-bird,.phx-halo .bird{ animation:none !important; background-position:50% 50% !important }
  .phx-halo .ring{ animation:phxSpin 3.4s linear infinite }
  #phxWisp i{ animation-duration:2.4s }
}
</style>

<div id="phxWisp" aria-hidden="true"><i></i></div>
<div id="phxVeil" role="status" aria-live="polite" aria-hidden="true">
  <div class="phx-halo"><div class="ring"></div><div class="bird phx-bird"></div></div>
  <div id="phxVeilMsg">Traitement en cours</div>
  <div id="phxSub"><span id="phxVeilSub"></span></div>
</div>

<script>
/* PHX.load — l'attente racontée plutôt que subie.
   .show(msg)  voile plein écran, pour ce qui bloque l'utilisateur
   .step(txt)  change la ligne du dessous sans faire clignoter le voile
   .hide()     ferme (compte les appels imbriqués)
   .inline(el,msg)  remplace le contenu d'un conteneur par une attente légère
   Le réseau allume tout seul le ruban du haut : rien à câbler. */
(function () {
  var veil = document.getElementById('phxVeil');
  var wisp = document.getElementById('phxWisp');
  var msgN = document.getElementById('phxVeilMsg');
  var subN = document.getElementById('phxVeilSub');

  var prof = 0, tShow = null, tMin = 0, tPat = [], reseau = 0, tWisp = null;

  var PATIENCE = [
    [4500,  "C'est un peu plus long que d'habitude. Je continue."],
    [11000, "Le réseau traîne. Rien n'est perdu, j'attends la réponse."],
    [22000, "Toujours rien. Si ça dure, ferme et rouvre l'application."]
  ];

  function armePatience() {
    coupePatience();
    PATIENCE.forEach(function (p) {
      tPat.push(setTimeout(function () { subN.textContent = p[1]; }, p[0]));
    });
  }
  function coupePatience() { tPat.forEach(clearTimeout); tPat = []; }

  function ouvre(msg) {
    msgN.textContent = msg || 'Traitement en cours';
    subN.textContent = '';
    veil.classList.add('on');
    veil.setAttribute('aria-hidden', 'false');
    tMin = Date.now();
    armePatience();
  }
  function ferme() {
    veil.classList.remove('on');
    veil.setAttribute('aria-hidden', 'true');
    subN.textContent = '';
    coupePatience();
  }

  var PHXload = {
    /* Rien ne s'affiche avant 180 ms : une réponse rapide ne doit pas provoquer d'éclair. */
    show: function (msg) {
      prof++;
      if (prof > 1) { if (msg) msgN.textContent = msg; return; }
      clearTimeout(tShow);
      tShow = setTimeout(function () { ouvre(msg); }, 180);
    },
    step: function (txt) { subN.textContent = txt || ''; },
    hide: function () {
      prof = Math.max(0, prof - 1);
      if (prof) return;
      clearTimeout(tShow);
      if (!veil.classList.contains('on')) { coupePatience(); return; }
      /* Une fois visible, on reste 420 ms : mieux vaut une attente franche qu'un clignotement. */
      var reste = Math.max(0, 420 - (Date.now() - tMin));
      setTimeout(ferme, reste);
    },
    raz: function () { prof = 0; clearTimeout(tShow); ferme(); },
    inline: function (el, msg) {
      if (typeof el === 'string') el = document.getElementById(el);
      if (!el) return;
      el.innerHTML = '<div class="phx-inline"><span class="bird phx-bird"></span><span></span></div>';
      el.querySelector('.phx-inline span:last-child').textContent = msg || 'Chargement…';
    }
  };

  /* Le ruban du haut suit le réseau tout seul. Aucun appel existant n'est à modifier. */
  function reseauPlus() {
    reseau++;
    if (reseau === 1) { clearTimeout(tWisp); tWisp = setTimeout(function () { wisp.classList.add('on'); }, 200); }
  }
  function reseauMoins() {
    reseau = Math.max(0, reseau - 1);
    if (!reseau) { clearTimeout(tWisp); wisp.classList.remove('on'); }
  }

  /* Les actions où l'on attend vraiment méritent le voile, et une phrase qui dit
     ce qui se passe. Les autres se contentent du ruban. Le voile est accroché à
     la promesse elle-même : il ne peut donc pas rester ouvert par oubli. */
  var LOURDES = {
    resa_capture:         ['Lecture de la capture', "Je lis l'image et j'en sors les réservations."],
    resa_lot:             ['Ajout des réservations', 'Je vérifie les doublons avant d’écrire.'],
    resa_maj:             ['Enregistrement', null],
    resa_supprimer:       ['Suppression', null],
    resa_statut:          ['Mise à jour', null],
    reservation_manuelle: ['Enregistrement de la réservation', null],
    reserver_public:      ['Envoi de votre réservation', 'Nous vous confirmons par courriel.'],
    club_inscription:     ['Inscription au club', null],
    inscrire:             ['Inscription', null],
    commande:             ['Envoi de la commande', null],
    commande_statut:      ['Mise à jour', null],
    retour:               ['Envoi de votre retour', null],
    avis_reponse:         ['Publication de la réponse', null],
    avis_agent:           ['Rédaction des réponses', 'Cela prend une poignée de secondes.'],
    facture_pdf:          ['Ouverture de la facture', null],
    chat:                 ['Je réfléchis', null]
  };

  function actionDe(args) {
    try {
      var init = args[1];
      if (!init || typeof init.body !== 'string') return null;
      var c = init.body.charAt(0);
      if (c !== '{') return null;
      return JSON.parse(init.body).action || null;
    } catch (e) { return null; }
  }

  if (window.fetch) {
    var brut = window.fetch.bind(window);
    window.fetch = function () {
      var lourd = LOURDES[actionDe(arguments)] || null;
      reseauPlus();
      if (lourd) { PHXload.show(lourd[0]); if (lourd[1]) setTimeout(function(){ PHXload.step(lourd[1]); }, 600); }
      function fini() { reseauMoins(); if (lourd) PHXload.hide(); }
      var p;
      try { p = brut.apply(null, arguments); }
      catch (e) { fini(); throw e; }
      return p.then(function (r) { fini(); return r; },
                    function (e) { fini(); throw e; });
    };
  }

  window.PHX = window.PHX || {};
  window.PHX.load = PHXload;
})();
</script>
