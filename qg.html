var ROOM = new Int16Array(GW*GH).fill(-1), BLOCK = new Uint8Array(GW*GH);
var STATIC = [];   /* meubles, arbres, murs de devant : {d, f} */
var BGT = [];      /* arbres derrière le bâtiment */
var CAFE_SPOTS = [], MEET_SPOTS = [], VISIT = null;
function idx(x,y){ return y*GW+x; }
function inB(x,y){ return x>=0 && y>=0 && x<GW && y<GH; }
function walk(x,y){ return inB(x,y) && !BLOCK[idx(x,y)]; }

POLES.forEach(function(p){
  var x0=p.r[0], y0=p.r[1], w=p.r[2], h=p.r[3];
  p.cx = x0 + w/2; p.cy = y0 + h/2;
  if(!p.open){
    for(var y=y0;y<y0+h;y++) for(var x=x0;x<x0+w;x++) ROOM[idx(x,y)] = p.i;
    var dc = x0 + Math.floor(w/2);
    p.din  = p.door==='S' ? [dc, y0+h-1] : [dc, y0];
    p.dout = p.door==='S' ? [dc, y0+h]   : [dc, y0-1];
  }
});

/* bureaux et décor par pôle */
POLES.forEach(function(p){
  if(p.open || p.meeting) return;
  var x0=p.r[0], y0=p.r[1], w=p.r[2], h=p.r[3];
  var rows = p.door==='S' ? [y0, y0+2] : [y0+2, y0+4];
  var cols = []; for(var c=x0+1; c<x0+w-1; c+=2) cols.push(c);
  if(!cols.length) cols=[x0+1];
  p.desks = [];
  rows.forEach(function(ry){ cols.forEach(function(cx){ p.desks.push([cx, ry]); }); });
  var n = AGENTS.filter(function(a){ return a.p===p.id; }).length;
  var used = Math.min(p.desks.length, n + 1);
  p.desks = p.desks.slice(0, used);
  p.desks.forEach(function(d){ BLOCK[idx(d[0],d[1])] = 1; addStatic(d[0], d[1], 'desk', p); });
  /* emplacements décor : colonnes libres des rangées de bureaux, puis coins côté porte */
  var slots = [];
  rows.forEach(function(ry){ slots.push([x0, ry]); if(cols.indexOf(x0+w-1)<0) slots.push([x0+w-1, ry]); });
  var far = p.door==='S' ? y0+h-1 : y0;
  slots.push([x0, far]); slots.push([x0+w-1, far]);
  (p.props||[]).forEach(function(t, i){
    var s = slots[i]; if(!s) return;
    if(BLOCK[idx(s[0],s[1])]) return;
    if(p.din && s[0]===p.din[0] && s[1]===p.din[1]) return;
    BLOCK[idx(s[0],s[1])] = 1; addStatic(s[0], s[1], t, p);
  });
});

/* murs des pôles */
POLES.forEach(function(p){
  if(p.open) return;
  var x0=p.r[0], y0=p.r[1], w=p.r[2], h=p.r[3], dc=p.din[0];
  for(var x=x0;x<x0+w;x++){
    if(!(p.door==='N' && x===dc)) (function(x){ var a=P(x,y0), b=P(x+1,y0); STATIC.push({d:x+y0+0.02, f:function(g){ wall(g,a,b,p); }}); })(x);
    if(!(p.door==='S' && x===dc)) (function(x){ var a=P(x,y0+h), b=P(x+1,y0+h); STATIC.push({d:x+y0+h+0.05, f:function(g){ wall(g,a,b,p); }}); })(x);
  }
  for(var y=y0;y<y0+h;y++){
    (function(y){ var a=P(x0,y), b=P(x0,y+1); STATIC.push({d:x0+y+0.02, f:function(g){ wall(g,a,b,p); }}); })(y);
    (function(y){ var a=P(x0+w,y), b=P(x0+w,y+1); STATIC.push({d:x0+w+y+0.05, f:function(g){ wall(g,a,b,p); }}); })(y);
  }
  /* réservation de la porte : jamais bloquée */
  BLOCK[idx(p.din[0],p.din[1])] = 0; if(inB(p.dout[0],p.dout[1])) BLOCK[idx(p.dout[0],p.dout[1])] = 0;
});

function addStatic(tx, ty, type, p){
  STATIC.push({d: tx+ty+0.9, tx:tx, ty:ty, f:function(g){ drawProp(g, tx, ty, type, p); }});
}

/* ─── chemin : BFS sur la grille, les murs ne se franchissent que par la porte ─── */
function can(ax,ay,bx,by){
  if(!walk(bx,by)) return false;
  var ra = ROOM[idx(ax,ay)], rb = ROOM[idx(bx,by)];

/* ─── missions ─── */
var inp=document.getElementById('inp');
function route(text){
  var m=text.match(/@([^\s,:]+)/);
  if(m){ var a=AG.filter(function(o){ return norm(o.d.n)===norm(m[1]); })[0]; if(a) return {a:a, p:a.pole, txt:text.replace(m[0],'').trim()||text}; }
  var s=' '+norm(text)+' ', best=null, bs=0;
  Object.keys(ROUTE).forEach(function(k){ var sc=0; ROUTE[k].forEach(function(w){ if(s.indexOf(w)>=0) sc++; }); if(sc>bs){ bs=sc; best=k; } });
  if(!best) return {a:AGM.phenix, p:PM.dir, txt:text};
  return {a:chefOf(PM[best]), p:PM[best], txt:text};
}
function court(t){ return t.length>48 ? t.slice(0,46)+'…' : t; }
function mission(text){
  text=text.trim(); if(!text) return;
  var r=route(text), a=r.a, p=r.p, ph=AGM.phenix, m=r.txt;
  log('📨','Mission : « '+court(m)+' »');
  var reply=null, back=false, failed=null, shown=false;
  setTimeout(function(){ back=true; done(); }, 15000);
  function done(){ if(shown) return; if(back && (reply!==null || failed!==null || !ADMIN)){ shown=true; rapport(a, p, m, reply, failed); } }
  if(ADMIN){
    var ctx='[Mission confiée depuis le QG à '+a.d.n+', '+a.d.r+', pôle '+p.nom+'. Son rôle : '+a.d.job+' Réponds comme cet agent, en français, de façon concrète et courte : ce que tu vas faire et ce que montrent les données.] ';
    fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'chat',code:ADMIN,message:ctx+m,history:[]})})
    .then(function(x){ return x.json(); }).then(function(j){ if(j.ok===false) throw new Error(j.error||'erreur'); reply=j.reply||'(réponse vide)'; log('✅', a.d.n+' a rendu son rapport'); done(); })
    .catch(function(e){ failed=e.message; log('⚠️','Chat IA indisponible : '+e.message); done(); });
  }
  if(a===ph){
    say(ph,'je m\'en occupe moi-même',6); ph.bub.prio=2; focusRoom('dir');
    setTimeout(function(){ back=true; done(); }, 2500); return;
  }
  say(ph,'je confie ça au pôle '+p.nom,6); ph.bub.prio=2; focusRoom('dir');
  a.busy=true; a.path=[]; SEL=null;
  goTo(a, VISIT, function(){
    say(a,'compris, j\'y vais !',3); a.bub.prio=2;
    setTimeout(function(){
      focusRoom(p.id);
      goTo(a, a.seat, function(){
        a.sit=true; a.busy=false; a.timer=14; a.act='au poste · '+court(m);
        say(a,'c\'est parti : '+court(m),9); a.bub.prio=2;
        var mate=AG.filter(function(o){ return o.pole===p && o!==a; })[0];
        if(mate) setTimeout(function(){ say(mate, rnd(mate.d.b), 6); }, 1500);
        log('🏃', a.d.n+' ('+p.nom+') s\'y met');
        back=true; setTimeout(done, 900);
      }, true);
    }, 1100);
  }, true);
}
function rapport(a, p, m, reply, failed){
  var skill = p.skill ? 'Utilise le skill '+p.skill+'. ' : '';
  var brief = skill+'Mission pour '+a.d.n+' ('+a.d.r+', pôle '+p.nom+') : '+m;
  var h='<div class="hd"><canvas width="64" height="96" data-av="'+a.d.id+'"></canvas><div><span class="tag" style="background:'+p.col+'">'+p.ico+' '+esc(p.nom)+'</span><h2>Rapport de '+esc(a.d.n)+'</h2><div class="role">« '+esc(m)+' »</div></div></div>';
  if(reply) h+='<h4>Sa réponse</h4><div class="rep-box">'+esc(reply)+'</div>';
  else {
    h+= failed ? '<h4>Chat IA indisponible</h4><p>'+esc(failed)+'</p>' : '<h4>Mode démo</h4><p>Relie le QG à ton code admin pour qu\'il réponde avec les vraies données du classeur. En attendant, voici ce qu\''+esc(a.d.n)+' va faire :</p>';
    h+='<ul style="margin-top:6px">'+a.d.tk.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('')+'</ul>';
  }
  h+='<h4>Brief prêt pour Claude</h4><div class="mono" id="brief">'+esc(brief)+'</div>';
  h+='<div class="btns"><button class="btn p" data-copy>Copier le brief</button><button class="btn s" data-pole="'+p.id+'">Voir le pôle</button></div>';
  if(!ADMIN) h+='<div class="btns" style="margin-top:8px"><button class="btn s" data-code>Relier au classeur</button></div>';
  open(h); paintAvatars();
}
