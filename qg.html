<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16364A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Le QG — Brasserie Phoenix</title>
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<link rel="manifest" href="qg.webmanifest">
<meta name="apple-mobile-web-app-title" content="QG Phoenix">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#16364A;--copper:#B98D55;--gold:#D4A843;--cream:#F6F0E4;--ink:#16364A;--ink2:#64717a;--line:#ebe3d3;--card:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#16364A;font-family:Jost,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#c:active{cursor:grabbing}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;pointer-events:none;display:flex;flex-direction:column;gap:7px;align-items:center;z-index:5}
.badge{pointer-events:auto;background:rgba(22,54,74,.94);color:var(--cream);border:1px solid rgba(212,168,67,.55);border-radius:13px;padding:6px 16px 7px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.badge h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:25px;line-height:1}
.badge h1 b{color:var(--gold);font-weight:600}
.badge small{display:block;font-size:9px;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold);margin-top:3px}
.stats{pointer-events:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.stat{background:rgba(255,253,248,.93);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.12);border:0;font-family:inherit;cursor:pointer}
.stat b{font-weight:600}
.stat.live{background:var(--navy);color:var(--cream)}
.stat.live b{color:var(--gold)}
.tools{pointer-events:auto;display:flex;gap:5px;overflow-x:auto;max-width:100%;padding:5px 6px;background:rgba(255,253,248,.94);border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.16);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;height:28px;min-width:28px;border-radius:9px;border:1px solid var(--line);background:#fff;font:600 10.5px Jost,sans-serif;display:flex;align-items:center;justify-content:center;padding:0 5px;color:#fff;cursor:pointer;transition:transform .15s}
.tool span{display:flex;align-items:center;justify-content:center;height:20px;min-width:20px;padding:0 4px;border-radius:6px}
.tool.on{outline:2px solid var(--gold);outline-offset:1px;transform:translateY(-1px)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom) + 10px);z-index:5;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.ticker{pointer-events:auto;align-self:center;max-width:100%;background:rgba(22,54,74,.9);color:var(--cream);font-size:11.5px;padding:5px 12px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid rgba(212,168,67,.35)}
.ticker i{font-style:normal;color:var(--gold);margin-right:6px}
.quick{pointer-events:auto;display:flex;gap:6px;justify-content:center}
.q{border:0;background:rgba(255,253,248,.94);border-radius:11px;padding:7px 11px;font:500 12px Jost,sans-serif;color:var(--navy);box-shadow:0 3px 10px rgba(0,0,0,.14);cursor:pointer}
.cmd{pointer-events:auto;display:flex;align-items:center;gap:8px;background:#fffdf8;border-radius:16px;padding:6px 6px 6px 8px;box-shadow:0 10px 30px rgba(0,0,0,.3);border:1px solid var(--line)}
.cmd canvas{width:30px;height:38px;flex:0 0 auto;image-rendering:pixelated}
.cmd .who{font-size:10px;color:var(--ink2);line-height:1.1}
.cmd .who b{display:block;color:var(--navy);font-size:12px}
.cmd input{flex:1;min-width:0;border:0;outline:0;font:400 15px Jost,sans-serif;color:var(--navy);background:transparent;padding:8px 2px;-webkit-user-select:text;user-select:text}
.cmd button{flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:0;background:var(--navy);color:var(--gold);font-size:18px;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(10,24,34,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:84vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.3);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:9;padding:16px 18px calc(env(safe-area-inset-bottom) + 18px);-webkit-user-select:text;user-select:text}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:4px;background:#ddd3c0;margin:-6px auto 10px}
.x{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:0;background:#f1ebde;color:var(--navy);font-size:15px;cursor:pointer}
.hd{display:flex;gap:14px;align-items:flex-start}
.hd canvas{width:64px;height:96px;flex:0 0 auto;image-rendering:pixelated;background:linear-gradient(#f4eee2,#ece3d2);border-radius:12px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:2px 8px;font-size:11px;font-weight:600;color:#fff}
.sheet h2{margin:6px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-size:27px;line-height:1.05;font-weight:600}
.role{color:var(--ink2);font-size:13.5px;margin-top:1px}
.star{display:inline-block;margin-top:5px;background:#fbf0cc;color:#8a6a12;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px}
.rep{font-size:11.5px;color:var(--ink2);margin-top:4px}
.now{display:flex;align-items:center;gap:8px;margin:14px 0 4px;background:#fff;border:1.5px solid #f1dc95;border-radius:12px;padding:8px 11px;font-size:13px}
.now i{width:8px;height:8px;border-radius:50%;background:#3bb273;flex:0 0 auto;box-shadow:0 0 0 3px rgba(59,178,115,.18)}
.sheet h4{margin:15px 0 5px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#8d8577;font-weight:600}
.sheet p{margin:0;font-size:14px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#f3eee3;border-radius:8px;padding:4px 9px;font-size:12.5px}
.chip.t{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line)}
.chip.t u{text-decoration:none;color:#fff;font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px}
.sheet ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5}
.st{display:inline-block;font-size:11.5px;font-weight:600;border-radius:7px;padding:2px 8px;margin-right:6px}
.st-auto{background:#dcf3e6;color:#1d7a47}.st-claude{background:#fbe6dc;color:#a24a24}.st-outil{background:#dde9f6;color:#1f5690}.st-chantier{background:#f1ede6;color:#7d6b4d;border:1px dashed #c9b893}
.team{display:flex;gap:6px;flex-wrap:wrap}
.team canvas{width:34px;height:50px;image-rendering:pixelated;background:#f3eee3;border-radius:9px;cursor:pointer}
.btns{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;border:0;border-radius:13px;padding:13px 10px;font:600 14px Jost,sans-serif;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.p{background:var(--navy);color:var(--cream)}
.btn.s{background:#f1ebde;color:var(--navy)}
.band{height:6px;border-radius:6px;margin:-2px 0 12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.kpi b{display:block;font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1.1}
.kpi small{color:var(--ink2);font-size:11.5px}
.links{display:flex;flex-direction:column;gap:6px}
.lnk{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--navy);text-decoration:none;font-size:14px;font-weight:500}
.lnk small{color:var(--ink2);font-weight:400;font-size:11.5px;display:block}
.lnk em{font-style:normal;color:var(--copper)}
.row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #f0e9db;cursor:pointer}
.row:last-child{border:0}
.row canvas{width:28px;height:42px;image-rendering:pixelated;background:#f3eee3;border-radius:8px;flex:0 0 auto}
.row div{flex:1;min-width:0;font-size:14px}
.row div small{display:block;color:var(--ink2);font-size:12px}
.todo li{margin-bottom:3px}
.rep-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;margin-top:6px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#16364A;color:#f6f0e4;border-radius:12px;padding:12px;white-space:pre-wrap;margin-top:6px}
.grp{margin-top:14px}
.inv{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0e9db;font-size:14px}
.inv a{color:var(--navy)}
.inv small{display:block;color:var(--ink2);font-size:12px}
.jr{font-size:13.5px;padding:6px 0;border-bottom:1px solid #f0e9db;display:flex;gap:9px}
.jr time{color:var(--ink2);font-size:12px;flex:0 0 38px;padding-top:1px}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:500 16px Jost,sans-serif;text-align:center;letter-spacing:3px;margin-top:10px;-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 150px);transform:translate(-50%,-10px);background:var(--navy);color:var(--cream);font-size:13px;padding:8px 14px;border-radius:12px;opacity:0;transition:all .25s;z-index:7;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--gold)}

.lvl{display:inline-block;margin-left:6px;font-family:Jost,sans-serif;font-style:normal;font-size:11px;font-weight:600;background:var(--gold);color:var(--navy);border-radius:7px;padding:1px 6px;vertical-align:4px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:rgba(255,253,248,.97);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.nav button{flex:1;border:0;background:none;font:500 11px Jost,sans-serif;color:#8a8478;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;position:relative;cursor:pointer}
.nav button span{font-size:21px;line-height:1;filter:grayscale(.6);opacity:.75}
.nav button.on{color:var(--navy);font-weight:600}
.nav button.on span{filter:none;opacity:1}
.nav button.scan span{background:var(--navy);border-radius:14px;width:46px;height:34px;display:flex;align-items:center;justify-content:center;filter:none;opacity:1;margin-top:-2px;box-shadow:0 4px 12px rgba(22,54,74,.35)}
.nav i{position:absolute;top:0;left:calc(50% + 8px);background:#d9534f;color:#fff;font-style:normal;font-size:10px;font-weight:600;border-radius:9px;min-width:17px;height:17px;line-height:17px;padding:0 4px;text-align:center}
.dock{bottom:calc(env(safe-area-inset-bottom) + 66px)!important;padding-bottom:6px!important}
body:not(.vue-village) .dock, body:not(.vue-village) .top .stats, body:not(.vue-village) .top .tools{display:none}
.panel{position:fixed;left:0;right:0;top:0;bottom:calc(env(safe-area-inset-bottom) + 62px);background:var(--cream);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 30px;display:none;z-index:6;-webkit-user-select:text;user-select:text}
.panel.on{display:block}
.panel > *{max-width:560px;margin-left:auto;margin-right:auto}
.panel h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:600;margin:0}
.panel .sous{color:var(--ink2);font-size:14px;margin:4px 0 14px;line-height:1.4}
.panel h4{margin:20px auto 7px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#8d8577;font-weight:600}
.panel .note{font-size:12.5px;color:var(--ink2);margin:6px 0 0;line-height:1.4}
.alerte{background:#fff;border:1.5px solid #f1dc95;border-radius:14px;padding:13px;font-size:14px;line-height:1.45;margin-bottom:12px}
.alerte code{background:#f3eee3;padding:1px 5px;border-radius:5px}
.scanbtns{display:flex;gap:10px}
.scanbig{flex:1.4;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--navy);color:var(--cream);border-radius:18px;padding:20px 8px;font-weight:600;font-size:14.5px;cursor:pointer;box-shadow:0 8px 20px rgba(22,54,74,.25)}
.scanbig.s{flex:1;background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
.scanbig span{font-size:32px}
.scanbig input{display:none}
.scanbig.off{opacity:.4;pointer-events:none}
.indice{margin:12px auto 4px}
.indice .chip{border:1px solid var(--line);font:500 12.5px Jost,sans-serif;cursor:pointer;color:var(--navy)}
.indice .chip.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.scan{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.scan-hd{display:flex;gap:11px;align-items:center}
.scan-hd img,.scan-hd .ph{width:48px;height:60px;border-radius:8px;object-fit:cover;background:#f3eee3;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
.scan-hd b{font-size:15px}
.scan-hd small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.warn{background:#fff6dc;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px;color:#7a5a0a}
.lab{display:block;font-size:11.5px;color:var(--ink2);margin-top:9px}
.lab input,.lab select{display:block;width:100%;margin-top:3px;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font:500 15px Jost,sans-serif;color:var(--navy);background:#fffdf8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.calc{font-size:13px;color:var(--ink2);margin-top:8px}
.seg{display:flex;margin-top:12px;background:#f3eee3;border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font:600 14px Jost,sans-serif;color:#8a8478;cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:10px}
.lignes{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.ln{display:grid;grid-template-columns:2.4fr 1fr 1fr;gap:5px}
.ln input{border:1px solid var(--line);border-radius:8px;padding:7px;font:400 13.5px Jost,sans-serif;min-width:0;background:#fffdf8}
.btn.mini{padding:8px 12px;font-size:13px;flex:0 0 auto}
.voir{display:block;margin-top:10px;font-size:12.5px;color:var(--copper)}
.niv{background:var(--navy);color:var(--cream);border-radius:16px;padding:14px}
.niv-l{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.niv b{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold)}
.niv small{font-size:12px;opacity:.85}
.bar{height:8px;background:rgba(255,255,255,.15);border-radius:6px;margin:9px 0 7px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#B98D55,#D4A843);border-radius:6px}
.check{display:flex;flex-direction:column;gap:7px}
.ck{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.ck>i{width:24px;height:24px;border-radius:50%;border:2px solid #d8cdb8;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-weight:700;font-size:13px}
.ck.fait>i{background:#3bb273;border-color:#3bb273}
.ck.fait b{text-decoration:line-through;color:#8a8478}
.ck div{flex:1;min-width:0}
.ck b{font-size:14.5px;font-weight:600}
.ck b em{font-style:normal;font-weight:500;font-size:11px;color:var(--copper);margin-left:4px}
.ck small{display:block;color:var(--ink2);font-size:12.5px}
.outils{display:flex;flex-wrap:wrap;gap:7px}
.tache{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.tache.haute{border-color:#efb3a6;border-left:4px solid #d9534f}
.tache b{display:block;font-size:14.5px;margin-top:4px}
.tache small{display:block;color:var(--ink2);font-size:12.5px}
.t-hd{display:flex;gap:10px;align-items:center}
.t-hd canvas{width:28px;height:42px;image-rendering:pixelated;background:#f3eee3;border-radius:8px}
.tache .btns{margin-top:10px;flex-wrap:wrap}
.evo .enc{margin-top:8px;color:#a8701a}
.carte-g{background:#e6f4ee;border:1px solid #bfe3d1;border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:5px}
.carte-g b{font-size:15px}.carte-g small{font-size:12.5px;color:#3d6b57}
.carte-g .btn{margin-top:6px}
ol.guide{padding-left:20px;font-size:14px;line-height:1.55}
ol.guide li{margin-bottom:8px}
ol.guide code{background:#f3eee3;padding:1px 5px;border-radius:5px;font-size:12.5px}
.toast{z-index:12}
.retour{border:0;background:none;color:var(--copper);font:500 14px Jost,sans-serif;padding:0 0 6px;cursor:pointer}
.cherche{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:400 15px Jost,sans-serif;margin-top:14px;background:#fff;color:var(--navy)}
.mk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee4d2}
.mk-t{flex:1;min-width:0}.mk-t b{display:block;font-size:13.5px;font-weight:600}.mk-t small{display:block;font-size:11.5px;color:var(--ink2)}
.mk-p{text-align:right;font-weight:600;font-size:14px;white-space:nowrap}.mk-p small{display:block;font-weight:400;font-size:11px;color:var(--ink2)}
.mk-q{display:flex;align-items:center;gap:6px}.mk-q button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:17px;color:var(--navy);cursor:pointer}
.mk-q span{min-width:22px;text-align:center;font-weight:600;font-size:13px}
.up{color:#c0392b}.down{color:#1d7a47}
.panier{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 72px);max-width:536px;margin:0 auto;background:var(--navy);color:var(--cream);border-radius:16px;padding:11px 12px 11px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:7}
.panier div{flex:1}.panier b{display:block;font-size:14px}.panier small{font-size:12px;opacity:.85}
.panier .btn{background:var(--gold);color:var(--navy)}
@media (min-width:700px){.dock{max-width:560px;margin:0 auto}}
</style>
</head>
<body class="vue-village">
<canvas id="c" aria-label="Plateau du QG des agents IA de la Brasserie Phoenix"></canvas>

<div class="top">
  <div class="badge"><h1>Le <b>QG</b> Phoenix<span class="lvl" id="lvl" style="display:none"></span></h1><small>· agents IA de la brasserie ·</small></div>
  <div class="stats" id="stats"></div>
  <div class="tools" id="tools"></div>
</div>

<div class="dock">
  <div class="ticker" id="ticker"><i>●</i><span>Le QG ouvre ses portes</span></div>
  <form class="cmd" id="cmd" autocomplete="off">
    <canvas id="ceoMini" width="30" height="38"></canvas>
    <input id="inp" placeholder="Confier une mission à Phénix…" enterkeyhint="send" aria-label="Mission">
    <button type="submit" aria-label="Envoyer">➤</button>
  </form>

  }

  BLOCK[idx(p.din[0],p.din[1])] = 0; if(inB(p.dout[0],p.dout[1])) BLOCK[idx(p.dout[0],p.dout[1])] = 0;

/* ─── chemin : BFS sur la grille, les murs ne se franchissent que par la porte ─── */
function can(ax,ay,bx,by){
  if(!walk(bx,by)) return false;
  var ra = ROOM[idx(ax,ay)], rb = ROOM[idx(bx,by)];
  if(ra===rb) return true;
  if(ra>=0){ var p=POLES[ra]; if(!(ax===p.din[0]&&ay===p.din[1]&&bx===p.dout[0]&&by===p.dout[1])) return false; }
  if(rb>=0){ var q=POLES[rb]; if(!(bx===q.din[0]&&by===q.din[1]&&ax===q.dout[0]&&ay===q.dout[1])) return false; }
  return true;
}
function path(sx,sy,tx,ty){
  if(sx===tx && sy===ty) return [];
  var prev = new Int32Array(GW*GH).fill(-1), q=[idx(sx,sy)], s=idx(sx,sy), t=idx(tx,ty);
  prev[s]=s;
  var D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    var c=q.shift(); if(c===t) break;
    var cx=c%GW, cy=(c-cx)/GW;
    for(var i=0;i<4;i++){
      var nx=cx+D[i][0], ny=cy+D[i][1];
      if(!inB(nx,ny)) continue; var n=idx(nx,ny);
      if(prev[n]>=0) continue;
      if(n!==t && !can(cx,cy,nx,ny)) continue;
      if(n===t && !(ROOM[n]===ROOM[c] || can(cx,cy,nx,ny))) continue;
      prev[n]=c; q.push(n);
    }
  }
  if(prev[t]<0) return null;
  var out=[], k=t; while(k!==s){ out.push([k%GW, (k-k%GW)/GW]); k=prev[k]; }
  return out.reverse();
}

function roomTiles(p){
  var out=[]; for(var y=p.r[1];y<p.r[1]+p.r[3];y++) for(var x=p.r[0];x<p.r[0]+p.r[2];x++) if(walk(x,y)) out.push([x,y]); return out;
}
function nearProp(p){
  var out=[]; STATIC.forEach(function(s){
    if(s.tx==null) return; if(ROOM[idx(s.tx,s.ty)]!==p.i) return;
    [[0,1],[1,0],[-1,0],[0,-1]].forEach(function(o){ var x=s.tx+o[0], y=s.ty+o[1]; if(walk(x,y) && ROOM[idx(x,y)]===p.i) out.push([x,y]); });
  }); return out;
}

function decide(a){
  if(a.busy) return;
  var t = tileOf(a), atSeat = t[0]===a.seat[0] && t[1]===a.seat[1];
  var r = Math.random(), open = restaurantOuvert(), night = (new Date().getHours()<7);
  if(!atSeat){ a.act='retourne au poste'; goTo(a, a.seat, function(){ a.sit=true; a.act='au poste'; a.timer=4+Math.random()*8; }); return; }

  if(r < 0.78 || (!open && r<0.9)){ return toCafe(a); }

  var other = rnd(AG.filter(function(o){ return o.pole!==a.pole && o.pole.id!=='dir'; }));
  if(other){
    var spot = [other.seat[0], other.seat[1]]; var nb=[[1,0],[-1,0],[0,1]].map(function(o){return [spot[0]+o[0],spot[1]+o[1]];}).filter(function(s){return walk(s[0],s[1]) && ROOM[idx(s[0],s[1])]===other.pole.i;});
    if(nb.length){ a.act='passe voir '+other.d.n; goTo(a, rnd(nb), function(){ say(a, 'pour '+other.d.n+' : '+rnd(['le récap de la semaine','une question rapide','les chiffres d\'hier','un dossier à signer']), 4); a.timer=3+Math.random()*3; }); return; }

function prochain(s){

  if(s.k==='h2'){ t.setMinutes(0,0,0); t.setHours(d.getHours() + (d.getHours()%2===0?2:1)); }
  else {
    var best=null, hs=s.hs||[s.h], ds=s.d==null?[0,1,2,3,4,5,6]:[].concat(s.d);
    for(var k=0;k<8;k++) hs.forEach(function(hh){ var c=new Date(d); c.setDate(d.getDate()+k); c.setHours(hh,s.m,0,0); if(c>d && ds.indexOf(c.getDay())>=0 && (!best||c<best)) best=c; });
    t = best || t;
  }
  var J=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  var same = t.toDateString()===d.toDateString();
  return (same?'aujourd\'hui':J[t.getDay()]+' '+t.getDate())+' à '+String(t.getHours()).padStart(2,'0')+'h'+String(t.getMinutes()).padStart(2,'0');
}

var inp=document.getElementById('inp');
function route(text){
  var m=text.match(/@([^\s,:]+)/);
  if(m){ var a=AG.filter(function(o){ return norm(o.d.n)===norm(m[1]); })[0]; if(a) return {a:a, p:a.pole, txt:text.replace(m[0],'').trim()||text}; }
  var s=' '+norm(text)+' ', best=null, bs=0;
  Object.keys(ROUTE).forEach(function(k){ var sc=0; ROUTE[k].forEach(function(w){ if(s.indexOf(w)>=0) sc++; }); if(sc>bs){ bs=sc; best=k; } });
  if(!best) return {a:AGM.phenix, p:PM.dir, txt:text};
  return {a:chefOf(PM[best]), p:PM[best], txt:text};
}
function court(t){ return t.length>48 ? t.slice(0,46)+'…' : t; }
function mission(text){
  text=text.trim(); if(!text) return;
  var r=route(text), a=r.a, p=r.p, ph=AGM.phenix, m=r.txt;
  log('📨','Mission : « '+court(m)+' »');
  var reply=null, back=false, failed=null, shown=false;
  setTimeout(function(){ back=true; done(); }, 15000);
  function done(){ if(shown) return; if(back && (reply!==null || failed!==null || !ADMIN)){ shown=true; rapport(a, p, m, reply, failed); } }
  if(ADMIN){
    var ctx='[Mission confiée depuis le QG à '+a.d.n+', '+a.d.r+', pôle '+p.nom+'. Son rôle : '+a.d.job+' Réponds comme cet agent, en français, de façon concrète et courte : ce que tu vas faire et ce que montrent les données.] ';
    fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'chat',code:ADMIN,message:ctx+m,history:[]})})
    .then(function(x){ return x.json(); }).then(function(j){ if(j.ok===false) throw new Error(j.error||'erreur'); reply=j.reply||'(réponse vide)'; log('✅', a.d.n+' a rendu son rapport'); done(); })
    .catch(function(e){ failed=e.message; log('⚠️','Chat IA indisponible : '+e.message); done(); });
    /* La mission est aussi notée pour de vrai : sans ça, rien ne la réalisait. */
    api({action:'mission_ajout', agent:a.d.n, pole:p.id, texte:m}).then(function(j){ MISSION_OK = j && j.ok ? j.id : false; log(j&&j.ok?'🗂':'⚠️', j&&j.ok ? 'Mission notée pour l\'agent Claude' : 'Mission non notée : '+((j&&j.error)||'?')); });
  }
  if(a===ph){
    say(ph,'je m\'en occupe moi-même',6); ph.bub.prio=2; focusRoom('dir');
    setTimeout(function(){ back=true; done(); }, 2500); return;
  }
  say(ph,'je confie ça au pôle '+p.nom,6); ph.bub.prio=2; focusRoom('dir');
  a.busy=true; a.path=[]; SEL=null;
  goTo(a, VISIT, function(){
    say(a,'compris, j\'y vais !',3); a.bub.prio=2;
    setTimeout(function(){
      focusRoom(p.id);
      goTo(a, a.seat, function(){
        a.sit=true; a.busy=false; a.timer=14; a.act='au poste · '+court(m);
        say(a,'c\'est parti : '+court(m),9); a.bub.prio=2;
        var mate=AG.filter(function(o){ return o.pole===p && o!==a; })[0];
        if(mate) setTimeout(function(){ say(mate, rnd(mate.d.b), 6); }, 1500);
        log('🏃', a.d.n+' ('+p.nom+') s\'y met');
        back=true; setTimeout(done, 900);
      }, true);
    }, 1100);
  }, true);
}

function rapport(a, p, m, reply, failed){
  var skill = p.skill ? 'Utilise le skill '+p.skill+'. ' : '';

function lireFichier(file, brut){
  return new Promise(function(res, rej){
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('fichier illisible')); };
    if(brut){ if(file.size>9e6) return rej(new Error('PDF trop lourd (9 Mo max)')); fr.onload=function(){ res(String(fr.result).split(',')[1]); }; fr.readAsDataURL(file); return; }
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){ rej(new Error('ce fichier n\'est pas une image')); };
      img.onload=function(){
        var max=1700, w=img.width, h=img.height; if(Math.max(w,h)>max){ var k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
        var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',.82).split(',')[1]);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Une ligne « ABADIA DEL ROBLE BLANCO 3/4 * 12 », 2 unités = 2 caisses de 12 :
   24 bouteilles entrent en stock, pas 2. Le contenu du colis vient de la
   lecture (par_colis) ou, à défaut, du libellé. */
function parColis(nom){
  var s = String(nom||'');
  var m = s.match(/(?<![\/\d.,])(\d{1,2})\s*[*x×]\s*(\d{1,2})(?![\d.,]|\s*(?:ml|cl|l|g|gr|kg)\b)/i);
  if(m) return (+m[1]) * (+m[2]);
  m = s.match(/(?<![\/\d.,])(\d{1,3})\s*[*x×]\s*\d+(?:[.,]\d+)?\s*(?:ml|cl|l|g|gr|kg)\b/i);
  if(m && +m[1] > 1) return +m[1];
  m = s.match(/(?:[*x×]\s*|\bC\/\s*|\b(?:caja|cja|pack|carton)\s*(?:de\s*)?)(\d{1,3})(?![\d.,])(?!\s*(?:ml|cl|l|g|gr|kg)\b)/i);
  var n = m ? +m[1] : 1; return n > 1 && n <= 144 ? n : 1;
}
function ligneEnUnites(x){
  var q = num(v(x,'quantite')), pc = num(v(x,'par_colis')), co = num(v(x,'colis'));
  if(pc > 1 && co > 0) return { q: co * pc, colis: co, pc: pc, u: 'bouteille / u' };
  if(pc > 1) return { q: q, colis: q / pc, pc: pc, u: v(x,'unite') };
  var n = parColis(v(x,'produit'));
  if(n > 1 && q > 0 && q < n * 10) return { q: q * n, colis: q, pc: n, u: 'bouteille / u' };
  return { q: v(x,'quantite'), colis: 0, pc: 1, u: v(x,'unite') };
}

      + (e.pc > 1 ? '<p class="note" style="margin:-4px 0 8px">'+String(e.colis).replace('.',',')+' colis × '+e.pc+' = <b>'+String(e.q).replace('.',',')+'</b> — corrige si besoin</p>' : ''); }).join('')+'</div>';

/* ─── croissance : le décor du village suit son niveau ─── */
var CHANTIERS = [];
var DECOR = (function(){
  var out=[], s=91; function r(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }
  for(var i=0;i<60;i++){
    var side=Math.floor(r()*2), tx, ty;
    if(side===0){ tx=-2.2+r()*35; ty=GH+.3+r()*2.2; } else { tx=GW+.3+r()*2.2; ty=-2+r()*27; }
    out.push({tx:tx, ty:ty, k:Math.floor(r()*4)});
  }
  return out;
})();
function drawCroissance(){
  var n = VILLAGE && VILLAGE.niveau ? Math.min(DECOR.length, VILLAGE.niveau.niveau*6) : 0;
  for(var i=0;i<n;i++){
    var o=DECOR[i], p=P(o.tx,o.ty);
    if(o.k===0){ ['#f4d35e','#ee6c4d','#ffffff'].forEach(function(c,j){ blob(p[0]+j*4-4,p[1]-2+(j%2)*2,2.2,c); }); }
    else if(o.k===1){ g.fillStyle='#3a3a3a'; g.fillRect(p[0]-1,p[1]-22,2,22); blob(p[0],p[1]-23,3.2, (new Date().getHours()>=19||new Date().getHours()<7)?'#ffe08a':'#e9e2cf'); }
    else if(o.k===2){ blob(p[0],p[1]-4,5,'#5aa84a'); blob(p[0]+3,p[1]-6,3,'#e05a7a'); }
    else { box(o.tx,o.ty,.5,.25,5,0,'#c9a27a','#a77c52','#8d6641'); }
  }
}
function drawChantiers(){
  CHANTIERS.slice(0,6).forEach(function(c,i){
    var p=PM[c.pole]||PM.dir, x=p.r[0]+p.r[2]-0.6, y=p.r[1]-0.6+(p.door==='S'?0:0), q=P(x,y);
    g.strokeStyle='#e0a030'; g.lineWidth=2;
    g.beginPath(); g.moveTo(q[0],q[1]); g.lineTo(q[0],q[1]-46); g.lineTo(q[0]+26,q[1]-46); g.stroke();
    g.beginPath(); g.moveTo(q[0]+20,q[1]-46); g.lineTo(q[0]+20,q[1]-30+Math.sin(performance.now()/500+i)*4); g.stroke();
    g.fillStyle='#e0a030'; g.fillRect(q[0]+16,q[1]-30+Math.sin(performance.now()/500+i)*4,8,5);
  });
}
