<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16364A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phoenix Salle">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; form-action 'none'; base-uri 'none'; object-src 'none'">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Phoenix — Salle</title>
<style>
:root{
  --navy:#16364A; --nuit:#0B1E2C; --carte:rgba(27,63,85,.5);
  --cuivre:#B98D55; --dore:#D4A843; --creme:#F6F0E4;
  --ink:var(--creme); --ink2:rgba(246,240,228,.62); --ink3:rgba(246,240,228,.4);
  --ok:#7FA37A; --alerte:#C4633F;
  --fil:rgba(185,141,85,.3); --fil2:rgba(185,141,85,.15);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--nuit);color:var(--ink);font-family:var(--sans);font-weight:300;
  padding-bottom:40px;
  background-image:radial-gradient(900px 420px at 50% -10%, rgba(27,63,85,.55), transparent 70%)}
header{padding:calc(20px + env(safe-area-inset-top)) 18px 8px;text-align:center}
h1{font-family:var(--serif);font-weight:400;font-size:23px;margin:0}
h1 span{color:var(--dore)}
.sous{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.12em;
  text-transform:uppercase;margin-top:5px}
main{padding:12px 18px 0;max-width:560px;margin:0 auto}
.carte{background:var(--carte);border:1px solid var(--fil2);border-radius:18px;
  padding:18px;margin-bottom:13px}
.etiq{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--cuivre);display:flex;align-items:center;gap:10px;margin-bottom:14px}
.etiq::after{content:"";flex:1;height:1px;background:var(--fil2)}
label{display:block;font-size:12px;color:var(--ink3);margin:12px 0 5px}
input{width:100%;background:rgba(27,63,85,.6);border:1px solid var(--fil2);border-radius:12px;
  padding:13px;color:var(--ink);font-family:var(--sans);font-size:16px}
input:focus{outline:2px solid var(--dore);outline-offset:-1px}
input.code{font-family:var(--mono);text-align:center;letter-spacing:.3em;font-size:24px;
  text-transform:uppercase}
button.plein{width:100%;background:var(--dore);color:var(--navy);border:0;border-radius:13px;
  padding:15px;font-family:var(--sans);font-size:16px;font-weight:500;cursor:pointer;margin-top:16px}
button.plein.sobre{background:transparent;border:1px solid var(--fil);color:var(--ink2);font-weight:400}
button.plein:disabled{opacity:.45;cursor:default}
button.vide{background:transparent;border:1px solid var(--fil2);color:var(--ink3);
  border-radius:11px;padding:9px 14px;font-family:var(--sans);font-size:13px;cursor:pointer}
.msg{font-size:13.5px;margin-top:12px;min-height:19px;line-height:1.5}
.msg.err{color:var(--alerte)} .msg.ok{color:var(--ok)}
.trouve{text-align:center}
.trouve .nom{font-family:var(--serif);font-size:27px;margin:2px 0 4px}
.trouve .n{font-size:12.5px;color:var(--ink3)}
.trouve .promo{margin-top:16px;padding:15px;border-radius:14px;
  background:rgba(212,168,67,.12);border:1px solid var(--fil)}
.trouve .promo b{display:block;font-family:var(--serif);font-size:20px;margin-bottom:6px}
.trouve .promo span{font-family:var(--mono);font-size:12px;color:var(--dore);letter-spacing:.1em}
.trouve .rien{margin-top:16px;color:var(--ink3);font-size:14px;line-height:1.6}
.tire{text-align:center;padding:6px 0}
.tire .quoi{font-family:var(--serif);font-size:26px;line-height:1.3;margin:10px 0 12px;color:var(--dore)}
.tire .code{display:inline-block;font-family:var(--mono);font-size:19px;letter-spacing:.16em;
  color:var(--nuit);background:var(--dore);padding:10px 18px;border-radius:11px;font-weight:500}
.tire .dire{margin-top:18px;padding-top:15px;border-top:1px solid var(--fil2);
  font-size:14px;line-height:1.6;color:var(--ink2)}
</style>
</head>
<body>

<header>
  <h1>Phoenix <span>Salle</span></h1>
  <div class="sous" id="sous">Fin de repas</div>
</header>

<main id="corps"></main>

<script>
(function(){
'use strict';
var API = 'https://script.google.com/macros/s/AKfycbw4M6kbboHLRlj84PoO3CdrxcuxKKxlpq-CWph5V3meq4pwISTZ8PZJIK5cCerTxD0PLQ/exec';
var STAFF = { employe:'', code:'' };
try {
  var b = JSON.parse(localStorage.getItem('phx_salle')||'null');
  if(b && b.code) STAFF = b;
}catch(e){}

function el(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function corps(h){ el('corps').innerHTML = h; }

function appel(charge){
  charge.employe = STAFF.employe; charge.code_staff = STAFF.code;
  return fetch(API, { method:'POST', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(charge) })
   .then(function(r){ return r.text(); })
   .then(function(t){ var j=null; try{ j=JSON.parse(t); }catch(e){} return j; });
}

/* ─── qui tient le poste ───────────────────────────────────────── */
function vueEquipe(err){
  el('sous').textContent = 'Accès équipe';
  corps('<div class="carte">'
    + '<div class="etiq">Qui es-tu ?</div>'
    + '<label for="pn">Ton prénom</label>'
    + '<input id="pn" type="text" autocomplete="off" value="'+esc(STAFF.employe||'')+'">'
    + '<label for="cd">Ton code</label>'
    + '<input id="cd" type="password" inputmode="numeric" autocomplete="off">'
    + '<button class="plein" id="go">Entrer</button>'
    + '<div class="msg err" id="msg">'+esc(err||'')+'</div>'
    + '</div>');
  el('go').onclick = function(){
    var p = el('pn').value.trim(), c = el('cd').value.trim();
    if(!c){ el('msg').textContent = 'Il faut ton code.'; return; }
    el('go').disabled = true;
    STAFF = { employe:p, code:c };
    /* on essaie un code volontairement faux : la réponse dit si l'accès
       est bon sans rien révéler d'un vrai client */
    appel({ action:'salle_cherche', code:'ZZZZZZ' }).then(function(j){
      el('go').disabled = false;
      if(j && j.error === 'code invalide'){
        STAFF = { employe:'', code:'' };
        el('msg').textContent = 'Code refusé.'; return;
      }
      try{ localStorage.setItem('phx_salle', JSON.stringify(STAFF)); }catch(e){}
      vueSaisie();
    });
  };
  el('cd').addEventListener('keydown', function(ev){ if(ev.key==='Enter') el('go').click(); });
}

/* ─── le code du client ────────────────────────────────────────── */
function vueSaisie(info){
  el('sous').textContent = STAFF.employe ? ('Poste : ' + STAFF.employe) : 'Fin de repas';
  corps('<div class="carte">'
    + '<div class="etiq">Le code du client</div>'
    + '<input id="cd" class="code" type="text" autocomplete="off" maxlength="10" placeholder="······">'
    + '<button class="plein" id="go">Chercher</button>'
    + '<div class="msg" id="msg">'+(info||'')+'</div>'
    + '<div style="font-size:12px;color:var(--ink3);line-height:1.6;margin-top:14px">'
    + 'Son code personnel (six lettres) ou le code de sa promotion (PHX-····). '
    + 'Les deux marchent.</div>'
    + '</div>'
    + '<div style="text-align:center"><button class="vide" id="sortir">Changer de poste</button></div>');
  el('cd').focus();
  el('sortir').onclick = function(){
    try{ localStorage.removeItem('phx_salle'); }catch(e){}
    STAFF = { employe:'', code:'' }; vueEquipe();
  };
  el('cd').addEventListener('keydown', function(ev){ if(ev.key==='Enter') el('go').click(); });
  el('go').onclick = function(){
    var c = el('cd').value.trim().toUpperCase();
    if(c.length < 4){ el('msg').className='msg err'; el('msg').textContent='Code trop court.'; return; }
    el('go').disabled = true; el('msg').className='msg'; el('msg').textContent='…';
    appel({ action:'salle_cherche', code:c }).then(function(j){
      el('go').disabled = false;
      if(!j){ el('msg').className='msg err'; el('msg').textContent='Pas de réseau.'; return; }
      if(j.error === 'code invalide') return vueEquipe('Ton code n\'est plus bon.');
      if(!j.ok){ el('msg').className='msg err';
        el('msg').textContent = 'Aucun client avec ce code.'; return; }
      vueClient(c, j);
    });
  };
}

/* ─── ce qu'on voit avant de valider ───────────────────────────── */
function vueClient(code, j){
  var h = '<div class="carte trouve">'
    + '<div class="etiq" style="justify-content:center">Le client</div>'
    + '<div class="nom">'+esc(j.prenom || 'Sans prénom')+'</div>'
    + '<div class="n">'+(j.passages||0)+(j.passages>1?' passages':' passage')+' à ce jour</div>';
  if(j.promo){
    h += '<div class="promo"><b>'+esc(j.promo.libelle)+'</b>'
      + '<span>'+esc(j.promo.code)+'</span></div>';
  } else {
    h += '<div class="rien">Aucune promotion en cours.</div>';
  }
  h += '</div>';

  if(j.promo){
    h += '<div class="carte">'
      + '<div class="etiq">La promotion a-t-elle servi ?</div>'
      + '<button class="plein" id="oui">Oui — elle a été appliquée</button>'
      + '<button class="plein sobre" id="non">Non — il la garde pour la prochaine fois</button>'
      + '<div class="msg" id="msg"></div></div>';
  } else {
    h += '<div class="carte">'
      + '<button class="plein" id="non">Compter le passage et tirer sa promotion</button>'
      + '<div class="msg" id="msg"></div></div>';
  }
  h += '<div style="text-align:center"><button class="vide" id="annuler">Annuler</button></div>';
  corps(h);

  el('annuler').onclick = function(){ vueSaisie(); };
  function valide(utilisee){
    ['oui','non'].forEach(function(i){ if(el(i)) el(i).disabled = true; });
    el('msg').className='msg'; el('msg').textContent='…';
    appel({ action:'salle_passage', code:code, utilisee:!!utilisee }).then(function(r){
      if(!r || !r.ok){
        ['oui','non'].forEach(function(i){ if(el(i)) el(i).disabled = false; });
        el('msg').className='msg err';
        el('msg').textContent = (r && r.error) ? r.error : 'Un souci. Réessaie.';
        return;
      }
      vueFini(r.resume);
    });
  }
  if(el('oui')) el('oui').onclick = function(){ valide(true); };
  if(el('non')) el('non').onclick = function(){ valide(false); };
}

/* ─── ce qu'on annonce au client ───────────────────────────────── */
function vueFini(r){
  el('sous').textContent = 'C\'est noté';
  var h = '<div class="carte tire">'
    + '<div class="etiq" style="justify-content:center">'
    + (r.promoSuivante ? 'Sa prochaine visite' : 'Passage enregistré') + '</div>';

  if(r.promoUtilisee){
    h += '<div style="font-size:13px;color:var(--ok);margin-bottom:6px">'
      + '« '+esc(r.promoUtilisee)+' » a été appliquée.</div>';
  }
  if(r.promoSuivante){
    h += '<div class="quoi">'+esc(r.promoSuivante.libelle)+'</div>'
      + '<div class="code">'+esc(r.promoSuivante.code)+'</div>'
      + (r.promoSuivante.conditions
        ? '<div style="font-size:12px;color:var(--ink3);margin-top:10px">'+esc(r.promoSuivante.conditions)+'</div>' : '')
      + '<div class="dire">Dis-le-lui : c\'est déjà dans son espace, '
      + 'et c\'est valable jusqu\'au '+esc(r.promoSuivante.expire)+'.</div>';
  } else if(r.promoEnAttente){
    h += '<div class="quoi" style="font-size:20px">Il garde<br>« '+esc(r.promoEnAttente)+' »</div>'
      + '<div class="dire">Rien de nouveau tiré : on ne les empile pas.</div>';
  } else {
    h += '<div class="quoi" style="font-size:20px">Passage compté</div>';
  }
  h += '<div style="font-size:12px;color:var(--ink3);margin-top:14px">'
    + esc(r.prenom||'') + ' · ' + (r.passages||0) + (r.passages>1?' passages':' passage') + '</div>'
    + '</div>'
    + '<button class="plein" id="suivant">Client suivant</button>';
  corps(h);
  el('suivant').onclick = function(){ vueSaisie(); };
}

if(STAFF.code) vueSaisie(); else vueEquipe();
})();
</script>
</body>
</html>
