@keyframes lueur{0%,100%{background-position:50% 0%}50%{background-position:50% 100%}}

header{padding:calc(26px + env(safe-area-inset-top)) 20px 6px;text-align:center}
h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:12px 0 0;letter-spacing:.02em}
h1 span{color:var(--dore)}
.sous{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.14em;
  text-transform:uppercase;margin-top:6px}
main{padding:14px 18px 0;max-width:640px;margin:0 auto}

.carte{background:var(--carte);border:1px solid var(--fil2);border-radius:20px;
  padding:20px;margin-bottom:14px;backdrop-filter:blur(6px)}
.etiq{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--cuivre);display:flex;align-items:center;gap:10px;margin-bottom:15px}
.etiq::after{content:"";flex:1;height:1px;background:var(--fil2)}

/* la promotion : c'est elle qu'on vient voir */
.promo{background:linear-gradient(150deg,rgba(212,168,67,.16),rgba(185,141,85,.06));
  border:1px solid var(--fil);text-align:center;position:relative;overflow:hidden}
.promo .lib{font-family:var(--serif);font-size:25px;line-height:1.24;margin:4px 0 14px;
  color:var(--creme)}
.promo .code{display:inline-block;font-family:var(--mono);font-size:21px;letter-spacing:.16em;
  color:var(--nuit);background:var(--dore);padding:11px 20px;border-radius:12px;font-weight:500}
.promo .cond{font-size:12px;color:var(--ink2);margin-top:13px;line-height:1.5}
.promo .exp{font-size:11px;color:var(--ink3);margin-top:7px;font-family:var(--mono)}
.promo.attente{background:linear-gradient(150deg,rgba(185,141,85,.13),rgba(27,63,85,.05))}
.promo.attente .lib{color:var(--ink2);font-size:21px}
.attente-t{display:inline-block;font-family:var(--mono);font-size:14px;letter-spacing:.06em;
  color:var(--dore);border:1px dashed var(--fil);border-radius:11px;padding:9px 16px;margin-bottom:4px}

.post{padding:15px 0;border-top:1px solid var(--fil2)}
.post:first-of-type{border-top:0;padding-top:0}
.post img{width:100%;border-radius:13px;display:block;margin-bottom:10px}
.post p{font-size:14px;line-height:1.55;color:var(--ink2);margin:6px 0 0}
.post a{display:inline-block;margin-top:9px;font-size:12.5px;color:var(--cuivre);text-decoration:none;
  border-bottom:1px solid rgba(185,141,85,.35)}
.post .quand{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em;
  text-transform:capitalize}
.promo.vide .lib{font-size:19px;color:var(--ink2);font-family:var(--sans);font-weight:300}

.perso{text-align:center}
.perso .code{display:inline-block;font-family:var(--mono);font-size:27px;letter-spacing:.28em;
  color:var(--dore);border:1px dashed var(--fil);border-radius:14px;padding:15px 12px 15px 22px;
  margin:2px 0 12px}
.perso p{font-size:12.5px;color:var(--ink2);margin:0;line-height:1.55}

.annonce{padding:14px 0;border-top:1px solid var(--fil2)}
.annonce:first-of-type{border-top:0;padding-top:0}
.annonce h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 5px}
.annonce .quand{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em}
.annonce p{font-size:14px;line-height:1.55;color:var(--ink2);margin:7px 0 0}
.excl{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;background:rgba(212,168,67,.18);color:var(--dore);
  padding:2px 7px;border-radius:20px;margin-left:7px;vertical-align:2px}

label{display:block;font-size:12px;color:var(--ink3);margin:13px 0 5px;letter-spacing:.03em}
input{width:100%;background:rgba(27,63,85,.6);border:1px solid var(--fil2);border-radius:12px;
  padding:13px;color:var(--ink);font-family:var(--sans);font-size:16px}
input:focus{outline:2px solid var(--dore);outline-offset:-1px;border-color:transparent}
input.mono{font-family:var(--mono);text-align:center;letter-spacing:.4em;font-size:22px}
.duo{display:flex;gap:10px}
.duo>div{flex:1}
button.plein{width:100%;background:var(--dore);color:var(--navy);border:0;border-radius:13px;
  padding:14px;font-family:var(--sans);font-size:15.5px;font-weight:500;cursor:pointer;margin-top:18px}
button.plein:disabled{opacity:.45;cursor:default}
button.vide{background:transparent;border:1px solid var(--fil2);color:var(--ink2);
  border-radius:11px;padding:9px 14px;font-family:var(--sans);font-size:13px;cursor:pointer}
button.danger{color:var(--alerte);border-color:rgba(196,99,63,.35)}
.msg{font-size:13px;margin-top:12px;min-height:19px;line-height:1.5}
.msg.err{color:var(--alerte)} .msg.ok{color:var(--ok)}
.cgu{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-top:16px}
.cgu a{color:var(--cuivre)}
.coche{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:12.5px;
  color:var(--ink2);line-height:1.5}
.coche input{width:19px;height:19px;flex:none;margin-top:1px;accent-color:var(--dore)}
.pied{text-align:center;font-size:11px;color:var(--ink3);margin:22px 0 0;line-height:1.7}
.pied a{color:var(--cuivre);text-decoration:none}
.chargement{text-align:center;color:var(--ink3);padding:34px 0;font-size:14px}
.vide-txt{color:var(--ink3);font-size:13.5px;line-height:1.6;text-align:center;padding:8px 0}
</style>
</head>

try { JETON = localStorage.getItem('phx_client') || null; } catch(e){}

function el(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function corps(h){ el('corps').innerHTML = h; }

function appel(charge){
  return fetch(API, { method:'POST', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(charge) })
   .then(function(r){ return r.text(); })
   .then(function(t){ var j=null; try{ j=JSON.parse(t); }catch(e){} return j; });
}

var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août',
  'septembre','octobre','novembre','décembre'];

/* ─── 1. l'email ────────────────────────────────────────────────── */
function vueEmail(pre){
  el('sous').textContent = 'Votre espace';
  corps('<div class="carte">'
    + '<div class="etiq">Entrer</div>'
    + '<p style="font-size:14px;line-height:1.6;color:var(--ink2);margin:0 0 4px">'
    + 'Votre adresse, et vous recevez un code à six chiffres. '
    + 'Pas de mot de passe à retenir.</p>'
    + '<label for="em">Votre email</label>'
    + '<input id="em" type="email" inputmode="email" autocomplete="email" placeholder="vous@exemple.com" value="'+esc(pre||'')+'">'
    + '<button class="plein" id="go">Recevoir mon code</button>'
    + '<div class="msg" id="msg"></div>'
    + '<div class="cgu">Nous conservons votre prénom, votre email, votre téléphone et '
    + 'le jour de votre anniversaire — rien d\'autre, jamais votre adresse. '
    + 'Vous pouvez tout effacer d\'un bouton depuis votre espace.</div>'
    + '</div>');

  el('go').onclick = function(){
    var e = el('em').value.trim();
    if(!/^[^@\s]+@[^@\s.]+\.[^@\s]{2,}$/.test(e)){
      el('msg').className='msg err'; el('msg').textContent='Cette adresse ne semble pas valide.'; return;
    }
    el('go').disabled = true; el('msg').className='msg'; el('msg').textContent='Envoi…';
    appel({ action:'client_code', email:e }).then(function(j){
      el('go').disabled = false;
      if(j && j.ok) return vueCode(e);
      el('msg').className='msg err';
      el('msg').textContent = (j && j.error === 'trop tot')
        ? 'Un code vient de partir. Regardez vos mails, ou réessayez dans une minute.'
        : 'Envoi impossible pour le moment. Réessayez dans un instant.';
    });
  };
  el('em').addEventListener('keydown', function(ev){ if(ev.key==='Enter') el('go').click(); });
}

/* ─── 2. le code ────────────────────────────────────────────────── */
function vueCode(email){
  corps('<div class="carte">'
    + '<div class="etiq">Votre code</div>'
    + '<p style="font-size:14px;line-height:1.6;color:var(--ink2);margin:0">'
    + 'Envoyé à <b style="color:var(--ink)">'+esc(email)+'</b>. Il vit dix minutes.</p>'
    + '<label for="cd">Les six chiffres</label>'
    + '<input id="cd" class="mono" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">'
    + '<button class="plein" id="go">Entrer</button>'
    + '<div class="msg" id="msg"></div>'
    + '<div style="text-align:center;margin-top:14px">'
    + '<button class="vide" id="retour">Changer d\'adresse</button></div>'
    + '</div>');

  el('cd').focus();
  el('retour').onclick = function(){ vueEmail(email); };
  el('cd').addEventListener('input', function(){
    el('cd').value = el('cd').value.replace(/\D/g,'').slice(0,6);
    if(el('cd').value.length === 6) el('go').click();
  });
  el('cd').addEventListener('keydown', function(ev){ if(ev.key==='Enter') el('go').click(); });

  el('go').onclick = function(){
    var c = el('cd').value.trim();
    if(c.length !== 6) return;
    el('go').disabled = true; el('msg').className='msg'; el('msg').textContent='…';
    appel({ action:'client_verifie', email:email, code:c }).then(function(j){
      el('go').disabled = false;
      if(j && j.ok){
        JETON = j.jeton;
        try{ localStorage.setItem('phx_client', JETON); }catch(e){}
        FICHE = j.fiche;
        if(j.nouveau || !FICHE.prenom) return vueInscription(email);
        return charge();
      }
      el('msg').className='msg err';
      el('msg').textContent = (j && j.error === 'code expire')
        ? 'Ce code a expiré. Demandez-en un nouveau.'
        : 'Code incorrect.' + (j && j.restant ? ' Encore ' + j.restant + ' essai(s).' : '');
      el('cd').value = ''; el('cd').focus();
    });
  };
}

/* ─── 3. la fiche, à la première venue ─────────────────────────── */
function vueInscription(email){
  el('sous').textContent = 'Bienvenue';
  var opts = '<option value="">—</option>';
  for(var m=1;m<=12;m++) opts += '<option value="'+m+'">'+MOIS[m-1]+'</option>';
  corps('<div class="carte">'
    + '<div class="etiq">Faisons connaissance</div>'
    + '<label for="pr">Votre prénom</label>'
    + '<input id="pr" type="text" autocomplete="given-name" maxlength="40">'
    + '<label for="tel">Votre téléphone <span style="color:var(--ink3)">(facultatif)</span></label>'
    + '<input id="tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="25">'
    + '<label>Votre anniversaire <span style="color:var(--ink3)">(facultatif — le jour et le mois, pas l\'année)</span></label>'
    + '<div class="duo"><div><input id="jr" type="number" inputmode="numeric" min="1" max="31" placeholder="jour"></div>'
    + '<div><select id="mo" style="width:100%;background:rgba(27,63,85,.6);border:1px solid var(--fil2);'
    + 'border-radius:12px;padding:13px;color:var(--ink);font-family:var(--sans);font-size:16px">'+opts+'</select></div></div>'
    + '<label class="coche"><input type="checkbox" id="cs">'
    + '<span>J\'accepte de recevoir les annonces et les promotions de la Brasserie Phoenix. '
    + 'Je peux effacer mon compte quand je veux.</span></label>'
    + '<button class="plein" id="go">C\'est parti</button>'
    + '<div class="msg" id="msg"></div>'
    + '</div>');
  el('pr').focus();
  el('go').onclick = function(){
    var p = el('pr').value.trim();
    if(p.length < 2){ el('msg').className='msg err'; el('msg').textContent='Votre prénom, simplement.'; return; }
    if(!el('cs').checked){ el('msg').className='msg err'; el('msg').textContent='Il nous faut votre accord pour vous écrire.'; return; }
    el('go').disabled = true;
    appel({ action:'client_maj', jeton:JETON, prenom:p, telephone:el('tel').value.trim(),
            jour:el('jr').value, mois:el('mo').value })
     .then(function(j){
       el('go').disabled = false;
       if(j && j.ok){ FICHE = j.fiche; return charge(); }
       el('msg').className='msg err'; el('msg').textContent='Un souci. Réessayez.';
     });
  };
}

/* ─── 4. l'espace ──────────────────────────────────────────────── */
function vueEspace(){
  var f = FICHE || {};
  el('sous').textContent = f.prenom ? ('Bonjour ' + f.prenom) : 'Votre espace';
  var h = '';

  /* la promotion : utilisable, en attente, ou rien */
  if(f.promo && f.promo.etat === 'utilisable'){
    h += '<div class="carte promo">'
      + '<div class="etiq" style="justify-content:center">Votre promotion</div>'
      + '<div class="lib">'+esc(f.promo.libelle)+'</div>'
      + '<div class="code">'+esc(f.promo.code)+'</div>'
      + '<div class="cond">Montrez ce code à votre serveur avant de demander l\'addition.</div>'
      + (f.promo.expire ? '<div class="exp">valable jusqu\'au '+esc(f.promo.expire)
          + (f.promo.joursRestants ? ' · ' + f.promo.joursRestants
              + (f.promo.joursRestants>1?' jours restants':' jour restant') : '')
          + '</div>' : '')
      + '</div>';
  } else if(f.promo){
    /* Tirée il y a moins de vingt-quatre heures. On ne la cache pas —
       c'est justement l'attente qui donne envie de revenir — mais on
       dit clairement qu'elle n'est pas encore à prendre. */
    h += '<div class="carte promo attente">'
      + '<div class="etiq" style="justify-content:center">Bientôt à vous</div>'
      + '<div class="lib">'+esc(f.promo.libelle)+'</div>'
      + '<div class="attente-t">'
      + (f.promo.heuresAvant > 1 ? 'Utilisable dans ' + f.promo.heuresAvant + ' heures'
                                 : 'Utilisable dans moins d\'une heure')
      + '</div>'
      + '<div class="cond">Elle vient d\'être tirée : elle s\'ouvre 24 heures après votre visite, '
      + 'et vous avez un mois pour en profiter.</div>'
      + (f.promo.expire ? '<div class="exp">jusqu\'au '+esc(f.promo.expire)+'</div>' : '')
      + '</div>';
  } else {
    h += '<div class="carte promo vide">'
      + '<div class="etiq" style="justify-content:center">Votre promotion</div>'
      + '<div class="lib">'
      + (f.passages ? 'Rien en ce moment.<br>Une nouvelle vous attend à votre prochaine visite.'
                    : 'Votre première promotion vous sera tirée<br>lors de votre premier passage.')
      + '</div></div>';
  }

  /* le code personnel */
  h += '<div class="carte perso">'
    + '<div class="etiq" style="justify-content:center">Votre code</div>'
    + '<div class="code">'+esc(f.codePerso||'—')+'</div>'
    + '<p>À donner en fin de repas. C\'est lui qui compte votre passage '
    + 'et qui tire la promotion de la prochaine fois.</p>'
    + (f.passages ? '<p style="margin-top:10px;color:var(--ink3)">'+f.passages
        + (f.passages>1?' passages':' passage')
        + (f.dernierPassage ? ' · dernier le '+esc(f.dernierPassage) : '')+'</p>' : '')
    + '</div>';

  /* les publications des réseaux */
  if(RESEAUX.length){
    h += '<div class="carte"><div class="etiq">Sur nos réseaux</div>';
    RESEAUX.slice(0,6).forEach(function(r){
      h += '<div class="post">'
        + (r.image ? '<img src="'+esc(r.image)+'" alt="" loading="lazy">' : '')
        + '<div class="quand">'+esc(r.date)+' · '+esc(r.reseau)+'</div>'
        + (r.texte ? '<p>'+esc(r.texte).replace(/\n/g,'<br>')+'</p>' : '')
        + (r.lien ? '<a href="'+esc(r.lien)+'" target="_blank" rel="noopener">voir la publication</a>' : '')
        + '</div>';
    });
    h += '</div>';
  }

  /* les annonces */
  h += '<div class="carte"><div class="etiq">Les nouvelles</div>';
  if(!ANNONCES.length){
    h += '<div class="vide-txt">Rien de neuf pour l\'instant.<br>Revenez : c\'est ici que les nouvelles arrivent en premier.</div>';
  } else {
    ANNONCES.forEach(function(a){
      h += '<div class="annonce">'
        + '<div class="quand">'+esc(a.date)+'</div>'
        + '<h3>'+esc(a.titre)+(a.exclusive?'<span class="excl">exclusif</span>':'')+'</h3>'
        + (a.texte ? '<p>'+esc(a.texte).replace(/\n/g,'<br>')+'</p>' : '')
        + '</div>';
    });
  }
  h += '</div>';

  /* la fiche */
  h += '<div class="carte"><div class="etiq">Vos informations</div>'
    + '<label for="fp">Prénom</label><input id="fp" type="text" maxlength="40" value="'+esc(f.prenom||'')+'">'
    + '<label for="ft">Téléphone</label><input id="ft" type="tel" inputmode="tel" maxlength="25" value="'+esc(f.telephone||'')+'">'
    + '<div style="font-size:12px;color:var(--ink3);margin-top:13px;line-height:1.6">'
    + 'Votre email : '+esc(f.email||'')+'<br>'
    + 'Nous ne conservons rien d\'autre. Pas d\'adresse, pas d\'année de naissance.</div>'
    + '<button class="plein" id="save">Enregistrer</button>'
    + '<div class="msg" id="msgF"></div>'
    + '<div style="display:flex;gap:9px;margin-top:16px;justify-content:center;flex-wrap:wrap">'
    + '<button class="vide" id="sortir">Me déconnecter</button>'
    + '<button class="vide danger" id="effacer">Effacer mon compte</button></div>'
    + '</div>';

  h += '<div class="pied">Brasserie Phoenix · Torrevieja<br>'
    + '<a href="https://www.brasseriephoenix.com" target="_blank" rel="noopener">brasseriephoenix.com</a></div>';

  corps(h);

  el('save').onclick = function(){
    el('save').disabled = true;
    appel({ action:'client_maj', jeton:JETON, prenom:el('fp').value.trim(), telephone:el('ft').value.trim() })
     .then(function(j){
       el('save').disabled = false;
       el('msgF').className = 'msg ' + (j && j.ok ? 'ok' : 'err');
       el('msgF').textContent = j && j.ok ? 'C\'est enregistré.' : 'Un souci. Réessayez.';
       if(j && j.ok){ FICHE = j.fiche; el('sous').textContent = 'Bonjour ' + FICHE.prenom; }
     });
  };
  el('sortir').onclick = function(){
    try{ localStorage.removeItem('phx_client'); }catch(e){}
    JETON = null; FICHE = null; vueEmail('');
  };
  el('effacer').onclick = function(){
    if(!confirm('Effacer votre compte ?\n\nVotre prénom, votre email et votre téléphone seront supprimés, et vos promotions perdues. C\'est sans retour.')) return;
    appel({ action:'client_supprime', jeton:JETON }).then(function(j){
      try{ localStorage.removeItem('phx_client'); }catch(e){}
      JETON = null; FICHE = null;
      corps('<div class="carte"><div class="vide-txt" style="padding:24px 0">'
        + 'Votre compte est effacé.<br><br>Merci d\'être passé — et au plaisir.</div></div>');
      el('sous').textContent = 'Au revoir';
    });
  };
}

/* ─── le démarrage ─────────────────────────────────────────────── */
function charge(){
  corps('<div class="chargement">…</div>');
  appel({ action:'client_fiche', jeton:JETON }).then(function(j){
    if(!j || !j.ok){
      try{ localStorage.removeItem('phx_client'); }catch(e){}
      JETON = null;
      return vueEmail('');
    }
    FICHE = j.fiche; ANNONCES = j.annonces || []; RESEAUX = j.reseaux || [];
    if(!FICHE.prenom) return vueInscription(FICHE.email);
    vueEspace();
  }).catch(function(){
    corps('<div class="carte"><div class="vide-txt">Pas de réseau.<br>Réessayez dans un instant.</div></div>');
  });
}

if(JETON) charge(); else vueEmail('');
})();
</script>
</body>
</html>
